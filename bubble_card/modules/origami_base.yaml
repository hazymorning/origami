origami_base:
  name: "Origami • Base"
  version: "10.0.0"
  supported:
    - button
    - media-player
    - cover
    - climate
    - select
    - calendar
    - sub-buttons
    - separator
  description: "The Base module is the frame for button and media player cards, and it holds the helpers that the other modules share. List Base first on every Origami card except a pop-up, then the card's own module. On separator and sub-buttons cards, Base draws nothing, because Header, Tiles and Button draw those cards. On cover, climate, select and calendar cards, it only styles the sub-buttons. Its options create a slim row, add a pill switch, group the sub-buttons, turn the card into a tile, place the name under the icon or let the card fade in when it appears. With the name under the icon, the bottom sub-buttons form a line of small icons and values, and a sub-button without an action of its own passes the tap to the card. The icon shows Home Assistant's state color while the entity is on, and the controls stay neutral. A sub-button is filled while its entity is on, unless it navigates, opens a URL or opens the more-info dialog. To keep a sub-button neutral, set its css_class to plain. To fill it while its entity is on, even if it navigates, set css_class to accent. Each sub-button can have an origami_base key with name, icon and color. These keys accept a value, a map from the entity's state to a value, or JavaScript in ${ }. The module reference in bubble_card/README.md explains every option."
  editor:
    - name: compact
      label: "Compact"
      selector:
        boolean: {}
      default: false
    - name: toggle
      label: "Pill switch"
      selector:
        boolean: {}
      default: false
    - name: group
      label: "Grouped sub-buttons"
      selector:
        boolean: {}
      default: false
    - name: tile
      label: "Tile"
      selector:
        boolean: {}
      default: false
    - name: solid_controls
      label: "Filled play and power buttons (media cards)"
      selector:
        boolean: {}
      default: false
    - name: vertical
      label: "Name under the icon (button cards)"
      selector:
        boolean: {}
      default: false
    - name: animate
      label: "Fade in"
      selector:
        boolean: {}
      default: false
  code: |
    ${(() => {
      // Base leaves these helpers on card._org for the modules listed after it. They take hass as an argument, so no module reads an earlier render.
      const resting = {
        alarm_control_panel: ["disarmed"], alert: ["idle"], cover: ["closed"], device_tracker: ["not_home"], person: ["not_home"],
        lawn_mower: ["docked", "paused", "idle"], lock: ["locked"], media_player: ["standby", "idle", "paused"],
        vacuum: ["idle", "docked", "paused"], valve: ["closed"]
      };
      const mode = { heating: "heat", preheating: "heat", cooling: "cool", defrosting: "cool", drying: "dry", fan: "fan_only" };
      const coloured = ["alarm_control_panel", "alert", "automation", "binary_sensor", "calendar", "camera", "climate", "cover",
        "device_tracker", "fan", "humidifier", "input_boolean", "lawn_mower", "light", "lock", "media_player", "person", "plant",
        "remote", "schedule", "script", "siren", "sun", "switch", "timer", "update", "vacuum", "valve", "water_heater"];
      const look = (hass, id) => {
        const st = hass.states[id];
        const s = String(st?.state ?? "unavailable").toLowerCase();
        const a = st?.attributes ?? {};
        let d = (id ?? "").split(".")[0];
        if (d === "group") d = String(a.entity_id?.[0] ?? "group.").split(".")[0];
        const act = String(a.hvac_action ?? "").toLowerCase();
        const key = (d === "climate" ? (mode[act] ?? s) : s).replace(/[^a-z0-9]+/g, "_");
        const names = ["--state-" + d + "-" + key + "-color", "--state-" + d + "-active-color", "--state-active-color"];
        if (a.device_class) names.unshift("--state-" + d + "-" + a.device_class + "-" + key + "-color");
        const on = !["unavailable", "unknown", "off"].includes(s) && !(resting[d] ?? []).includes(s)
          && (d !== "climate" || !["", "off", "idle"].includes(act));
        return { on, coloured: coloured.includes(d), lit: on && coloured.includes(d), color: names.reduceRight((acc, n) => acc ? "var(" + n + ", " + acc + ")" : "var(" + n + ")", "") };
      };
      // items() lists the sub-buttons in Bubble Card's numbering. Groups come first, and a sub-buttons card has no main sub-buttons.
      const items = (cfg) => {
        const sb = cfg.sub_button;
        const flat = (list) => [
          ...list.filter((i) => Array.isArray(i?.group)).flatMap((i) => i.group.filter(Boolean)),
          ...list.filter((i) => i && !Array.isArray(i.group))
        ];
        return [
          ...(cfg.card_type === "sub-buttons" ? [] : flat(Array.isArray(sb) ? sb : (sb?.main ?? []))),
          ...flat(Array.isArray(sb) ? [] : (sb?.bottom ?? []))
        ];
      };
      const now = new Date();
      const minutesUntil = (v) => {
        const t = String(v).match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        let end;
        if (t) {
          end = new Date(now);
          end.setHours(Number(t[1]), Number(t[2]), Number(t[3] ?? 0), 0);
          if (end < now) end.setDate(end.getDate() + 1);
        } else {
          end = new Date(String(v).replace(" ", "T"));
        }
        const m = Math.round((end - now) / 60000);
        return Number.isNaN(m) ? "" : m;
      };
      const fill = (strings, ...values) => values.some((v) => v === null || v === undefined || v === "" || Number.isNaN(v))
        ? ""
        : strings.reduce((out, s, i) => out + s + (i < values.length ? values[i] : ""), "");
      const fns = card._orgFns ?? (card._orgFns = new Map());
      // A value is plain text, a map from the state to a value, Jinja, or JavaScript in ${ }. The env argument holds the calling module's hass and renderTemplate.
      const run = (env, v, ctx) => {
        if (typeof v !== "string") return v;
        if (/\{(\{|%)/.test(v)) return env.renderTemplate(v, ctx.entity);
        if (!v.includes("${")) return v;
        let fn = fns.get(v);
        if (!fn) {
          try {
            fn = new Function("fill", "hass", "entity", "state", "attr", "states", "minutesUntil", "return fill`" + v + "`;");
          } catch (e) {
            fn = () => "";
          }
          fns.set(v, fn);
        }
        const states = (id) => env.hass.states[id]?.state ?? "unknown";
        try {
          return fn(fill, env.hass, ctx.entity, ctx.state, ctx.attr, states, (id) => minutesUntil(states(id)));
        } catch (e) {
          return "";
        }
      };
      const value = (env, option, ctx) => {
        if (option === undefined || option === null) return "";
        if (typeof option === "object" && !Array.isArray(option)) {
          const key = String(ctx.state).toLowerCase();
          const hit = Object.keys(option).find((k) => k.toLowerCase() === key);
          return hit === undefined ? "" : run(env, option[hit], ctx);
        }
        return run(env, option, ctx);
      };
      const has = (v) => v !== undefined && v !== null && String(v).trim() !== "";
      // Bubble Card cleans the CSS text, so every character that it could change is escaped
      const str = (v) => '"' + String(v).trim().replace(/[^\p{L}\p{N}%°.:|+-]/gu, (c) => "\\" + c.codePointAt(0).toString(16).padStart(6, "0")) + '"';
      card._org = {
        // A module checks this to know that Base ran before it in the same render
        hass,
        look,
        items,
        run,
        value,
        has,
        str,
        // subs() returns each sub-button with its number, its entity and the values of its own key, such as origami_header
        subs: (env, cfg, key) => items(cfg).map((item, i) => {
          const entity = item.entity ?? cfg.entity;
          const st = env.hass.states[entity];
          const ctx = { entity, state: st?.state ?? "unknown", attr: st?.attributes ?? {} };
          const raw = item[key];
          const opt = raw && typeof raw === "object" ? Object.fromEntries(Object.keys(raw).map((k) => [k, value(env, raw[k], ctx)])) : null;
          return { n: i + 1, item, entity, ctx, opt };
        }),
        // text() returns the rules that show a text in a sub-button instead of its own name or state
        text: (sel, item, text, size) => [
          // Bubble Card hides a sub-button that has nothing of its own to show
          ...(item.visibility ? [] : [sel + ".hidden:not([style*='display: none']) { display: flex !important; }"]),
          sel + " .bubble-sub-button-name-container, " + sel + " .bubble-sub-button-name-container:empty { display: flex !important; font-size: 0 !important; }",
          sel + " .bubble-sub-button-name-container::before { content: " + str(text) + "; display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: " + size + "; }"
        ],
        icon: (el, icon) => {
          if (el && el.getAttribute("icon") !== String(icon)) el.setAttribute("icon", String(icon));
        }
      };
      card._orgV = !!this.config.origami_base?.vertical && (this.config.card_type ?? "button") === "button";
      card._orgT = !!this.config.origami_base?.toggle && !card._orgV;
      card._orgG = !!this.config.origami_base?.group && !card._orgV;
      card._orgC = !!this.config.origami_base?.compact;
      card._orgF = !!this.config.origami_base?.tile;
      card._orgA = !!this.config.origami_base?.animate;
      card._orgFrame = ["button", "media-player"].includes(this.config.card_type ?? "button");
      card._orgFlatMedia = this.config.card_type === "media-player" && !this.config.cover_background
        && !(this.config.modules ?? []).includes("origami_speaker");
      // Header, Tiles and Button draw separator and sub-buttons cards themselves, so Base only gives them its helpers and Fade in
      card._orgBare = ["separator", "sub-buttons"].includes(this.config.card_type);
      const me = look(hass, entity);
      card._orgOn = me.on;
      card._orgLit = me.lit;
      card._orgColor = me.color;
      card._orgDark = !!hass.themes?.darkMode;
      return "";
    })()}
    ${card._orgA ? `
    ha-card {
      animation: origami-in var(--duration-slow) ease-in;
    }
    @keyframes origami-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
    }` : ""}
    ${card._orgBare ? "" : `
    ha-card {
      --bubble-border: var(--border-width) solid var(--border-color);
      --bubble-sub-slider-height: var(--control-height-mini);
      --bubble-slider-fill-color: var(--org-slider-fill);
      --org-slider-fill: color-mix(in srgb, var(--fill-base) 38%, var(--ha-card-background));
      --org-slider-mark: var(--primary-text-color);
      --org-color: ${card._orgColor};
      --org-surface: ${card._orgF ? "var(--tile-background, var(--fill-subtle))" : "var(--ha-card-background)"};
      --org-surface-shadow: ${card._orgF ? "0 0 #0000" : "var(--ha-card-box-shadow)"};
      --org-inset: ${card._orgF ? "var(--tile-chip-background, var(--ha-card-background))" : "var(--fill-subtle)"};
      --org-inset-shadow: ${card._orgF ? "var(--tile-chip-shadow, var(--ha-card-box-shadow))" : "0 0 #0000"};
      --org-field: ${card._orgF ? "var(--tint)" : "color-mix(in srgb, currentColor var(--tint-strength), var(--fill-subtle))"};
      --org-key-field: ${card._orgF ? "color-mix(in srgb, currentColor var(--tint-strength), var(--fill-subtle))" : card._orgDark ? "color-mix(in srgb, currentColor var(--tint-strength), var(--fill-strong))" : "var(--tint)"};
      --org-chip-bg: ${card._orgLit ? "var(--org-field)" : "var(--org-tile-bg, var(--org-inset))"};
      --org-chip-ink: ${card._orgLit ? "var(--org-color)" : "var(--primary-text-color)"};
      --org-key-bg: ${card._orgF ? "var(--fill-subtle)" : card._orgDark ? "var(--fill-strong)" : "var(--ha-card-background)"};
      ${card._orgC ? "--org-row-height: var(--control-height);" : ""}
      ${card._orgC ? "--org-tile-size: var(--org-toggle-h);" : ""}
      ${card._orgC ? "--org-tile-radius: calc(var(--radius-small) + 2px);" : ""}
      ${card._orgC ? "--org-tile-inset: calc((var(--org-row-height) - var(--org-tile-size)) / 2);" : ""}
      ${card._orgC ? "--org-icon-size: var(--icon-size-xs);" : ""}
      ${card._orgC ? "--org-name-size: var(--ha-font-size-m);" : ""}
      ${card._orgC ? "--org-text-gap: calc(var(--org-tile-inset) - var(--ha-space-1));" : ""}
      ${card._orgC ? "--org-state-display: none;" : ""}
      ${card._orgC ? "--org-toggle-w: var(--tile-size);" : ""}
      ${card._orgC ? "--org-toggle-h: var(--icon-size-l);" : ""}
      ${card._orgC ? "--org-toggle-knob: var(--icon-size-s);" : ""}
      ${card._orgC ? "--org-toggle-gap: calc((var(--org-row-height) - var(--org-toggle-h)) / 2);" : ""}
      ${card._orgC ? "--org-text-max: 100%;" : ""}
      ${card._orgV ? "--org-row-height: auto; --org-tile-inset: 0px; --org-state-display: none;" : ""}
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: var(--org-icon-size, var(--icon-size-m));
      color: var(--primary-text-color) !important;
    }
    ${card._orgFrame ? `
    .card-content {
      display: flex;
      align-items: center;
      margin: 0;
      box-shadow: none;
      border-radius: var(--ha-card-border-radius);
    }
    .card-content:not(:has(.with-bottom-buttons)) {
      height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4)));
    }
    .with-bottom-buttons .bubble-content-container,
    .with-bottom-buttons .bubble-sub-button-container.fixed-top {
      height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4)));
      min-height: 0 !important;
      margin-top: 0 !important;
      align-self: flex-start;
      align-items: center !important;
    }
    .bubble-button-card-container,
    .bubble-container {
      min-height: 100% !important;
    }
    .bubble-container {
      box-shadow: var(--org-surface-shadow);
    }
    .bubble-background {
      background-color: var(--org-surface) !important;
    }
    .bubble-button-background {
      opacity: 1 !important;
    }
    ${card._orgFlatMedia ? `
    .bubble-background {
      filter: none !important;
      opacity: 1 !important;
    }` : ""}
    ${card._orgF ? "ha-card .bubble-container { background-color: transparent !important; }" : ""}
    .bubble-icon-container {
      min-width: var(--org-tile-size, var(--tile-size)) !important;
      width: var(--org-tile-size, var(--tile-size)) !important;
      min-height: var(--org-tile-size, var(--tile-size)) !important;
      height: var(--org-tile-size, var(--tile-size)) !important;
      margin: 0 var(--ha-space-1) 0 var(--org-tile-inset, var(--ha-space-4)) !important;
      border-radius: var(--org-tile-radius, var(--radius-inner)) !important;
      color: var(--org-chip-ink) !important;
      background-color: var(--org-chip-bg) !important;
      box-shadow: var(--org-inset-shadow);
      transition: var(--transition-interactive);
    }
    .bubble-icon,
    .bubble-media-button-icon,
    .icon-without-state {
      --mdc-icon-size: var(--org-icon-size, var(--icon-size-m));
      color: var(--primary-text-color) !important;
    }
    .is-off .bubble-main-icon {
      opacity: 1 !important;
    }
    .bubble-main-icon-container .bubble-icon,
    .bubble-main-icon-container .bubble-main-icon {
      color: var(--org-chip-ink) !important;
    }
    .bubble-name-container,
    .bubble-media-info-container {
      gap: var(--ha-space-1) !important;
      margin-left: var(--org-text-gap, var(--ha-space-3));
    }
    .bubble-name,
    .bubble-title {
      font-size: var(--org-name-size, var(--ha-font-size-m));
      font-weight: var(--ha-font-weight-bold);
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-state,
    .bubble-artist {
      display: var(--org-state-display, block) !important;
      max-width: var(--org-text-max, 150px) !important;
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-bold);
      color: var(--secondary-text-color);
      opacity: 1 !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis;
    }
    ${card._orgV ? `
    ha-card .bubble-container {
      height: auto !important;
    }
    ha-card .bubble-wrapper {
      position: relative !important;
      display: grid !important;
      grid-template: "icon more" "name name" "info info" / minmax(0, 1fr) minmax(var(--control-height-icon), auto);
      box-sizing: border-box;
      padding: var(--ha-space-4);
    }
    ha-card .bubble-content-container {
      display: contents !important;
    }
    ha-card .bubble-icon-container {
      grid-area: icon;
    }
    ha-card .bubble-name-container {
      grid-area: name;
      margin: var(--ha-space-5) 0 0 !important;
      line-height: var(--ha-line-height-normal);
    }` : ""}
    ` : ""}
    ha-card .bubble-sub-button {
      color: var(--primary-text-color);
    }
    .bubble-sub-button-name-container {
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-medium);
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    ha-card [class*="bubble-sub-button-slider-"] {
      height: var(--control-height-mini) !important;
      min-height: var(--control-height-mini) !important;
      border-radius: var(--radius-small) !important;
      background-color: var(--org-inset) !important;
      box-shadow: var(--card-ring), var(--org-inset-shadow);
    }
    ha-card .bubble-range-fill {
      position: relative;
    }
    ha-card .bubble-range-fill::after {
      content: "";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: var(--ha-space-2);
      width: 5px;
      height: var(--icon-size-xs);
      border-radius: var(--radius-inner);
      background-color: var(--org-slider-mark);
      opacity: var(--opacity-strong);
    }
    ha-card .bubble-range-fill {
      background-color: var(--org-slider-fill) !important;
      opacity: 1 !important;
    }
    ha-card [class*="bubble-sub-button-slider-"] .bubble-range-fill {
      border-radius: var(--radius-small) 4px 4px var(--radius-small) !important;
    }
    ha-card .bubble-range-value.in-info-wrapper {
      font-size: var(--ha-font-size-s);
    }
    .bubble-sub-button-bottom-container {
      width: calc(100% - 2 * var(--ha-space-4)) !important;
      margin: 0 var(--ha-space-4) var(--ha-space-4) !important;
    }
    ha-card .bubble-sub-slider-wrapper,
    ha-card .bubble-sub-slider-container {
      height: var(--control-height-mini) !important;
      min-height: var(--control-height-mini) !important;
    }
    ${card._orgV ? `
    ha-card .bubble-sub-button-container {
      grid-area: more;
      inset-inline-end: 0 !important;
      align-self: center !important;
      justify-content: center !important;
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) {
      min-width: 0 !important;
      height: auto !important;
      padding: 0 !important;
      background: none !important;
      transition: var(--transition-interactive) !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--icon-size-l);
      opacity: var(--opacity-quiet);
    }
    ha-card .bubble-sub-button-bottom-container {
      grid-area: info;
      position: static !important;
      flex-wrap: wrap !important;
      gap: var(--ha-space-2) var(--ha-space-1) !important;
      width: auto !important;
      min-height: calc(var(--ha-font-size-s) * var(--ha-line-height-normal));
      margin: var(--ha-space-2) 0 0 !important;
    }
    ha-card .bubble-sub-button-alignment-lane,
    ha-card .bubble-sub-button-group {
      display: contents !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      flex: 0 0 auto !important;
      color: var(--secondary-text-color) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--dot-size);
      margin-block: 0 2px !important;
      margin-inline: 0 var(--ha-space-1) !important;
    }
    ha-card .bubble-icon-container:not(.bubble-action-enabled),
    ha-card .bubble-sub-button-container,
    ha-card .bubble-sub-button.bubble-action:not(.bubble-action-enabled):not(.is-select) {
      pointer-events: none;
    }
    ha-card .bubble-sub-button.bubble-action-enabled,
    ha-card .bubble-sub-button-container .bubble-sub-slider-wrapper.inline {
      pointer-events: auto;
    }` : card._orgT ? `
    .bubble-sub-button-container {
      margin-right: var(--org-toggle-gap, calc(var(--ha-space-4) + var(--ha-space-2))) !important;
      inset-inline-end: 0 !important;
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-sizing: border-box;
      min-width: unset !important;
      width: var(--org-toggle-w, calc(var(--tile-size) + var(--ha-space-2))) !important;
      height: var(--org-toggle-h, var(--control-height-mini)) !important;
      padding: var(--ha-space-1);
      border-radius: var(--radius-inner) !important;
      color: ${card._orgOn ? "var(--text-color-active)" : "var(--primary-text-color)"};
      background-color: ${card._orgOn ? "var(--fill-active)" : "var(--org-inset)"} !important;
      box-shadow: var(--card-ring), var(--org-inset-shadow);
      transition: var(--transition-interactive);
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) .bubble-sub-button-icon {
      --mdc-icon-size: var(--org-toggle-knob, var(--icon-size-m));
      margin-left: ${card._orgOn ? "calc(var(--org-toggle-w, calc(var(--tile-size) + var(--ha-space-2))) - 2 * var(--ha-space-1) - var(--org-toggle-knob, var(--icon-size-m)))" : "0px"} !important;
      opacity: ${card._orgOn ? "1" : "var(--opacity-quiet)"} !important;
      color: ${card._orgOn ? "var(--text-color-active)" : "var(--primary-text-color)"} !important;
      transition: all var(--duration-normal) var(--ease-standard);
    }` : `
    ${card._orgFrame ? `
    ha-card .bubble-sub-button-container {
      margin-right: var(--org-tile-inset, var(--ha-space-4)) !important;
      inset-inline-end: 0 !important;
    }` : ""}
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: var(--org-tile-size, var(--tile-size)) !important;
      width: auto !important;
      height: var(--org-tile-size, var(--tile-size)) !important;
      padding: 0 var(--ha-space-2) !important;
