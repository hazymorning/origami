      return [...rules, ...org.values(env, this.config, "origami_base", "ha-card", "var(--org-sub-text, var(--ha-font-size-s))", list)].join("\n");
    })()}
    ${(() => {
      const org = card._org;
      // The keys of a play row show their state with dot and disabled, so Base never fills them
      const plays = org.classed(this.config, "play");
      // A module that styles the bottom sub-buttons itself, such as Button on a button card, sets data-org-fill="bottom", so Base fills only the main sub-buttons there
      const keep = ':not(.is-select):not(.readout):not(.plain)' + org.key + (plays.length ? ":not(:where(.bubble-sub-button-group:has(> :is(" + plays.join(", ") + ")) > *))" : "");
      // A module that styles its own sub-buttons sets data-org-fill="own" on the card. There, only a sub-button that sets a value or has accent is filled.
      const auto = 'ha-card:not([data-org-fill="own"])';
      // The pill switches are filled while their entity is on. Otherwise, why() decides for each sub-button, and under the icon only accent fills.
      const sel = org.opts.toggle ? [...org.pills] : [];
      if (!org.opts.toggle) card._orgSubs.forEach(({ n, item, opt }) => {
        const r = (!org.opts.vertical || org.slug(item.css_class) === "accent") && org.why(hass, item, item.entity ?? entity, opt);
        if (!r) return;
        const one = " .bubble-sub-button.bubble-sub-button-" + n + keep;
        sel.push(r === "set" ? "ha-card" + one : r === "accent" ? "ha-card" + one + ".accent:is(.background-on, .background-off)" : auto + one + ":is(.background-on, .background-off)");
      });
      return org.fill(sel);
    })()}
    `}
    `}
