      margin-inline-start: calc(var(--org-toggle-w, calc(var(--tile-size) + var(--ha-space-2))) - 2 * var(--ha-space-1) - var(--org-toggle-knob, var(--icon-size-m))) !important;
      opacity: 1 !important;
      color: var(--text-color-active) !important;
    }` : ""}` : `
    ${card._org.opts.frame ? `
    ha-card .bubble-sub-button-container {
      margin-inline-end: var(--org-tile-inset, var(--ha-space-4)) !important;
      inset-inline-end: 0 !important;
    }` : ""}
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      min-width: var(--org-tile-size, var(--tile-size)) !important;
      width: auto !important;
      height: var(--org-tile-size, var(--tile-size)) !important;
      padding: 0 var(--ha-space-2) !important;
      border-radius: var(--radius-inner) !important;
      background: none !important;
      box-shadow: none !important;
      transition: var(--transition-interactive);
    }
    ha-card .bubble-sub-button.background-on:not([class*="bubble-sub-button-slider-"]),
    ha-card .bubble-sub-button.background-off:not([class*="bubble-sub-button-slider-"]) {
      background-color: var(--org-tile-bg, var(--org-inset)) !important;
      box-shadow: var(--org-inset-shadow) !important;
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) .bubble-sub-button-icon {
      --mdc-icon-size: var(--org-icon-size, var(--icon-size-m));
      margin: 0 !important;
      color: var(--primary-text-color) !important;
    }
    `}
    ${card._org.opts.group ? `
    ha-card {
      --org-group-key: min(var(--control-height-mini), var(--org-tile-size, var(--tile-size)));
      --org-group-pad: calc((var(--org-tile-size, var(--tile-size)) - var(--org-group-key)) / 2);
    }
    ha-card .bubble-sub-button-container {
      --bubble-sub-button-outline: none;
      height: var(--org-tile-size, var(--tile-size)) !important;
      align-items: center;
      padding: 0 var(--org-group-pad) !important;
      gap: var(--ha-space-1) !important;
      background-color: var(--org-inset) !important;
      box-shadow: var(--org-inset-shadow);
      border-radius: var(--radius-inner) !important;
    }
    ha-card .with-bottom-buttons .bubble-sub-button-container.fixed-top {
      height: var(--org-tile-size, var(--tile-size)) !important;
      margin-top: calc((var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4))) - var(--org-tile-size, var(--tile-size))) / 2) !important;
      align-self: flex-start;
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) {
      box-sizing: border-box;
      min-width: var(--org-group-key) !important;
      width: auto !important;
      height: var(--org-group-key) !important;
      padding: 0 var(--ha-space-1) !important;
      border-radius: var(--radius-small) !important;
      background: none !important;
      box-shadow: none !important;
    }
    ha-card .bubble-sub-button.background-on:not([class*="bubble-sub-button-slider-"]),
    ha-card .bubble-sub-button.background-off:not([class*="bubble-sub-button-slider-"]) {
      background-color: var(--org-key-bg) !important;
    }
    ha-card .bubble-sub-button:not([class*="bubble-sub-button-slider-"]) .bubble-sub-button-icon {
      --mdc-icon-size: var(--icon-size-xs);
      margin: 0 !important;
    }
    ha-card .bubble-sub-button-name-container {
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-bold);
    }
    ` : ""}
    ${(() => {
      const org = card._org;
      const rules = [];
      org.subs({ hass, renderTemplate }, this.config, "origami_base").forEach(({ n, item, entity, opt }) => {
        const sel = "ha-card .bubble-sub-button.bubble-sub-button-" + n;
        // Under the icon, a sub-button without an action of its own passes the tap to the card
        const select = item.sub_button_type === "select" || (!item.sub_button_type && (["input_select", "select"].includes(String(entity ?? "").split(".")[0]) || item.select_attribute));
        if (card._org.opts.vertical && !select && (item.sub_button_type ?? "default") === "default" && !item.tap_action && !item.hold_action && !item.double_tap_action) rules.push(sel + " { pointer-events: none !important; }");
        if (!opt) return;
        if (org.has(opt.name)) rules.push(...org.text(sel, item, opt.name, "var(--ha-font-size-s)"));
        if (org.has(opt.color)) rules.push(sel + " .bubble-sub-button-icon:not(.hidden) { color: " + opt.color + " !important; }");
        if (org.has(opt.icon)) org.icon(card.querySelector(".bubble-sub-button-" + n + " .bubble-sub-button-icon"), opt.icon);
      });
      return rules.join("\n");
    })()}
    ${(() => {
      if (card._org.opts.toggle) return "";
      const org = card._org;
      const keep = ':not(.is-select):not(.readout):not(.plain):not([class*="bubble-sub-button-slider-"])';
      const sel = [];
      // A sub-button that sets a value, such as a fan speed or a source, is filled while that value is set. Any other sub-button is filled while its entity is on, unless it opens something, and accent fills it even then. A module that styles its own sub-buttons sets data-org-fill="own" on the card. There, only a sub-button that sets a value or has accent is filled.
      const auto = 'ha-card:not([data-org-fill="own"])';
      org.items(this.config).forEach((item, i) => {
        const id = item.entity ?? entity;
        const one = " .bubble-sub-button.bubble-sub-button-" + (i + 1) + keep;
        const set = org.matches(hass, item, id);
        if (set !== null) {
          if (set && !card._org.opts.vertical) sel.push("ha-card" + one);
          return;
        }
        if (!org.look(hass, id).lit) return;
        if (!card._org.opts.vertical && !org.links.includes(org.act(item).action)) sel.push(auto + one + ":is(.background-on, .background-off)");
        sel.push("ha-card" + one + ".accent:is(.background-on, .background-off)");
      });
      if (!sel.length) return "";
      return "    " + sel.join(",\n    ") + " {\n      color: var(--text-color-active) !important;\n      background-color: var(--fill-active) !important;\n    }\n    "
        + sel.flatMap((s) => [s + " .bubble-sub-button-icon", s + " .bubble-sub-button-name-container"]).join(",\n    ") + " {\n      color: var(--text-color-active) !important;\n      opacity: 1 !important;\n    }\n";
    })()}
    `}
