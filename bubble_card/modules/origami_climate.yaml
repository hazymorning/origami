origami_climate:
  name: "Origami • Climate"
  version: "3.1.0"
  supported:
    - button
  description: "Climate shows what a thermostat does. The state line names the action, such as heating, and a sub-button with css_class readout shows the target temperature. The icons option sets an icon for an action or a state."
  editor:
    - name: icons
      label: "Icons (a map from an action or a state to an icon)"
      selector:
        object: {}
  code: |-
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_climate needs origami_base 12 or later, listed before it");
      // The thermostat's plus and minus buttons stay neutral while it works
      if (card.dataset.orgFill !== "own") card.dataset.orgFill = "own";
      const st = hass.states[entity];
      const look = org.me;
      const act = look.action ?? "";
      // Without an icon of the card's own, the icon shows what the thermostat does, with Home Assistant's icons for the actions. The Icons option replaces any of them.
      const builtin = this.config.icon ? {} : { heating: "mdi:fire", preheating: "mdi:heat-wave", cooling: "mdi:snowflake", drying: "mdi:water-percent", fan: "mdi:fan", defrosting: "mdi:snowflake-melt" };
      const working = look.on && act !== "" && !["idle", "off"].includes(act);
      const off = look.available && (st.state === "off" || act === "off");
      const key = !look.available ? "unavailable" : working ? act : off ? "off" : act || st.state;
      card._orgCl = { off };
      org.icon(icon, org.pick(this.config.origami_climate?.icons, key, true) ?? builtin[key] ?? null);
      // Bubble Card hands the state line to a module whose code contains this exact assignment
      const line = !look.available || off || !act ? org.word(hass, st) : org.word(hass, st, "hvac_action");
      if (org.fresh(card.querySelector('.bubble-state'), line)) card.querySelector('.bubble-state').textContent = line;
      // Each readout shows the target of its own thermostat, or the range of one with a low and a high target. The range stays in this order in right-to-left languages.
      org.readouts(hass, this.config, entity, (t) => {
        const a = t?.attributes ?? {};
        const low = a.target_temp_low, high = a.target_temp_high;
        return a.temperature != null ? org.num(hass, a.temperature) + "°"
          : low != null && high != null ? "\u2066" + org.num(hass, low) + "–" + org.num(hass, high) + "°\u2069" : "–";
      });
      return "";
    })()}
    ha-card .bubble-icon-container.bubble-main-icon-container .bubble-icon,
    ha-card .bubble-icon-container.bubble-main-icon-container .bubble-main-icon {
      opacity: ${card._orgCl.off ? "var(--opacity-muted)" : "1"} !important;
    }
