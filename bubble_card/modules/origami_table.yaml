origami_table:
  name: "Origami • Table"
  version: "1.4.2"
  supported:
    - sub-buttons
  description: "Table turns a sub-buttons card into a table. Each group of sub-buttons is a row, and each sub-button is a cell. The cells fill the columns in order, and each column can set its width, its alignment and what its cells show. A wide table scrolls under its first column."
  editor:
    - name: columns
      label: "Columns"
      selector:
        object:
          multiple: true
          label_field: name
          description_field: width
          fields:
            name:
              label: "Name"
              description: "A cell whose css_class has this name joins the column. The other cells fill the columns in order."
              selector:
                text: {}
            width:
              label: "Width"
              default: auto
              selector:
                select:
                  mode: dropdown
                  custom_value: true
                  options:
                    - label: "Fits its widest cell"
                      value: auto
                    - label: "Takes the free space"
                      value: 1fr
            align:
              label: "Alignment"
              description: "Without a choice, the first column is at the start and the others are in the center."
              selector:
                select:
                  mode: dropdown
                  options:
                    - label: Start
                      value: start
                    - label: Center
                      value: center
                    - label: End
                      value: end
            icon:
              label: "Icon"
              group: "Cells"
              selector:
                icon: {}
            icon_states:
              label: "Icon for each state"
              variant_of: icon
              variant: "By state"
              selector:
                object: {}
            icon_template:
              label: "Icon template"
              variant_of: icon
              variant: "Template"
              selector:
                template: {}
            text:
              label: "Text"
              group: "Cells"
              selector:
                text: {}
            text_states:
              label: "Text for each state"
              variant_of: text
              variant: "By state"
              selector:
                object: {}
            text_template:
              label: "Text template"
              variant_of: text
              variant: "Template"
              selector:
                template: {}
            color:
              label: "Icon color"
              group: "Cells"
              selector:
                text: {}
            color_states:
              label: "Icon color for each state"
              variant_of: color
              variant: "By state"
              selector:
                object: {}
            color_template:
              label: "Icon color template"
              variant_of: color
              variant: "Template"
              selector:
                template: {}
            "on":
              label: "Stands out while this template is true"
              group: "Cells"
              selector:
                template: {}
    - name: stripes
      label: "Striped rows"
      selector:
        boolean: {}
      default: true
    - name: anchor
      label: "The first column as a card, also while the table fits its card"
      selector:
        boolean: {}
      default: false
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 13.1)) throw new Error("origami_table needs origami_base 13.1 or later");
      const env = org.env;
      const cfg = this.config.origami_table ?? {};
      // columns is a list. Each column has a name, a width, an alignment and values for its cells.
      const cols = (Array.isArray(cfg.columns) ? cfg.columns : []).map((c, i) => ({
        key: org.slug(c?.name), n: i + 1, width: org.has(c?.width) ? String(c.width).trim() : "auto", align: c?.align,
        raw: Object.fromEntries(Object.entries(c ?? {}).filter(([k]) => !["name", "width", "align"].includes(k)))
      }));
      // A value is fixed, a map from the state or a template. The card editor keeps the map under the key with _states and the template under the key with _template. A template wins over a map, and a map wins over a fixed value.
      const sets = (o, k) => [k, k + "_states", k + "_template"].some((x) => x in o);
      const pick = (o, k) => [o[k + "_template"], o[k + "_states"], o[k]].find(org.has);
      // Each group is a row, and a sub-button outside a group is a row of its own, unless no row is a group
      const { bottom } = org.layout(this.config);
      const rows = bottom.some((x) => x.group) ? bottom.map((x) => x.n) : [bottom.flatMap((x) => x.n)];
      const pos = new Map(rows.flatMap((r) => r.map((n, i) => [n, i])));
      const scope = "ha-card .bubble-sub-button-bottom-container";
      const align = { start: "flex-end", center: "center", end: "flex-start" };
      const rules = [];
      const firsts = [];
      let count = Math.max(cols.length, 1);
      const list = org.subs(env, this.config, "origami_table").map((s) => {
        const place = pos.get(s.n) ?? 0;
        // A cell joins the column that its css_class names, or else the column at its place in the row. A hidden cell keeps its column, so the cells after it stay in theirs.
        const col = cols.find((c) => c.key && c.key === org.slug(s.item.css_class)) ?? cols[place];
        const n = col?.n ?? place + 1;
        count = Math.max(count, n);
        // A cell takes its column's values, and a value that the cell sets itself wins
        const given = Object.fromEntries(Object.keys(col?.raw ?? {}).map((k) => [k, org.value(env, col.raw[k], s.ctx)]));
        const mine = s.opt ?? {};
        const from = (k) => sets(mine, k) ? mine : given;
        const opt = Object.fromEntries([["icon", "icon"], ["name", "text"], ["color", "color"], ["name_color", "name_color"], ["background", "background"]]
          .map(([to, k]) => [to, pick(from(k), k)]).filter(([, v]) => v !== undefined));
        // The first column holds the row's name
        const first = n === 1;
        const side = col?.align ?? (first ? "start" : "center");
        const item = s.item;
        const text = org.has(opt.name) || org.shows(item);
        const look = org.look(hass, s.entity);
        // The on value decides whether the cell stands out, even while it is empty. Without it, a cell whose entity is on takes its state color.
        const on = sets(from("on"), "on") ? org.yes(pick(from("on"), "on")) : null;
        const lit = on === null && !!s.entity && look.lit;
        const own = ["justify-content: " + (align[side] ?? "center") + " !important", "grid-column: " + n];
        // Names and cells with only an icon use the text color, and values use the secondary text color
        if (first || !text || on || lit) own.push("color: var(--primary-text-color) !important");
        // A cell with only an icon is a square with the icon in its middle, and a cell with text is as wide as its content, so a fill
        // hugs its value and never stretches across its column. The first column's cells fill their column, because the card behind
        // them is as wide as they are.
        const self = "justify-self: " + ({ start: "start", end: "end" }[side] ?? "center");
        if (!text) own.push("width: var(--org-cell) !important", "min-width: 0 !important", "padding: 0 !important", "gap: 0 !important", "justify-content: center !important", self);
        else if (!first) own.push(self);
        // A cell that stands out is a flat fill on every row. The stripes only lead the eye along a row, so a column looks the same on all of them.
        if (on) own.push("--org-cell-bg: var(--fill-subtle)");
        if (lit) own.push("--org-cell-ink: " + look.color, "--org-cell-bg: color-mix(in srgb, " + look.color + " var(--tint-strength), var(--ha-card-background))");
        // The icon next to a value is muted, unless the cell stands out or has a color of its own
        if (text && !on && !lit && !org.has(opt.color)) own.push("--org-cell-icon: var(--opacity-muted)");
        const obj = hass.states[s.entity];
        if (s.entity && (!obj || obj.state === "unavailable")) own.push("opacity: var(--opacity-disabled)");
        rules.push(scope + " .bubble-sub-button.bubble-sub-button-" + s.n + " { " + own.join("; ") + "; }");
        if (first) firsts.push(scope + " .bubble-sub-button.bubble-sub-button-" + s.n);
        return { ...s, opt };
      });
      // The cells' text, icon, color, name_color and background work as the name, icon, color, name_color and background of a value in Header
      rules.push(...org.values(env, this.config, "origami_table", scope, "var(--ha-font-size-s)", list));
      // A table wider than its card scrolls sideways, and its first column stays in place. While more columns follow at the end,
      // the table fades out there. The card knows both from its rows, so a table that fits looks as before.
      const box = card.querySelector(".bubble-sub-button-bottom-container");
      if (box) {
        const check = box._orgFit ?? (box._orgFit = () => {
          const wide = box.scrollWidth > box.clientWidth + 1;
          card.toggleAttribute("data-org-wide", wide);
          card.toggleAttribute("data-org-end", !wide || Math.abs(box.scrollLeft) + box.clientWidth >= box.scrollWidth - 1);
          // The card behind the first column is as tall as the rows that show
          const rows = wide || cfg.anchor === true ? box.querySelectorAll(":scope > .bubble-sub-button-group:not(.hidden)") : [];
          const h = rows.length ? rows[rows.length - 1].offsetTop + rows[rows.length - 1].offsetHeight - rows[0].offsetTop + "px" : "";
          if (card.style.getPropertyValue("--org-table-h") !== h) card.style.setProperty("--org-table-h", h);
        });
        if (!box._orgWatch) {
          box._orgWatch = true;
          box.addEventListener("scroll", check, { passive: true });
          const ro = typeof ResizeObserver === "function" ? new ResizeObserver(check) : null;
          ro?.observe(box);
          if (typeof onTeardown === "function") onTeardown(() => { ro?.disconnect(); box.removeEventListener("scroll", check); box._orgWatch = false; });
        }
        requestAnimationFrame(check);
      }
      card._orgT = {
        template: [...cols.map((c) => c.width), ...Array(count - cols.length).fill("auto")].join(" "),
        stripes: cfg.stripes ?? true,
        // The first column stands as a card while the table scrolls, and with anchor also while it fits
        anchor: cfg.anchor === true ? "ha-card" : "ha-card[data-org-wide]",
        firsts,
        rules: rules.join("\n    ")
      };
      return "";
    })()}
    ha-card {
      --org-cell: var(--icon-size-m);
    }
    ${card._org.unframe()}
    ha-card .bubble-sub-button-bottom-container {
      display: grid !important;
      grid-template-columns: ${card._orgT.template};
      justify-content: normal !important;
      gap: 0 var(--ha-space-1) !important;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: var(--ha-card-border-radius);
    }
    ha-card[data-org-wide] .bubble-sub-button-bottom-container {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    ha-card[data-org-wide]:not([data-org-end]) .bubble-sub-button-bottom-container {
      mask-image: linear-gradient(to right, black calc(100% - var(--ha-space-8, 32px)), transparent 100%);
    }
    ha-card[data-org-wide]:not([data-org-end]):dir(rtl) .bubble-sub-button-bottom-container {
      mask-image: linear-gradient(to left, black calc(100% - var(--ha-space-8, 32px)), transparent 100%);
    }
    /* While the table scrolls, its first column stays at the start as a card, an anchor for the columns that pass under it: the card background with the card's shadow and round corners, as the cards around it have. The first row's cell draws the card behind the whole column, as tall as the rows, so it is one card with one shadow. The card keeps 8 px more room before the next column, and the table keeps room below it for its shadow. Its first and last rows take the table's round corners. */
    ${card._orgT.firsts.length ? `${card._orgT.anchor} .bubble-sub-button-bottom-container {
      padding: 0 0 var(--ha-space-4) 0 !important;
      margin-bottom: calc(-1 * var(--ha-space-4)) !important;
      border-radius: 0;
    }
    ${card._orgT.anchor} .bubble-sub-button-bottom-container .bubble-sub-button-group:nth-child(1 of :not(.hidden)) {
      border-start-start-radius: var(--ha-card-border-radius);
      border-start-end-radius: var(--ha-card-border-radius);
    }
    ${card._orgT.anchor} .bubble-sub-button-bottom-container .bubble-sub-button-group:nth-last-child(1 of :not(.hidden)) {
      border-end-start-radius: var(--ha-card-border-radius);
      border-end-end-radius: var(--ha-card-border-radius);
    }
    ` + card._org.each(card._orgT.firsts.map((s) => card._orgT.anchor + " " + s.replace(/^ha-card /, "")), "") + ` {
      position: sticky !important;
      inset-inline-start: 0;
      z-index: 1;
      align-self: stretch;
      height: auto !important;
      margin-inline: calc(-1 * var(--ha-space-2)) var(--ha-space-2) !important;
      padding: 0 calc(var(--ha-space-2) + 6px) 0 calc(var(--ha-space-2) + 6px) !important;
      border-radius: 0 !important;
      background: none !important;
      overflow: visible !important;
    }
    ` + card._org.each(card._orgT.firsts.map((s) => card._orgT.anchor + " .bubble-sub-button-group:nth-child(1 of :not(.hidden)) " + s.replace(/^ha-card .bubble-sub-button-bottom-container /, "")), "::before") + ` {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 0;
      z-index: -1;
      height: var(--org-table-h, 100%);
      border-radius: var(--ha-card-border-radius);
      /* The card is drawn as an image, so it is a surface and no control's fill */
      background-image: linear-gradient(var(--ha-card-background), var(--ha-card-background));
      box-shadow: var(--ha-card-box-shadow);
      pointer-events: none;
    }
    ` + card._org.each(card._orgT.firsts.map((s) => card._orgT.anchor + " .bubble-sub-button-group:nth-child(1 of :not(.hidden)) " + s.replace(/^ha-card .bubble-sub-button-bottom-container /, "")), "::after") + ` {
      content: "";
      position: absolute;
      top: 0;
      inset-inline: 0;
      z-index: -2;
      height: var(--org-table-h, 100%);
      /* Under the card, the rows' colors on the color behind the table, the pop-up's or the page's, so nothing that passes under the card shows beside its round corners. Beside its corners at the start, the table ends, so the color behind the table fills them, also while the rows are scrolled to the side. */
      background-image: radial-gradient(circle at 100% 100%, transparent calc(var(--ha-card-border-radius) - 0.5px), var(--org-page, var(--primary-background-color)) var(--ha-card-border-radius)), radial-gradient(circle at 100% 0, transparent calc(var(--ha-card-border-radius) - 0.5px), var(--org-page, var(--primary-background-color)) var(--ha-card-border-radius)), ${card._orgT.stripes ? "repeating-linear-gradient(to bottom, transparent 0, transparent var(--control-height-icon), var(--fill-subtle) var(--control-height-icon), var(--fill-subtle) calc(2 * var(--control-height-icon))), " : ""}linear-gradient(var(--org-page, var(--primary-background-color)), var(--org-page, var(--primary-background-color)));
      background-size: var(--ha-card-border-radius) var(--ha-card-border-radius), var(--ha-card-border-radius) var(--ha-card-border-radius), auto, auto;
      background-position: left top, left bottom, 0 0, 0 0;
      background-repeat: no-repeat, no-repeat, repeat, repeat;
      pointer-events: none;
    }
    ` + card._org.each(card._orgT.firsts.map((s) => card._orgT.anchor + ":dir(rtl) .bubble-sub-button-group:nth-child(1 of :not(.hidden)) " + s.replace(/^ha-card .bubble-sub-button-bottom-container /, "")), "::after") + ` {
      background-image: radial-gradient(circle at 0 100%, transparent calc(var(--ha-card-border-radius) - 0.5px), var(--org-page, var(--primary-background-color)) var(--ha-card-border-radius)), radial-gradient(circle at 0 0, transparent calc(var(--ha-card-border-radius) - 0.5px), var(--org-page, var(--primary-background-color)) var(--ha-card-border-radius)), ${card._orgT.stripes ? "repeating-linear-gradient(to bottom, transparent 0, transparent var(--control-height-icon), var(--fill-subtle) var(--control-height-icon), var(--fill-subtle) calc(2 * var(--control-height-icon))), " : ""}linear-gradient(var(--org-page, var(--primary-background-color)), var(--org-page, var(--primary-background-color)));
      background-position: right top, right bottom, 0 0, 0 0;
    }` : ""}
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-alignment-lane {
      display: contents !important;
    }
    /* Each row is a subgrid, so every column is as wide as its widest cell in any row. A row keeps the table's gap, because a gap of its own would add space around every cell. */
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(.hidden) {
      grid-column: 1 / -1;
      display: grid !important;
      grid-template-columns: subgrid;
      gap: normal !important;
      align-items: center;
      box-sizing: border-box;
      width: auto !important;
      height: var(--control-height-icon);
      padding: 0 var(--ha-space-2);
    }
    ${card._orgT.stripes ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:nth-child(even of :not(.hidden)) {
      background-color: var(--fill-subtle);
    }` : ""}
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      box-sizing: border-box;
      gap: var(--ha-space-1);
      width: auto !important;
      min-width: auto !important;
      height: var(--org-cell) !important;
      margin: 0 !important;
      padding: 0 6px !important;
      border-radius: calc(var(--org-cell) * var(--radius-ratio)) !important;
      background: var(--org-value-chip, var(--org-cell-bg, transparent)) !important;
      box-shadow: none !important;
      color: var(--secondary-text-color) !important;
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      font-variant-numeric: tabular-nums;
      white-space: nowrap !important;
      transition: var(--transition-interactive) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      transform: scale(var(--press-scale));
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--icon-size-2xs) !important;
      display: flex !important;
      margin: 0 !important;
      color: var(--org-cell-ink, currentColor) !important;
      opacity: var(--org-cell-icon, 1) !important;
    }
    /* A cell is never narrower than its text, so its column fits it. A text that Bubble Card measured too wide before these styles applied stops scrolling at the next measurement. */
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-name-container {
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      color: inherit !important;
    }
    ${card._orgT.rules}
