origami_table:
  name: "Origami • Table"
  version: "1.0.2"
  supported:
    - sub-buttons
  description: "Table turns a sub-buttons card into a table. Each group of sub-buttons is a row, and each sub-button is a cell. The cells fill the columns in order, and each column can set its width, its alignment and what its cells show."
  editor:
    - name: columns
      label: "Columns"
      selector:
        object:
          multiple: true
          label_field: name
          description_field: width
          fields:
            name:
              label: "Name"
              description: "A cell whose css_class has this name joins the column. The other cells fill the columns in order."
              selector:
                text: {}
            width:
              label: "Width"
              default: auto
              selector:
                select:
                  mode: dropdown
                  custom_value: true
                  options:
                    - label: "Fits its widest cell"
                      value: auto
                    - label: "Takes the free space"
                      value: 1fr
            align:
              label: "Alignment"
              description: "Without a choice, the first column is at the start and the others are in the center."
              selector:
                select:
                  mode: dropdown
                  options:
                    - label: Start
                      value: start
                    - label: Center
                      value: center
                    - label: End
                      value: end
            icon:
              label: "Icon"
              group: "Cells"
              selector:
                icon: {}
            icon_states:
              label: "Icon for each state"
              variant_of: icon
              variant: "By state"
              selector:
                object: {}
            icon_template:
              label: "Icon template"
              variant_of: icon
              variant: "Template"
              selector:
                template: {}
            text:
              label: "Text"
              group: "Cells"
              selector:
                text: {}
            text_states:
              label: "Text for each state"
              variant_of: text
              variant: "By state"
              selector:
                object: {}
            text_template:
              label: "Text template"
              variant_of: text
              variant: "Template"
              selector:
                template: {}
            color:
              label: "Icon color"
              group: "Cells"
              selector:
                text: {}
            color_states:
              label: "Icon color for each state"
              variant_of: color
              variant: "By state"
              selector:
                object: {}
            color_template:
              label: "Icon color template"
              variant_of: color
              variant: "Template"
              selector:
                template: {}
            "on":
              label: "Stands out while this template is true"
              group: "Cells"
              selector:
                template: {}
    - name: stripes
      label: "Striped rows"
      selector:
        boolean: {}
      default: true
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 13)) throw new Error("origami_table needs origami_base 13 or later");
      const env = org.env;
      const cfg = this.config.origami_table ?? {};
      // columns is a list. Each column has a name, a width, an alignment and values for its cells.
      const cols = (Array.isArray(cfg.columns) ? cfg.columns : []).map((c, i) => ({
        key: org.slug(c?.name), n: i + 1, width: org.has(c?.width) ? String(c.width).trim() : "auto", align: c?.align,
        raw: Object.fromEntries(Object.entries(c ?? {}).filter(([k]) => !["name", "width", "align"].includes(k)))
      }));
      // A value is fixed, a map from the state or a template. The card editor keeps the map under the key with _states and the template under the key with _template. A template wins over a map, and a map wins over a fixed value.
      const sets = (o, k) => [k, k + "_states", k + "_template"].some((x) => x in o);
      const pick = (o, k) => [o[k + "_template"], o[k + "_states"], o[k]].find(org.has);
      // Each group is a row. Bubble Card numbers the sub-buttons of the groups first, and a sub-button outside a group is a row of its own, unless no row is a group.
      const bottom = Array.isArray(this.config.sub_button) ? [] : this.config.sub_button?.bottom ?? [];
      const groups = bottom.filter((g) => Array.isArray(g?.group)).map((g) => g.group.filter(Boolean));
      const loose = bottom.filter((g) => g && !Array.isArray(g.group));
      const rows = groups.length ? [...groups, ...loose.map((g) => [g])] : [loose];
      const pos = rows.flatMap((r) => r.map((_, i) => i));
      const scope = "ha-card .bubble-sub-button-bottom-container";
      const align = { start: "flex-end", center: "center", end: "flex-start" };
      const rules = [];
      let count = Math.max(cols.length, 1);
      const list = org.subs(env, this.config, "origami_table").map((s) => {
        const place = pos[s.n - 1] ?? 0;
        // A cell joins the column that its css_class names, or else the column at its place in the row. A hidden cell keeps its column, so the cells after it stay in theirs.
        const col = cols.find((c) => c.key && c.key === org.slug(s.item.css_class)) ?? cols[place];
        const n = col?.n ?? place + 1;
        count = Math.max(count, n);
        // A cell takes its column's values, and a value that the cell sets itself wins
        const given = Object.fromEntries(Object.keys(col?.raw ?? {}).map((k) => [k, org.value(env, col.raw[k], s.ctx)]));
        const mine = s.opt ?? {};
        const from = (k) => sets(mine, k) ? mine : given;
        const opt = Object.fromEntries([["icon", "icon"], ["name", "text"], ["color", "color"], ["name_color", "name_color"], ["background", "background"]]
          .map(([to, k]) => [to, pick(from(k), k)]).filter(([, v]) => v !== undefined));
        // The first column holds the row's name
        const first = n === 1;
        const side = col?.align ?? (first ? "start" : "center");
        const item = s.item;
        const text = org.has(opt.name) || org.shows(item);
        const look = org.look(hass, s.entity);
        // The on value decides whether the cell stands out, even while it is empty. Without it, a cell whose entity is on takes its state color.
        const on = sets(from("on"), "on") ? org.yes(pick(from("on"), "on")) : null;
        const lit = on === null && !!s.entity && look.lit;
        const own = ["justify-content: " + (align[side] ?? "center") + " !important", "grid-column: " + n];
        // Names and cells with only an icon use the text color, and values use the secondary text color
        if (first || !text || on || lit) own.push("color: var(--primary-text-color) !important");
        // A cell with only an icon is a square, and a cell in a column that takes the free space keeps the width of its text, so a fill never stretches across a wide column
        const self = "justify-self: " + ({ start: "start", end: "end" }[side] ?? "center");
        if (!text) own.push("width: var(--org-cell) !important", "min-width: 0 !important", "padding: 0 !important", self);
        else if (/fr\b/.test(col?.width ?? "")) own.push(self);
        if (on) own.push("--org-cell-bg: var(--fill-subtle)");
        if (lit) own.push("--org-cell-ink: " + look.color, "--org-cell-bg: color-mix(in srgb, " + look.color + " var(--tint-strength), var(--ha-card-background))");
        // The icon next to a value is muted, unless the cell stands out or has a color of its own
        if (text && !on && !lit && !org.has(opt.color)) own.push("--org-cell-icon: var(--opacity-muted)");
        const obj = hass.states[s.entity];
        if (s.entity && (!obj || obj.state === "unavailable")) own.push("opacity: var(--opacity-disabled)");
        rules.push(scope + " .bubble-sub-button.bubble-sub-button-" + s.n + " { " + own.join("; ") + "; }");
        return { ...s, opt };
      });
      // The cells' text, icon, color, name_color and background work as the name, icon, color, name_color and background of a value in Header
      rules.push(...org.values(env, this.config, "origami_table", scope, "var(--ha-font-size-s)", list));
      card._orgT = {
        template: [...cols.map((c) => c.width), ...Array(count - cols.length).fill("auto")].join(" "),
        stripes: cfg.stripes ?? true,
        rules: rules.join("\n    ")
      };
      return "";
    })()}
    ha-card {
      --org-cell: var(--icon-size-m);
    }
    ${card._org.unframe()}
    ha-card .bubble-sub-button-bottom-container {
      display: grid !important;
      grid-template-columns: ${card._orgT.template};
      justify-content: normal !important;
      gap: 0 var(--ha-space-1) !important;
      box-sizing: border-box;
      overflow: hidden;
      border-radius: var(--ha-card-border-radius);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-alignment-lane {
      display: contents !important;
    }
    /* Each row is a subgrid, so every column is as wide as its widest cell in any row. A row keeps the table's gap, because a gap of its own would add space around every cell. */
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(.hidden) {
      grid-column: 1 / -1;
      display: grid !important;
      grid-template-columns: subgrid;
      gap: normal !important;
      align-items: center;
      box-sizing: border-box;
      width: auto !important;
      height: var(--control-height-icon);
      padding: 0 var(--ha-space-2);
    }
    ${card._orgT.stripes ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:nth-child(even of :not(.hidden)) {
      background-color: var(--fill-subtle);
    }` : ""}
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      box-sizing: border-box;
      gap: var(--ha-space-1);
      width: auto !important;
      min-width: auto !important;
      height: var(--org-cell) !important;
      margin: 0 !important;
      padding: 0 6px !important;
      border-radius: calc(var(--org-cell) * var(--radius-ratio, 0.35)) !important;
      background: var(--org-value-chip, var(--org-cell-bg, transparent)) !important;
      box-shadow: none !important;
      color: var(--secondary-text-color) !important;
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      font-variant-numeric: tabular-nums;
      white-space: nowrap !important;
      transition: var(--transition-interactive) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      transform: scale(var(--press-scale));
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--icon-size-2xs) !important;
      display: flex !important;
      margin: 0 !important;
      color: var(--org-cell-ink, currentColor) !important;
      opacity: var(--org-cell-icon, 1) !important;
    }
    /* A cell is never narrower than its text, so its column fits it. A text that Bubble Card measured too wide before these styles applied stops scrolling at the next measurement. */
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-name-container {
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: inherit !important;
      font-weight: inherit !important;
      color: inherit !important;
    }
    ${card._orgT.rules}
