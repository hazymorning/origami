origami_slider:
  name: "Origami • Slider"
  version: "1.4.1"
  supported:
    - button
  description: "Slider turns a slider button into a standalone slider without an icon, a name or a state, so the card itself is the track. Set rows to 1."
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_slider needs origami_base 12 or later, listed before it");
      // The card is the track, so Base rounds its fill like a sub-button's slider
      if (card.dataset.orgTrack !== "") card.dataset.orgTrack = "";
      return "";
    })()}
    ha-card {
      --org-row-height: var(--control-height-icon);
      --bubble-border: none;
    }
    .large .bubble-container {
        border: none !important;
    }
    .bubble-button-card-container,
    .bubble-container {
      height: var(--control-height-icon) !important;
      min-height: var(--control-height-icon) !important;
    }
    .bubble-content-container,
    .bubble-icon-container,
    .bubble-name-container {
      display: none !important;
    }
    .bubble-button-background {
      opacity: 0 !important;
    }
    .bubble-container {
      overflow: hidden;
      border-radius: var(--radius-small) !important;
      background-color: var(--fill-subtle);
      box-shadow: var(--card-ring);
    }
    .bubble-range-slider,
    .bubble-background,
    .card-content {
      border-radius: var(--radius-small) !important;
    }
    .bubble-range-value {
      inset-inline-end: var(--ha-space-2) !important;
      opacity: 1 !important;
      display: block !important;
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-bold);
      color: var(--secondary-text-color);
    }
