origami_tiles:
  name: "Origami • Tiles"
  version: "3.2.0"
  supported:
    - sub-buttons
  description: "Tiles turns a sub-buttons card into a grid of tiles or a list of rows, each with an icon, a name and a state line. In a list, a sign at each row's end shows what a tap does, and a slim list can have lines between its rows."
  editor:
    - name: layout
      label: "Layout"
      selector:
        select:
          mode: dropdown
          options:
            - label: Grid
              value: grid
            - label: List
              value: list
      default: grid
    - name: columns
      label: "Columns"
      selector:
        number:
          min: 1
          max: 6
          step: 1
          mode: box
      default: 2
    - name: slim
      label: "Slim rows without icon backgrounds (list)"
      selector:
        boolean: {}
      default: false
    - name: dividers
      label: "Lines between the rows (slim list)"
      selector:
        boolean: {}
      default: false
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12.5)) throw new Error("origami_tiles needs origami_base 12.5 or later");
      const env = { hass, renderTemplate };
      const cfg = this.config.origami_tiles ?? {};
      const list = cfg.layout === "list";
      card._orgTilesList = list;
      card._orgTilesCols = list ? 1 : Math.max(1, Math.min(6, parseInt(cfg.columns ?? 2, 10) || 2));
      // A slim list shows its icons without a background, and in a slim list, dividers draw a line between the rows
      card._orgTilesSlim = list && !!cfg.slim;
      card._orgTilesLines = card._orgTilesSlim && !!cfg.dividers;
      // In the list, the sign at a row's end says what a tap does. It follows from the tap action, and the sign key can set it.
      const signs = { open: [], run: [], running: [], stop: [], switch: [], on: [] };
      card._orgTilesCss = org.subs(env, this.config, "origami_tiles").map(({ n, item, entity, ctx, opt }) => {
        const sel = ".bubble-sub-button.bubble-sub-button-" + n;
        const rules0 = [];
        const o = opt ?? {};
        const obj = hass.states[entity];
        const name = org.has(o.name) ? o.name : org.name(hass, entity, item.name, env);
        // Without a state of its own, a tile shows the sub-button's state_content or attribute, the way Bubble Card does
        const parts = item.state_content ?? (item.attribute ? [item.attribute] : ["state"]);
        const state = org.has(o.state) ? o.state : obj ? org.state(hass, entity, parts) : "";
        // A tile takes the state color while its entity is on, by the same rule as Base
        const look = org.look(hass, entity);
        // A tile is dimmed while its entity is missing or unavailable. A scene or a button that was never used is unknown, and it stays as it is.
        if (entity && (!obj || obj.state === "unavailable")) rules0.push(sel + " { opacity: var(--opacity-disabled); }");
        const color = org.has(o.color) ? o.color : look.lit ? look.color : "";
        const rules = [sel + " { --org-tile-name: " + org.str(name) + "; --org-tile-state: " + org.str(state) + ";" + (org.has(o.order) ? " order: " + o.order + ";" : "") + " }", ...rules0];
        // A row without a state line keeps its name in the middle
        if (list && !org.has(state)) rules.push(sel + " .bubble-sub-button-name-container::after { display: none; }");
        if (color) rules.push(sel + " { --org-tile-color: " + color + "; --org-tile-chip: var(--tint); }");
        if (list) {
          // The sign follows Base's rules. A tap that opens something shows a chevron, a toggle shows Base's pill switch, and any other action shows a key that Base's rule fills.
          const tap = org.act(item);
          const [domain, verb] = org.service(item).split(".");
          // The sign follows the entity that the tap acts on
          const target = org.targets(item)[0];
          const id = (target === "entity" ? null : target) ?? entity;
          const sign = ["open", "run", "switch", "none"].includes(o.sign) ? o.sign
            : org.links.includes(tap.action) ? "open"
            : tap.action === "toggle" || (verb === "toggle" && domain !== "script") ? "switch"
            : ["perform-action", "call-service"].includes(tap.action) ? "run"
            : "none";
          const one = ".bubble-sub-button-" + n;
          if (sign === "open") signs.open.push(one);
          if (sign === "switch") signs[org.look(hass, id).on ? "on" : "switch"].push(one);
          // A key that runs something is filled by Base's rule for its target, and it shows a stop sign when a second tap stops it
          if (sign === "run") signs[!org.filled(hass, item, id) ? "run" : ["toggle", "turn_off"].includes(verb) ? "stop" : "running"].push(one);
        }
        if (org.has(o.name_color)) rules.push(sel + " .bubble-sub-button-name-container { color: " + o.name_color + "; }");
        if (org.has(o.image)) rules.push(sel + " .bubble-sub-button-icon { --mdc-icon-size: 0px !important; background-image: url(" + org.str(o.image) + "); background-size: " + (org.has(o.image_size) ? o.image_size : "cover") + "; background-position: center; }");
        return rules.join("\n");
      }).join("\n");
      // at() returns a selector list for the rows with these signs, with the same ending on each selector
      const at = (keys, end = "", start = "") => keys.split(" ").flatMap((k) => signs[k]).map((c) => start + ".bubble-sub-button" + c + end).join(", ") || ".org-none";
      // The signs are icons from Material Design Icons, drawn as masks in the text color. Only the list builds them.
      const mask = (d) => "url(" + org.str("data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='" + d + "'/></svg>")) + ")";
      card._orgTilesSign = list && {
        at,
        all: "open run running stop switch on",
        chevron: mask("M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"),
        playMask: mask("M8,5.14V19.14L19,12.14L8,5.14Z"),
        stopMask: mask("M18,18H6V6H18V18Z"),
        // The knob is the circle that Base's pill switch uses
        knob: mask("M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z")
      };
      return "";
    })()}
    ${card._org.unframe()}
    .bubble-sub-button-group:not(.hidden) {
      display: grid !important;
      grid-template-columns: repeat(${card._orgTilesCols}, minmax(0, 1fr));
      gap: var(--ha-space-3) !important;
      width: 100%;
    }
    .bubble-sub-button {
      flex-direction: row !important;
      justify-content: flex-start !important;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: var(--ha-space-4) !important;
      border-radius: var(--ha-card-border-radius) !important;
      background-color: var(--tile-background, var(--fill-subtle)) !important;
      color: var(--primary-text-color) !important;
      transition: var(--transition-interactive) !important;
    }
    .bubble-sub-button-icon,
    .bubble-sub-button-image {
      position: static !important;
      order: -1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tile-size) !important;
      min-width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      margin: 0 !important;
      margin-inline-end: var(--ha-space-3) !important;
      border-radius: var(--radius-inner) !important;
      box-shadow: var(--tile-chip-shadow, var(--ha-card-box-shadow));
      transition: var(--transition-interactive);
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: var(--icon-size-m) !important;
      background-color: var(--org-tile-chip, var(--tile-chip-background, var(--ha-card-background)));
      color: var(--org-tile-color, var(--primary-text-color)) !important;
    }
    .bubble-sub-button-name-container {
      display: flex !important;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: 0 !important;
      font-weight: var(--ha-font-weight-bold);
      line-height: inherit !important;
    }
    .bubble-sub-button-name-container::before,
    .bubble-sub-button-name-container::after {
      box-sizing: content-box;
      padding: 2px;
      margin: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-sub-button-name-container::before {
      content: var(--org-tile-name, "");
      max-width: 100%;
      font-size: var(--ha-font-size-m);
    }
    .bubble-sub-button-name-container::after {
      content: var(--org-tile-state, "");
      max-width: 100%;
      margin-top: calc(var(--ha-space-1) - 2px);
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-medium);
      color: var(--secondary-text-color);
    }
    ${card._orgTilesCss}
    ${card._orgTilesList ? `
    /* The switch is Base's compact pill switch. It is as wide as an icon's background, so switches and keys share one column at the row's end. */
    ha-card {
      --org-toggle-w: var(--tile-size);
      --org-toggle-h: var(--icon-size-l);
      --org-toggle-knob: var(--icon-size-s);
    }
    /* A row holds an icon's background as a card does, and the list's padding surrounds it. A key is a square as large as the icon's background, and its sign is as large as the icon. */
    .bubble-sub-button-group:not(.hidden) {
      --org-list-row: calc(var(--tile-size) + 2 * var(--ha-space-2));
      --org-list-key: var(--tile-size);
      --org-list-key-radius: var(--radius-inner);
      --org-list-glyph: var(--icon-size-m);
      gap: var(--ha-space-1) !important;
      box-sizing: border-box;
      padding: var(--ha-space-2);
      border-radius: var(--ha-card-border-radius);
      background-color: var(--tile-background, var(--fill-subtle));
    }
    .bubble-sub-button {
      position: relative !important;
      height: var(--org-list-row) !important;
      padding: 0 var(--ha-space-2) !important;
      border-radius: calc(var(--ha-card-border-radius) - var(--ha-space-2)) !important;
      background-color: transparent !important;
    }
    .bubble-sub-button.bubble-action-enabled:active {
      background-color: var(--fill-subtle) !important;
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: var(--org-list-glyph) !important;
    }
    .bubble-sub-button-name-container::after {
      margin-top: 2px;
    }
    ${card._orgTilesSlim ? `
    /* A slim row is lower, its icon has no background and its icon and keys are smaller. The icon keeps its column, so the text starts where it starts in a regular list. */
    .bubble-sub-button-group:not(.hidden) {
      --org-list-row: var(--control-height);
      --org-list-key: var(--control-height-mini);
      --org-list-key-radius: var(--radius-small);
      --org-list-glyph: var(--icon-size-s);
    }
    .bubble-sub-button-icon {
      background-color: transparent;
      box-shadow: none;
      color: var(--org-tile-color, var(--secondary-text-color)) !important;
    }` : ""}
    ${card._orgTilesLines ? `
    /* Each line lies in the middle of a gap between two rows and spans the rows' full width. Hidden rows take no space, so every line stays between two rows. */
    .bubble-sub-button-group:not(.hidden) {
      --org-list-gap: calc(2 * var(--ha-space-1) + var(--org-line-width));
      gap: var(--org-list-gap) !important;
      background-image: repeating-linear-gradient(to bottom, transparent 0 calc(var(--org-list-row) + var(--ha-space-1)), var(--org-line-color) 0 calc(var(--org-list-row) + var(--ha-space-1) + var(--org-line-width)), transparent 0 calc(var(--org-list-row) + var(--org-list-gap)));
      background-size: 100% calc(100% - var(--org-list-row));
      background-origin: content-box;
      background-repeat: no-repeat;
    }` : ""}
    ${card._orgTilesSign.at(card._orgTilesSign.all)} {
      padding-inline-end: calc(2 * var(--ha-space-2) + var(--org-toggle-w)) !important;
    }
    ${card._orgTilesSign.at(card._orgTilesSign.all, "::before")},
    ${card._orgTilesSign.at(card._orgTilesSign.all, "::after")} {
      content: "";
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      pointer-events: none;
    }
    ${card._orgTilesSign.at("run running stop switch on", "::before")} {
      inset-inline-end: var(--ha-space-2);
      width: var(--org-toggle-w);
      height: var(--org-toggle-h);
      border-radius: var(--radius-inner);
      background-color: var(--tile-chip-background, var(--ha-card-background));
      box-shadow: var(--card-ring), var(--tile-chip-shadow, var(--ha-card-box-shadow));
      transition: var(--transition-interactive);
    }
    ${card._orgTilesSign.at("run running stop", "::before")} {
      inset-inline-end: calc(var(--ha-space-2) + (var(--org-toggle-w) - var(--org-list-key)) / 2);
      width: var(--org-list-key);
      height: var(--org-list-key);
      border-radius: var(--org-list-key-radius);
    }
    ${card._orgTilesSign.at("running stop on", "::before")} {
      background-color: var(--fill-active);
    }
    ${card._orgTilesSign.at(card._orgTilesSign.all, "::after")} {
      -webkit-mask: var(--org-sign-icon) center / contain no-repeat;
      mask: var(--org-sign-icon) center / contain no-repeat;
    }
    /* The chevron stands in the middle of the signs' column, as the icon stands in the middle of its background on the other side */
    ${card._orgTilesSign.at("open", "::after")} {
      --org-sign-icon: ${card._orgTilesSign.chevron};
      inset-inline-end: calc(var(--ha-space-2) + (var(--org-toggle-w) - var(--icon-size-m)) / 2);
      width: var(--icon-size-m);
      height: var(--icon-size-m);
      background-color: var(--secondary-text-color);
      opacity: var(--opacity-muted);
    }
    ${card._orgTilesSign.at("open", "::after", "ha-card:dir(rtl) ")} {
      scale: -1 1;
    }
    ${card._orgTilesSign.at("run running stop", "::after")} {
      --org-sign-icon: ${card._orgTilesSign.playMask};
      inset-inline-end: calc(var(--ha-space-2) + (var(--org-toggle-w) - var(--org-list-glyph)) / 2);
      width: var(--org-list-glyph);
      height: var(--org-list-glyph);
      background-color: var(--primary-text-color);
      opacity: var(--opacity-strong);
    }
    ${card._orgTilesSign.at("stop", "::after")} {
      --org-sign-icon: ${card._orgTilesSign.stopMask};
    }
    ${card._orgTilesSign.at("running stop", "::after")} {
      background-color: var(--text-color-active);
      opacity: 1;
    }
    ${card._orgTilesSign.at("switch on", "::after")} {
      --org-sign-icon: ${card._orgTilesSign.knob};
      inset-inline-end: calc(var(--ha-space-2) + var(--org-toggle-w) - var(--ha-space-1) - var(--org-toggle-knob));
      width: var(--org-toggle-knob);
      height: var(--org-toggle-knob);
      background-color: var(--primary-text-color);
      opacity: var(--opacity-quiet);
      transition: inset-inline-end var(--duration-normal) var(--ease-standard), background-color var(--duration-normal) ease;
    }
    ${card._orgTilesSign.at("on", "::after")} {
      inset-inline-end: calc(var(--ha-space-2) + var(--ha-space-1));
      background-color: var(--text-color-active);
      opacity: 1;
    }` : ""}
