origami_tiles:
  name: "Origami • Tiles"
  version: "1.0.2"
  supported:
    - sub-buttons
  description: "The Tiles module turns a sub-buttons card into a grid of tiles with an icon, a name and a state line. Set up each tile under its sub-button's origami_tiles key, which takes name, state, color, order, image and name_color. Each of these accepts a value, a map from the entity's state to a value, or JavaScript in ${ }. Bubble Card's visibility conditions decide when a tile appears."
  editor:
    - name: columns
      label: "Columns"
      selector:
        number:
          min: 1
          max: 6
          step: 1
          mode: box
      default: 2
  code: |
    ${(() => {
      const S = hass.states;
      const sb = this.config.sub_button;
      const bottom = Array.isArray(sb) ? [] : (sb?.bottom ?? []);
      const tiles = [
        ...bottom.filter((i) => Array.isArray(i?.group)).flatMap((i) => i.group.filter(Boolean)),
        ...bottom.filter((i) => i && !Array.isArray(i.group))
      ];
      const now = new Date();
      const states = (id) => S[id]?.state ?? "unknown";
      const minutesUntil = (id) => {
        const v = String(states(id));
        const t = v.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
        let end;
        if (t) {
          end = new Date(now);
          end.setHours(Number(t[1]), Number(t[2]), Number(t[3] ?? 0), 0);
          if (end < now) end.setDate(end.getDate() + 1);
        } else {
          end = new Date(v.replace(" ", "T"));
        }
        const m = Math.round((end - now) / 60000);
        return Number.isNaN(m) ? "" : m;
      };
      const fill = (strings, ...values) => values.some((v) => v === null || v === undefined || v === "" || Number.isNaN(v))
        ? ""
        : strings.reduce((out, s, i) => out + s + (i < values.length ? values[i] : ""), "");
      const fns = card._orgTilesFns ?? (card._orgTilesFns = new Map());
      const run = (value, ctx) => {
        if (typeof value !== "string") return value;
        if (/\{(\{|%)/.test(value)) return renderTemplate(value, ctx.entity);
        if (!value.includes("${")) return value;
        let fn = fns.get(value);
        if (!fn) {
          try {
            fn = new Function("fill", "hass", "entity", "state", "attr", "states", "minutesUntil", "return fill`" + value + "`;");
          } catch (e) {
            fn = () => "";
          }
          fns.set(value, fn);
        }
        try {
          return fn(fill, hass, ctx.entity, ctx.state, ctx.attr, states, minutesUntil);
        } catch (e) {
          return "";
        }
      };
      const pick = (option, ctx) => {
        if (option === undefined || option === null) return "";
        if (typeof option === "object" && !Array.isArray(option)) {
          const key = String(ctx.state).toLowerCase();
          const hit = Object.keys(option).find((k) => k.toLowerCase() === key);
          return hit === undefined ? "" : run(option[hit], ctx);
        }
        return run(option, ctx);
      };
      const has = (v) => v !== undefined && v !== null && String(v).trim() !== "";
      // Bubble Card cleans the CSS text, so every character that it could change is escaped
      const q = (v) => '"' + String(v).replace(/[^\p{L}\p{N}%°.:|+-]/gu, (c) => "\\" + c.codePointAt(0).toString(16).padStart(6, "0")) + '"';
      const slug = (v) => String(v).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
      card._orgTilesCols = Math.max(1, Math.min(6, parseInt(this.config.origami_tiles?.columns ?? 2, 10) || 2));
      card._orgTilesCss = tiles.map((item, i) => {
        const sel = ".bubble-sub-button.bubble-sub-button-" + (i + 1);
        const entity = item.entity ?? this.config.entity;
        const obj = S[entity];
        const ctx = { entity, state: obj?.state ?? "unknown", attr: obj?.attributes ?? {} };
        const opt = item.origami_tiles ?? {};
        const domain = String(entity ?? "").split(".")[0];
        const key = slug(ctx.state);
        const dc = ctx.attr.device_class;
        const auto = (dc ? "var(--state-" + domain + "-" + dc + "-" + key + "-color, " : "")
          + "var(--state-" + domain + "-" + key + "-color, var(--state-" + domain + "-active-color, var(--state-active-color)))"
          + (dc ? ")" : "");
        const name = [pick(opt.name, ctx), run(item.name, ctx), ctx.attr.friendly_name].find(has) ?? "";
        const state = [pick(opt.state, ctx), obj ? (hass.formatEntityState?.(obj) ?? obj.state) : ""].find(has) ?? "";
        const color = pick(opt.color, ctx);
        const order = pick(opt.order, ctx);
        const image = pick(opt.image, ctx);
        const nameColor = pick(opt.name_color, ctx);
        const rules = [sel + " { --org-tile-auto: " + auto + "; --org-tile-name: " + q(name) + "; --org-tile-state: " + q(state) + ";" + (has(order) ? " order: " + order + ";" : "") + " }"];
        if (has(color)) rules.push(sel + " { --org-tile-color: " + color + "; --org-tile-chip: var(--tint); }");
        if (has(nameColor)) rules.push(sel + " .bubble-sub-button-name-container { color: " + nameColor + "; }");
        if (has(image)) rules.push(sel + " .bubble-sub-button-icon { --mdc-icon-size: 0px !important; background-image: url(" + q(image) + "); background-size: var(--org-tile-image-size, 230%); background-position: center; }");
        return rules.join("\n");
      }).join("\n");
      return "";
    })()}
    .bubble-container {
      height: auto !important;
      overflow: visible !important;
      border: none !important;
      border-radius: 0 !important;
      background: none !important;
      box-shadow: none !important;
    }
    .bubble-sub-button-container {
      display: none !important;
    }
    .bubble-sub-button-bottom-container {
      position: static !important;
      width: 100% !important;
      margin: 0 !important;
    }
    .bubble-sub-button-group:not(.hidden) {
      display: grid !important;
      grid-template-columns: repeat(${card._orgTilesCols}, minmax(0, 1fr));
      gap: var(--ha-space-3) !important;
      width: 100%;
    }
    .bubble-sub-button {
      flex-direction: row !important;
      justify-content: flex-start !important;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: var(--ha-space-4) !important;
      border-radius: var(--ha-card-border-radius) !important;
      background-color: var(--fill-subtle) !important;
      color: var(--primary-text-color) !important;
      transition: var(--transition-interactive) !important;
    }
    .bubble-sub-button.background-on {
      --org-tile-color: var(--org-tile-auto);
      --org-tile-chip: var(--tint);
    }
    .bubble-sub-button-icon,
    .bubble-sub-button-image {
      position: static !important;
      order: -1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tile-size) !important;
      min-width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      margin: 0 var(--ha-space-3) 0 0 !important;
      border-radius: var(--radius-inner) !important;
      box-shadow: var(--ha-card-box-shadow);
      transition: var(--transition-interactive);
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: var(--icon-size-m) !important;
      background-color: var(--org-tile-chip, var(--ha-card-background));
      color: var(--org-tile-color, var(--primary-text-color)) !important;
    }
    .bubble-sub-button-name-container {
      display: flex !important;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: 0 !important;
      font-weight: var(--ha-font-weight-bold);
      line-height: inherit !important;
    }
    .bubble-sub-button-name-container::before,
    .bubble-sub-button-name-container::after {
      box-sizing: content-box;
      padding: 2px;
      margin: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-sub-button-name-container::before {
      content: var(--org-tile-name, "");
      max-width: 100%;
      font-size: var(--ha-font-size-m);
    }
    .bubble-sub-button-name-container::after {
      content: var(--org-tile-state, "");
      max-width: min(var(--org-tile-state-max, 80px), 100%);
      margin-top: calc(var(--ha-space-1) - 2px);
      font-size: var(--ha-font-size-s);
      color: var(--secondary-text-color);
    }
    ${card._orgTilesCss}