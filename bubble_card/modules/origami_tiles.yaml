origami_tiles:
  name: "Origami • Tiles"
  version: "3.0.0"
  supported:
    - sub-buttons
  description: "The Tiles module turns a sub-buttons card into a grid of tiles with an icon, a name and a state line. Set up each tile under its sub-button's origami_tiles key, which takes name, state, color, order, image, image_size and name_color. Without state, a tile shows its entity's state, or the sub-button's attribute, in Home Assistant's own words. A tile whose entity is unavailable is dimmed. Each of these accepts a value, a map from the entity's state to a value, or JavaScript in ${ }. Bubble Card's visibility conditions decide when a tile appears. List Base before Tiles, because Tiles uses Base's helpers."
  editor:
    - name: columns
      label: "Columns"
      selector:
        number:
          min: 1
          max: 6
          step: 1
          mode: box
      default: 2
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass) throw new Error("origami_tiles needs origami_base 10 or later, listed before it");
      const env = { hass, renderTemplate };
      card._orgTilesCols = Math.max(1, Math.min(6, parseInt(this.config.origami_tiles?.columns ?? 2, 10) || 2));
      card._orgTilesCss = org.subs(env, this.config, "origami_tiles").map(({ n, item, entity, ctx, opt }) => {
        const sel = ".bubble-sub-button.bubble-sub-button-" + n;
        const rules0 = [];
        const o = opt ?? {};
        const obj = hass.states[entity];
        const name = [o.name, org.run(env, item.name, ctx), ctx.attr.friendly_name].find(org.has) ?? "";
        const state = [o.state, obj ? org.word(hass, obj, item.attribute || null) : ""].find(org.has) ?? "";
        // A tile takes the state color while its entity is on, by the same rule as Base
        const look = org.look(hass, entity);
        if (entity && !look.available) rules0.push(sel + " { opacity: var(--opacity-disabled); }");
        const color = org.has(o.color) ? o.color : look.lit ? look.color : "";
        const rules = [sel + " { --org-tile-name: " + org.str(name) + "; --org-tile-state: " + org.str(state) + ";" + (org.has(o.order) ? " order: " + o.order + ";" : "") + " }", ...rules0];
        if (color) rules.push(sel + " { --org-tile-color: " + color + "; --org-tile-chip: var(--tint); }");
        if (org.has(o.name_color)) rules.push(sel + " .bubble-sub-button-name-container { color: " + o.name_color + "; }");
        if (org.has(o.image)) rules.push(sel + " .bubble-sub-button-icon { --mdc-icon-size: 0px !important; background-image: url(" + org.str(o.image) + "); background-size: " + (org.has(o.image_size) ? o.image_size : "cover") + "; background-position: center; }");
        return rules.join("\n");
      }).join("\n");
      return "";
    })()}
    .bubble-container {
      height: auto !important;
      overflow: visible !important;
      border: none !important;
      border-radius: 0 !important;
      background: none !important;
      box-shadow: none !important;
    }
    .bubble-sub-button-container {
      display: none !important;
    }
    .bubble-sub-button-bottom-container {
      position: static !important;
      width: 100% !important;
      margin: 0 !important;
    }
    .bubble-sub-button-group:not(.hidden) {
      display: grid !important;
      grid-template-columns: repeat(${card._orgTilesCols}, minmax(0, 1fr));
      gap: var(--ha-space-3) !important;
      width: 100%;
    }
    .bubble-sub-button {
      flex-direction: row !important;
      justify-content: flex-start !important;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: var(--ha-space-4) !important;
      border-radius: var(--ha-card-border-radius) !important;
      background-color: var(--fill-subtle) !important;
      color: var(--primary-text-color) !important;
      transition: var(--transition-interactive) !important;
    }
    .bubble-sub-button-icon,
    .bubble-sub-button-image {
      position: static !important;
      order: -1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--tile-size) !important;
      min-width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      margin: 0 !important;
      margin-inline-end: var(--ha-space-3) !important;
      border-radius: var(--radius-inner) !important;
      box-shadow: var(--ha-card-box-shadow);
      transition: var(--transition-interactive);
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: var(--icon-size-m) !important;
      background-color: var(--org-tile-chip, var(--ha-card-background));
      color: var(--org-tile-color, var(--primary-text-color)) !important;
    }
    .bubble-sub-button-name-container {
      display: flex !important;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: 0 !important;
      font-weight: var(--ha-font-weight-bold);
      line-height: inherit !important;
    }
    .bubble-sub-button-name-container::before,
    .bubble-sub-button-name-container::after {
      box-sizing: content-box;
      padding: 2px;
      margin: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-sub-button-name-container::before {
      content: var(--org-tile-name, "");
      max-width: 100%;
      font-size: var(--ha-font-size-m);
    }
    .bubble-sub-button-name-container::after {
      content: var(--org-tile-state, "");
      max-width: min(var(--org-tile-state-max, 100%), 100%);
      margin-top: calc(var(--ha-space-1) - 2px);
      font-size: var(--ha-font-size-s);
      color: var(--secondary-text-color);
    }
    ${card._orgTilesCss}