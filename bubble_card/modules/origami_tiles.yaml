origami_tiles:
  name: "Origami • Tiles"
  version: "3.4.4"
  supported:
    - sub-buttons
  description: "Tiles turns a sub-buttons card into a grid of tiles or a list of rows with an icon, a name and a state. In a list, an icon at each row's end shows what a tap does. A list can have slim rows and lines between them."
  editor:
    - name: layout
      label: "Layout"
      selector:
        select:
          mode: dropdown
          options:
            - label: Grid
              value: grid
            - label: List
              value: list
      default: grid
    - name: columns
      label: "Columns"
      selector:
        number:
          min: 1
          max: 6
          step: 1
          mode: box
      default: 2
    - name: slim
      label: "Slim rows (list): small icons without a background, the state at the row's end"
      selector:
        boolean: {}
      default: false
    - name: dividers
      label: "Lines between the rows (list)"
      selector:
        boolean: {}
      default: false
    - name: sign
      label: "Sign for every row (list)"
      selector:
        select:
          mode: dropdown
          options:
            - label: Set by the tap action
              value: auto
            - label: Chevron
              value: open
            - label: Play
              value: run
            - label: Switch
              value: switch
            - label: None
              value: none
      default: auto
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 13.1)) throw new Error("origami_tiles needs origami_base 13.1 or later");
      const env = org.env;
      const cfg = this.config.origami_tiles ?? {};
      const list = cfg.layout === "list";
      // A slim list has low rows with plain icons and the state at the row's end, and dividers draw a line between the rows of any list
      const t = card._orgTi = { list, cols: list ? 1 : Math.max(1, Math.min(6, parseInt(cfg.columns ?? 2, 10) || 2)), slim: list && org.yes(cfg.slim), lines: list && org.yes(cfg.dividers) };
      const signKeys = ["open", "run", "switch", "none"];
      // In the list, the sign at a row's end says what a tap does. It follows from the tap action, and the sign key can set it.
      const signs = { open: [], run: [], running: [], stop: [], switch: [], on: [] };
      const named = [];
      const free = [];
      t.css = org.subs(env, this.config, "origami_tiles").map(({ n, item, entity, ctx, opt }) => {
        const one = ".bubble-sub-button-" + n;
        const sel = ".bubble-sub-button" + one;
        // Only visibility conditions hide a tile, because Tiles writes the name and the state of every tile
        if (!item.visibility) free.push(one);
        const o = opt ?? {};
        const obj = hass.states[entity];
        const name = org.has(o.name) ? o.name : org.name(hass, entity, item.name, env);
        if (t.slim) named.push([n, String(name)]);
        // Without a state of its own, a tile shows the sub-button's state_content or attribute, the way Bubble Card does
        const parts = item.state_content ?? (item.attribute ? [item.attribute] : ["state"]);
        const state = org.has(o.state) ? o.state : obj ? org.state(hass, entity, parts) : "";
        // A tile takes the state color while its entity is on, by the same rule as Base
        const look = org.look(hass, entity);
        const color = org.has(o.color) ? o.color : look.lit ? look.color : "";
        // In a list with lines, the rows keep the order of the YAML, because each line belongs to the row below it
        const rules = [sel + " { --org-tile-name: " + org.str(name) + "; --org-tile-state: " + org.str(state) + ";" + (org.has(o.order) && !t.lines ? " order: " + o.order + ";" : "") + " }"];
        // A tile is dimmed while its entity is missing or unavailable. A scene or a button that was never used is unknown, and it stays as it is.
        if (entity && (!obj || obj.state === "unavailable")) rules.push(list ? "ha-card " + sel + " > *, ha-card " + sel + "::after { opacity: var(--opacity-disabled) !important; }" : sel + " { opacity: var(--opacity-disabled); }");
        // A row without a state line keeps its name in the middle
        if (list && !org.has(state)) rules.push(sel + " .bubble-sub-button-name-container::after { display: none; }");
        if (color) rules.push(sel + " { --org-tile-color: " + color + "; --org-tile-chip: var(--tint); }");
        if (list) {
          // The sign follows Base's rules. A tap that opens something shows a chevron, a toggle shows Base's pill switch, and any other action shows a key that Base's rule fills.
          const tap = org.act(item);
          // A tap with action: toggle counts as a toggle, so a play sign set by the sign key shows a stop sign while the entity is on
          const [domain, verb] = (tap.action === "toggle" ? "homeassistant.toggle" : org.service(item)).split(".");
          // The sign follows the entity that the tap acts on
          const target = org.targets(item)[0];
          const id = (target === "entity" ? null : target) ?? entity;
          const sign = signKeys.includes(o.sign) ? o.sign
            : signKeys.includes(cfg.sign) ? cfg.sign
            : org.links.includes(tap.action) ? "open"
            : tap.action === "toggle" || (verb === "toggle" && domain !== "script") ? "switch"
            : ["perform-action", "call-service"].includes(tap.action) ? "run"
            : "none";
          if (sign === "open") signs.open.push(one);
          if (sign === "switch") signs[org.look(hass, id).on ? "on" : "switch"].push(one);
          // A key that runs something is filled by Base's rule for its target, and it shows a stop sign when a second tap stops it
          if (sign === "run") signs[!org.filled(hass, item, id) ? "run" : ["toggle", "turn_off"].includes(verb) ? "stop" : "running"].push(one);
        }
        if (org.has(o.name_color)) rules.push(sel + " .bubble-sub-button-name-container { color: " + o.name_color + "; }");
        if (org.has(o.state_color)) rules.push(sel + " .bubble-sub-button-name-container::after { color: " + o.state_color + "; }");
        if (org.has(o.image)) rules.push(sel + " .bubble-sub-button-icon { --mdc-icon-size: 0px !important; background-image: url(" + org.str(o.image) + "); background-size: " + (org.has(o.image_size) ? o.image_size : "cover") + "; background-position: center; }");
        return rules.join("\n");
      }).join("\n");
      // Bubble Card hides a sub-button that shows neither an icon nor a name of its own, and with it a group or a lane whose sub-buttons are all hidden. A tile without visibility conditions shows anyway, so the rules for shown tiles and groups take it in.
      t.free = free.join(", ");
      t.shown = free.length ? ":is(:not(.hidden), " + t.free + ")" : ":not(.hidden)";
      t.group = free.length ? ":is(:not(.hidden), :has(> :is(" + t.free + ")))" : ":not(.hidden)";
      // A slim row's name keeps at least 40 % of the line, or its own width if that is less, so a short name leaves the rest of the line to the state. The fonts and the widths are known only after layout, so the names are measured in the next frame, as Slider measures its names.
      if (named.length) org.later("tiles", () => {
        named.forEach(([n, text]) => {
          const el = card.querySelector(".bubble-sub-button-" + n + " > .bubble-sub-button-name-container");
          if (!el) return;
          const w = Math.ceil(org.pen(el).width(text)) + 1 + "px";
          if (el.style.getPropertyValue("--org-name-w") !== w) el.style.setProperty("--org-name-w", w);
        });
      });
      // at() returns a selector list for the rows with these signs, with the same ending on each selector
      const at = (keys, end = "", start = "") => keys.split(" ").flatMap((k) => signs[k]).map((c) => start + ".bubble-sub-button" + c + end).join(", ") || ".org-none";
      // The signs are icons from Material Design Icons, drawn as masks in the text color. Only the list builds them.
      const mask = (d) => "url(" + org.str("data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='" + d + "'/></svg>")) + ")";
      t.sign = list && {
        at,
        all: "open run running stop switch on",
        chevron: mask("M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"),
        play: mask("M8,5.14V19.14L19,12.14L8,5.14Z"),
        stop: mask("M18,18H6V6H18V18Z"),
        off: mask("M17 6H7c-3.31 0-6 2.69-6 6s2.69 6 6 6h10c3.31 0 6-2.69 6-6s-2.69-6-6-6zm0 10H7c-2.21 0-4-1.79-4-4s1.79-4 4-4h10c2.21 0 4 1.79 4 4s-1.79 4-4 4zM7 9c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"),
        on: mask("M17,7H7A5,5 0 0,0 2,12A5,5 0 0,0 7,17H17A5,5 0 0,0 22,12A5,5 0 0,0 17,7M17,15A3,3 0 0,1 14,12A3,3 0 0,1 17,9A3,3 0 0,1 20,12A3,3 0 0,1 17,15Z")
      };
      return "";
    })()}
    ${card._org.unframe()}
    /* In a list, a row holds an icon's background, as a card does, so all rows have the same height. The rows touch, so two icons are as far apart as an icon is from the list's edge. The sign at a row's end has a column as wide as the icons' column. A slim row is as tall as a button, and its icon and its sign are small. */
    .bubble-sub-button-group${card._orgTi.group} {
      --org-row-min: ${card._orgTi.slim ? "var(--control-height-icon)" : card._orgTi.list ? "calc(var(--tile-size) + 2 * var(--ha-space-2))" : "calc(var(--tile-size) + 2 * var(--ha-space-4))"};
      display: grid !important;
      grid-template-columns: repeat(${card._orgTi.cols}, minmax(0, 1fr));
      gap: ${card._orgTi.list ? "0" : "var(--ha-space-3)"} !important;
      width: 100%;
      ${card._orgTi.list ? `--org-sign-col: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--tile-size)"};
      --org-sign-size: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--icon-size-m)"};
      --org-sign-gap: ${card._orgTi.slim ? "var(--ha-space-3)" : "var(--ha-space-2)"};
      box-sizing: border-box;
      padding: var(--ha-space-2);
      border-radius: var(--ha-card-border-radius);
      background-color: var(--tile-background, var(--fill-subtle));` : ""}
    }
    ${card._orgTi.free ? `
    /* A tile without an icon shows its name and state, and its lane stays with it */
    .bubble-sub-button.hidden:is(${card._orgTi.free}):not([style*="display: none"]),
    .bubble-sub-button-alignment-lane.hidden:has(> .bubble-sub-button-group > :is(${card._orgTi.free})) {
      display: flex !important;
    }` : ""}
    /* A tile without an icon is as tall as a tile with one */
    .bubble-sub-button {
      ${card._orgTi.list ? "position: relative !important;" : ""}
      ${card._orgTi.slim ? "box-sizing: border-box !important;\n      align-items: center !important;" : ""}
      flex-direction: row !important;
      justify-content: flex-start !important;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      min-height: var(--org-row-min) !important;
      padding: ${card._orgTi.list ? "var(--ha-space-2)" : "var(--ha-space-4)"} !important;
      border-radius: ${card._orgTi.list ? "calc(var(--ha-card-border-radius) - var(--ha-space-2))" : "var(--ha-card-border-radius)"} !important;
      background-color: ${card._orgTi.list ? "transparent" : "var(--tile-background, var(--fill-subtle))"} !important;
      color: var(--primary-text-color) !important;
      transition: var(--transition-interactive) !important;
    }
    .bubble-sub-button-icon,
    .bubble-sub-button-image {
      position: static !important;
      order: -1;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--tile-size)"} !important;
      min-width: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--tile-size)"} !important;
      height: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--tile-size)"} !important;
      margin: 0 !important;
      margin-inline-end: var(--ha-space-3) !important;
      border-radius: ${card._orgTi.slim ? "0" : "var(--radius-inner)"} !important;
      box-shadow: ${card._orgTi.slim ? "none" : "var(--tile-chip-shadow, var(--ha-card-box-shadow))"};
      transition: var(--transition-interactive);
    }
    .bubble-sub-button-icon {
      --mdc-icon-size: ${card._orgTi.slim ? "var(--icon-size-s)" : "var(--icon-size-m)"} !important;
      background-color: ${card._orgTi.slim ? "transparent" : "var(--org-tile-chip, var(--tile-chip-background, var(--ha-card-background)))"};
      color: var(--org-tile-color, ${card._orgTi.slim ? "var(--secondary-text-color)" : "var(--primary-text-color)"}) !important;
    }
    /* In a slim row, the name and the state share one line. The name keeps at least 40 % of it, or its measured width if that is less, and the state takes at most the rest. Bubble Card's own state text has a row of no height below them. */
    .bubble-sub-button-name-container {
      display: ${card._orgTi.slim ? "grid" : "flex"} !important;
      flex: 1 1 auto;
      flex-direction: column;
      ${card._orgTi.slim ? "grid-template-columns: minmax(min(40%, var(--org-name-w, 40%)), 1fr) minmax(0, max-content);\n      grid-auto-rows: 0;" : ""}
      align-items: ${card._orgTi.slim ? "center" : "flex-start"};
      min-width: 0;
      overflow: visible !important;
      white-space: nowrap !important;
      font-size: 0 !important;
      font-weight: var(--ha-font-weight-bold);
      line-height: ${card._orgTi.slim ? "var(--ha-line-height-normal)" : "inherit"} !important;
    }
    .bubble-sub-button-name-container::before,
    .bubble-sub-button-name-container::after {
      box-sizing: content-box;
      padding: 2px;
      margin: -2px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bubble-sub-button-name-container::before {
      content: var(--org-tile-name, "");
      max-width: 100%;
      font-size: var(--ha-font-size-m);
      ${card._orgTi.slim ? "grid-area: 1 / 1;\n      font-weight: var(--ha-font-weight-medium);" : ""}
    }
    /* A slim row's state stands at its end in bold */
    .bubble-sub-button-name-container::after {
      content: var(--org-tile-state, "");
      max-width: 100%;
      margin-top: ${card._orgTi.slim ? "-2px" : card._orgTi.list ? "2px" : "calc(var(--ha-space-1) - 2px)"};
      ${card._orgTi.slim ? "grid-area: 1 / 2;\n      margin-inline-start: calc(var(--ha-space-3) - 2px);" : ""}
      font-size: ${card._orgTi.slim ? "var(--ha-font-size-m)" : "var(--ha-font-size-s)"};
      font-weight: ${card._orgTi.slim ? "var(--ha-font-weight-bold)" : "var(--ha-font-weight-medium)"};
      color: var(--secondary-text-color);
    }
    ${card._orgTi.css}
    ${card._orgTi.list ? `
    .bubble-sub-button.bubble-action-enabled:active {
      background-color: var(--fill-subtle) !important;
    }
    /* The sign at a row's end is an icon in the middle of a column as wide as the icons' column on the other side. It is quiet, and it stands out while what it controls is on or runs. */
    ${card._orgTi.sign.at(card._orgTi.sign.all)} {
      padding-inline-end: calc(var(--ha-space-2) + var(--org-sign-col) + var(--org-sign-gap)) !important;
    }
    ${card._orgTi.sign.at(card._orgTi.sign.all, "::after")} {
      content: "";
      position: absolute;
      top: 50%;
      inset-inline-end: calc(var(--ha-space-2) + (var(--org-sign-col) - var(--org-sign-size)) / 2);
      width: var(--org-sign-size);
      height: var(--org-sign-size);
      translate: 0 -50%;
      -webkit-mask: var(--org-sign-icon) center / contain no-repeat;
      mask: var(--org-sign-icon) center / contain no-repeat;
      background-color: var(--secondary-text-color);
      opacity: var(--opacity-muted);
      pointer-events: none;
      transition: background-color var(--duration-normal) ease, opacity var(--duration-normal) ease;
    }
    ${card._orgTi.sign.at("open", "::after")} {
      --org-sign-icon: ${card._orgTi.sign.chevron};
    }
    ${card._orgTi.sign.at("open", "::after", "ha-card:dir(rtl) ")} {
      scale: -1 1;
    }
    ${card._orgTi.sign.at("run running", "::after")} {
      --org-sign-icon: ${card._orgTi.sign.play};
    }
    ${card._orgTi.sign.at("stop", "::after")} {
      --org-sign-icon: ${card._orgTi.sign.stop};
    }
    ${card._orgTi.sign.at("switch", "::after")} {
      --org-sign-icon: ${card._orgTi.sign.off};
    }
    ${card._orgTi.sign.at("on", "::after")} {
      --org-sign-icon: ${card._orgTi.sign.on};
    }
    ${card._orgTi.sign.at("running stop on", "::after")} {
      background-color: var(--primary-text-color);
      opacity: 1;
    }
    ${card._orgTi.lines ? `
    /* With dividers, each shown row after another shown row draws the line above it. The line spans the row's content, and the content keeps the same space to the line above as to the line below. */
    .bubble-sub-button${card._orgTi.shown}:not([style*="display: none"]) ~ .bubble-sub-button${card._orgTi.shown}:not([style*="display: none"]) {
      min-height: calc(var(--org-row-min) + var(--org-line-width)) !important;
      padding-top: calc(var(--ha-space-2) + var(--org-line-width)) !important;
      background-image: linear-gradient(var(--org-line-color), var(--org-line-color)) !important;
      background-size: calc(100% - 2 * var(--ha-space-2)) var(--org-line-width) !important;
      background-position: center top !important;
      background-repeat: no-repeat !important;
    }` : ""}` : ""}
