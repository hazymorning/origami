origami_popup:
  name: "Origami • Popup"
  version: "4.7.0"
  supported:
    - pop-up
  description: "Popup styles a pop-up's header, backdrop and close button, and it can show a cover behind the content. The title can be a template. On a header that shows only a name, the sub-buttons become values below or beside the title, as text or chips, with Header's keys."
  code: |-
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12.6)) throw new Error("origami_popup needs origami_base 12.6 or later");
      const cfg = this.config.origami_popup ?? {};
      const env = { hass, renderTemplate };
      const ctx = { entity, state: hass.states[entity]?.state ?? "unknown", attr: hass.states[entity]?.attributes ?? {} };
      // Origami 2 named this option subtitle_style, and that name still works
      const chip = (cfg.value_style ?? cfg.subtitle_style) === "chip";
      // Bubble Card draws a header with an entity as a switch, unless it has a button_type of its own. Such a header keeps Bubble Card's own layout.
      const type = ["classic", "home-assistant"].includes(this.config.popup_style) ? "switch" : this.config.button_type || (this.config.entity ? "switch" : "name");
      // Popup writes the title, as Bubble Card would, so a title in ${ } reads the states at once, such as the view that a helper chooses. A header that shows only a name has no title without a name of its own, and a header with a button shows its entity's name.
      const own = this.config.name;
      if (card.querySelector('.bubble-name')) card.querySelector('.bubble-name').textContent = type !== "name" ? org.name(hass, entity, own, env) : org.has(own) ? String(org.value(env, own, ctx) ?? "") : "";
      // A value with a name of its own and no visibility conditions always shows, even while Bubble Card would hide it, so the header keeps the row for it
      const list = org.subs(env, this.config, "origami_popup");
      const forced = list.filter(({ item, opt }) => org.has(opt?.name) && !item.visibility).map(({ n }) => ".bubble-sub-button-" + n);
      card._orgP = {
        chip,
        title: type === "name",
        // With value_position: beside, the values stand at the right of the title, before the close button
        beside: cfg.value_position === "beside",
        // The icon passes its tap to the card, unless the pop-up has an entity whose icon Bubble Card makes tappable
        icon: !this.config.entity,
        any: [".bubble-sub-button:not(.hidden)", ...forced].join(", "),
        blur: this.config.backdrop_blur === undefined && this.config.performance_mode !== "performance",
        // The Art option shows a cover behind the pop-up's content, with Media's cover mix and blur. With a media player's entity ID, it is the cover that Media shows for that player, so a music card and its pop-up show the same picture at the same moment. While its value is empty, the last cover fades out.
        art: cfg.art === undefined ? null : ((v) => /^media_player\.\w+$/.test(v) ? org.media(hass, v, { env }).art : org.picture(v))(String(org.value(env, cfg.art, ctx) ?? "").trim()) ?? "",
        mix: cfg.cover_mix ?? 16,
        cover: cfg.cover_blur === undefined || org.yes(cfg.cover_blur),
        css: org.values(env, this.config, "origami_popup", "div.bubble-header .bubble-sub-button-container", cfg.value_position === "beside" ? "var(--ha-font-size-s)" : "var(--ha-font-size-m)", list).join("\n")
      };
      if (card._orgP.art) card._orgPArt = card._orgP.art;
      // gap sets the space between the cards of a vertical stack in the pop-up, and a Header separator there has twice that space above its title and that space once below it
      card._orgP.gap = String(cfg.gap ?? "").trim();
      return "";
    })()}
    .bubble-pop-up {
      gap: 0px !important;
      --org-popup-pad: var(--ha-space-4);
      --org-header-pad-bottom: var(--ha-space-2);
    }
    .bubble-pop-up.no-header:not(.popup-mode-centered):not(.editor) > .bubble-header-container::before {
        display: none;
    }
    .bubble-pop-up-container {
      --scroller-bleed: calc(2 * var(--ha-space-4));
      --scroller-padding: var(--scroller-bleed) var(--scroller-bleed) calc(var(--scroller-bleed) + var(--ha-space-4));
      --scroller-mask: linear-gradient(to right, transparent 0px, black var(--scroller-bleed), black calc(100% - var(--ha-space-12, 48px)), transparent 100%);
      ${card._orgP.gap ? `--bubble-pop-up-gap: ${card._orgP.gap};
      --org-header-above: ${card._orgP.gap};
      --org-header-below: 0px;` : ""}
      margin-top: 0px !important;
      padding-top: var(--org-popup-pad) !important;
      padding-inline: calc(2 * var(--ha-space-4)) !important;
    }
    /* Without a header, Bubble Card keeps a strip for dragging and pulls the content over part of it. The content then starts at the same padding as below a header. */
    .bubble-pop-up.no-header:not(.popup-style-home-assistant):not(.popup-mode-adaptive-dialog) > .bubble-pop-up-container {
      margin-top: calc(-1 * var(--ha-space-6, 24px)) !important;
      padding-top: var(--org-popup-pad) !important;
    }
    .bubble-pop-up:is(.popup-mode-fit-content, .popup-mode-centered, .popup-mode-adaptive-dialog, .is-standalone-pop-up, .editor) .bubble-pop-up-container {
      padding-bottom: max(var(--org-popup-pad), var(--safe-area-inset-bottom, 0px)) !important;
    }
    .bubble-pop-up-container.is-scrollable {
      --bubble-pop-up-mask-top-stop: var(--org-popup-pad) !important;
      --bubble-pop-up-mask-bottom-stop: var(--org-popup-pad) !important;
    }
    ${card._orgP.art === null ? "" : card._org.backdrop(".bubble-pop-up-background::after", card._orgPArt, card._orgP.art ? card._orgP.mix : 0, card._orgP.cover, "var(--bubble-pop-up-border-radius, var(--bubble-border-radius, 42px)) var(--bubble-pop-up-border-radius, var(--bubble-border-radius, 42px)) 0 0", card.querySelector(".bubble-pop-up-background")) + `
    .bubble-pop-up-background::after {
      z-index: 0;
    }
    .bubble-pop-up-container > * {
      position: relative;
      z-index: 1;
    }`}
    ${card._orgP.blur ? `.bubble-backdrop {
      backdrop-filter: blur(4px) !important;
    }` : ""}
    .bubble-header-container {
      margin: 0px !important;
      padding: calc(2 * var(--ha-space-4)) calc(2 * var(--ha-space-4)) var(--org-header-pad-bottom) !important;
      height: calc(2 * var(--ha-space-4) + var(--org-header-pad-bottom) + var(--control-height-icon)) !important;
      z-index: 4 !important;
    }
    .bubble-header-container > .bubble-header-actions {
      height: var(--control-height-icon) !important;
      align-items: center !important;
    }
    .bubble-close-button {
      display: flex;
      border-radius: var(--radius-control, 14px) !important;
      background-color: transparent !important;
      opacity: var(--opacity-quiet);
      font-weight: var(--ha-font-weight-medium) !important;
      min-width: var(--control-height-icon) !important;
      min-height: var(--control-height-icon) !important;
      margin-inline-end: 0px !important;
    }
    .bubble-close-icon {
      --mdc-icon-size: 32px;
    }
    .bubble-header-action-icon svg {
      width: 32px !important;
      height: 32px !important;
    }
    ${card._orgP.title ? `
    div.bubble-header .bubble-button-card-container,
    .bubble-icon-container {
      background: transparent !important;
    }
    ${card._orgP.icon ? `.bubble-icon-container {
      pointer-events: none;
    }` : ""}
    .bubble-icon {
      --mdc-icon-size: 36px;
    }
    div.bubble-header .bubble-container {
      height: var(--control-height-icon) !important;
      min-height: 0px !important;
      overflow: visible !important;
    }
    div.bubble-header .bubble-name-container {
      margin-inline-start: 0px !important;
      min-height: 0px !important;
    }
    .bubble-name {
      font-size: var(--ha-font-size-2xl) !important;
      font-weight: var(--ha-font-weight-bold);
      line-height: var(--ha-line-height-condensed) !important;
      margin-inline-start: 0px !important;
      white-space: nowrap !important;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-line-clamp: 1 !important;
    }
    ${card._orgP.beside ? `
    /* Beside the title, the values are small text */
    div.bubble-header .bubble-sub-button-container {
      position: relative !important;
      inset: auto !important;
      align-self: center !important;
      flex: 0 0 auto !important;
      margin: 0 !important;
      margin-inline-start: var(--ha-space-3) !important;
      padding: 0 !important;
    }
    div.bubble-header .bubble-sub-button {
      font-size: var(--ha-font-size-s) !important;
    }` : `
    .bubble-header-container:has(${card._orgP.any}) {
      height: calc(2 * var(--ha-space-4) + var(--org-header-pad-bottom) + var(--control-height-icon) + var(--control-height-mini)) !important;
    }
    div.bubble-header:has(${card._orgP.any}) .bubble-container {
      height: calc(var(--control-height-icon) + var(--control-height-mini)) !important;
    }
    div.bubble-header:has(${card._orgP.any}) .bubble-wrapper {
      display: grid !important;
      grid-template-areas: "i n a" "i b a" !important;
      grid-template-columns: auto 1fr auto !important;
      grid-template-rows: var(--control-height-icon) var(--control-height-mini) !important;
      align-items: center !important;
    }
    div.bubble-header .bubble-icon-container {
      grid-area: i !important;
    }
    div.bubble-header .bubble-content-container,
    div.bubble-header .bubble-name-container {
      grid-area: n !important;
      min-height: 0px !important;
      align-self: center !important;
    }
    div.bubble-header .bubble-buttons-container {
      grid-area: a !important;
    }
    div.bubble-header .bubble-sub-button-container {
      grid-area: b !important;
      position: relative !important;
      justify-self: start !important;
      align-self: center !important;
      justify-content: flex-start !important;
      width: auto !important;
      inset-inline-end: 0px !important;
      margin: 0px !important;
      margin-inline-end: auto !important;
      padding: 0px !important;
    }`}
    ${card._org.plain("div.bubble-header .bubble-sub-button-container", "var(--ha-font-weight-medium)")}
    ${card._orgP.chip ? card._org.chips("div.bubble-header .bubble-sub-button-container") : ""}
    div.bubble-header .bubble-sub-button-icon {
      --mdc-icon-size: var(--icon-size-2xs) !important;
      margin: 0px !important;
      margin-inline-end: var(--ha-space-1) !important;
      opacity: var(--opacity-muted);
    }
    div.bubble-header .bubble-sub-button.content-icon-right .bubble-sub-button-icon {
      margin-inline: var(--ha-space-1) 0 !important;
    }
    ` : ""}
    ${card._orgP.css}
  editor:
    - name: value_style
      label: "Value style"
      selector:
        select:
          mode: dropdown
          options:
            - label: Text
              value: text
            - label: Chips
              value: chip
    - name: value_position
      label: "Values"
      selector:
        select:
          mode: dropdown
          options:
            - label: Below the title
              value: below
            - label: Beside the title
              value: beside
      default: below
    - name: art
      label: "Art (a media player, a cover's address or a template, behind the content)"
      selector:
        text: {}
    - name: cover_mix
      label: "Cover mix (the art's share in percent)"
      selector:
        number:
          min: 0
          max: 100
          step: 2
          mode: slider
          unit_of_measurement: "%"
      default: 16
    - name: cover_blur
      label: "Cover blur"
      selector:
        boolean: {}
      default: true
    - name: gap
      label: "Space between the cards in a vertical stack (for example var(--ha-space-4))"
      selector:
        text: {}
