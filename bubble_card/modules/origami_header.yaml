origami_header:
  name: "Origami • Header"
  version: "3.0.1"
  supported:
    - separator
  description: "Header turns a separator card into a section header. The card's name is the title, and the sub-buttons are values on the right, as text or as chips. Each value can have its own name, icon, colors and background."
  editor:
    - name: value_style
      label: "Value style"
      selector:
        select:
          mode: dropdown
          options:
            - label: Text
              value: text
            - label: Chips
              value: chip
      default: text
    - name: weight
      label: "Value weight"
      selector:
        select:
          mode: dropdown
          options:
            - label: Bold
              value: bold
            - label: Medium
              value: medium
            - label: Regular
              value: regular
      default: bold
    - name: icon_color
      label: "Icon color (color or template)"
      selector:
        template: {}
    - name: icon_size
      label: "Icon size"
      selector:
        text: {}
      default: "var(--icon-size-xs)"
    - name: value_max_width
      label: "Value max width (for example 50%)"
      selector:
        text: {}
  code: |
    ${(() => {
      // A header is taller than the separator's default 0.8 grid rows, so it asks for auto height until rows are set. Once rows are set, Bubble Card's own grid options apply again.
      const auto = (this.config.grid_options?.rows ?? this.config.rows) === undefined;
      const own = Object.getPrototypeOf(this)?.getGridOptions;
      if (typeof own === "function" && auto !== !!this._orgHAutoRows) {
        if (auto) this.getGridOptions = () => ({ ...own.call(this), rows: "auto", min_rows: undefined, max_rows: undefined });
        else delete this.getGridOptions;
        this._orgHAutoRows = auto;
        requestAnimationFrame(() => this.dispatchEvent(new CustomEvent("card-updated", { bubbles: true, composed: true })));
      }
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_header needs origami_base 12 or later, listed before it");
      const env = { hass, renderTemplate };
      const cfg = this.config.origami_header ?? {};
      const raw = org.value(env, cfg.icon_color, { entity, state: hass.states[entity]?.state ?? "unknown", attr: hass.states[entity]?.attributes ?? {} });
      const size = String(cfg.icon_size ?? "").trim();
      const max = String(cfg.value_max_width ?? "").trim();
      card._orgH = {
        weight: cfg.weight === "regular" ? "var(--ha-font-weight-normal)" : cfg.weight === "medium" ? "var(--ha-font-weight-medium)" : "var(--ha-font-weight-bold)",
        color: String(raw ?? "").trim() || "currentcolor",
        size: size || "var(--icon-size-xs)",
        max,
        chip: cfg.value_style === "chip"
      };
      const scope = "ha-card .bubble-sub-button-container";
      const list = org.subs(env, this.config, "origami_header");
      const rules = org.values(env, this.config, "origami_header", scope, "var(--ha-font-size-m)", list);
      // A name next to a plain icon needs the gap that Bubble Card leaves out when the sub-button shows no state, on either side of the name
      if (!card._orgH.chip) list.forEach(({ n, opt }) => {
        if (!org.has(opt?.name)) return;
        const sel = scope + " .bubble-sub-button.bubble-sub-button-" + n;
        rules.push(sel + ":not(.content-icon-right) .bubble-sub-button-icon.icon-without-state:not(.hidden) { margin-inline-end: var(--ha-space-1) !important; }");
        rules.push(sel + ".content-icon-right .bubble-sub-button-icon:not(.hidden) { margin-inline: var(--ha-space-1) 0 !important; }");
      });
      card._orgHCss = rules.join("\n");
      return "";
    })()}
    ha-card {
      --org-header-weight: ${card._orgH.weight};
      --org-header-icon-color: ${card._orgH.color};
      --org-header-icon-size: ${card._orgH.size};
    }
    ha-card .bubble-container {
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 0 !important;
      height: auto !important;
      min-height: 0 !important;
      padding: var(--ha-space-6, 24px) 0 var(--ha-space-2) 0 !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    ha-card .bubble-container > .bubble-icon,
    ha-card .bubble-container > .bubble-line {
      display: none !important;
    }
    ha-card .bubble-container > .bubble-name {
      display: block !important;
      flex: 0 1 auto;
      min-width: 0;
      margin: 0 !important;
      padding: 0 !important;
      font-size: var(--ha-font-size-l) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      color: var(--primary-text-color) !important;
      white-space: nowrap !important;
      overflow-x: clip;
      overflow-y: visible;
      text-overflow: ellipsis;
    }
    ha-card .bubble-sub-button-container {
      position: relative !important;
      inset-inline-end: 0 !important;
      flex: 1 1 0% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-end !important;
      height: auto !important;
      margin: 0 !important;
      margin-inline-start: var(--ha-space-3) !important;
      padding: 0 !important;
      background: none !important;
    }
    ${card._org.plain("ha-card .bubble-sub-button-container", "var(--org-header-weight)")}
    ha-card .bubble-sub-button-container .bubble-sub-button:not(.bubble-action-enabled) {
      pointer-events: none;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      display: block !important;
      flex-shrink: 0;
      font-weight: var(--ha-font-weight-normal) !important;
      --mdc-icon-size: var(--org-header-icon-size) !important;
      margin-block: -2px 0 !important;
      margin-inline: 0 var(--ha-space-1) !important;
      color: var(--org-header-icon-color) !important;
      opacity: 1 !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
      margin: 0 !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon.icon-without-state:not(.hidden) {
      margin: -2px 0 0 !important;
    }
    ${card._orgH.max ? `
    ha-card .bubble-sub-button-container {
      flex: 0 1 auto !important;
      min-width: 0 !important;
      max-width: ${card._orgH.max} !important;
      margin: 0 !important;
      margin-inline-start: auto !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button {
      min-width: 0 !important;
      max-width: 100% !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button-name-container {
      display: block !important;
      min-width: 0 !important;
      overflow: hidden !important;
      white-space: nowrap !important;
      text-overflow: ellipsis !important;
      -webkit-line-clamp: unset !important;
      line-height: inherit !important;
    }
    ` : ""}
    ${card._orgH.chip ? card._org.chips("ha-card .bubble-sub-button-container") : ""}
    ${card._orgHCss}