origami_header:
  name: "Origami • Header"
  version: "2.0.0"
  supported:
    - separator
  description: "The Header module creates a section header on a separator card. The card's name is the title, and the sub-buttons are the values on the right. Setting Value style to Chips turns the values into pills. A sub-button with show_background turned off stays plain. Each sub-button can have an origami_header key with name, icon, color and background. These keys accept a value, a map from the entity's state to a value, or JavaScript in ${ }. List Base before Header, because Header uses Base's helpers. The header leaves 24 px of space above it and 8 px below it, and it sets its own height."
  editor:
    - name: value_style
      label: "Value style"
      selector:
        select:
          mode: dropdown
          options:
            - label: Text
              value: text
            - label: Chips
              value: chip
      default: text
    - name: weight
      label: "Value weight"
      selector:
        select:
          mode: dropdown
          options:
            - label: Bold
              value: bold
            - label: Medium
              value: medium
            - label: Regular
              value: regular
      default: bold
    - name: icon_color
      label: "Icon color (color or template)"
      selector:
        template: {}
    - name: icon_size
      label: "Icon size"
      selector:
        text: {}
      default: "var(--dot-size, 12px)"
    - name: value_max_width
      label: "Value max width (for example 50%)"
      selector:
        text: {}
  code: |
    ${(() => {
      // A header is taller than the separator's default 0.8 grid rows, so it asks for auto height unless rows are set
      const setRows = this.config.grid_options?.rows ?? this.config.rows;
      if (setRows === undefined && !this._orgHAutoRows && typeof this.getGridOptions === "function") {
        const base = this.getGridOptions.bind(this);
        this.getGridOptions = () => ({ ...base(), rows: "auto", min_rows: undefined, max_rows: undefined });
        this._orgHAutoRows = true;
        requestAnimationFrame(() => this.dispatchEvent(new CustomEvent("card-updated", { bubbles: true, composed: true })));
      }
      const cfg = this.config.origami_header ?? {};
      const raw = cfg.icon_color ? renderTemplate(cfg.icon_color) : "";
      const size = String(cfg.icon_size ?? "").trim();
      const max = String(cfg.value_max_width ?? "").trim();
      card._orgH = {
        weight: cfg.weight === "regular" ? "var(--ha-font-weight-normal)" : cfg.weight === "medium" ? "var(--ha-font-weight-medium)" : "var(--ha-font-weight-bold)",
        color: String(raw ?? "").trim() || "currentcolor",
        size: size || "var(--dot-size, 12px)",
        max,
        chip: cfg.value_style === "chip"
      };
      const org = card._org;
      if (org?.hass !== hass) throw new Error("origami_header needs origami_base 10 or later, listed before it");
      const rules = [];
      org.subs({ hass, renderTemplate }, this.config, "origami_header").forEach(({ n, item, opt }) => {
        if (!opt) return;
        const sel = "ha-card .bubble-sub-button-container .bubble-sub-button.bubble-sub-button-" + n;
        if (org.has(opt.name)) {
          rules.push(...org.text(sel, item, opt.name, "var(--ha-font-size-m)"));
          if (!card._orgH.chip) rules.push(sel + ":not(.content-icon-right) .bubble-sub-button-icon.icon-without-state:not(.hidden) { margin-inline-end: var(--ha-space-1) !important; }");
        }
        if (org.has(opt.color)) {
          rules.push(sel + " { color: " + opt.color + " !important; }");
          rules.push(sel + " .bubble-sub-button-icon:not(.hidden) { color: " + opt.color + " !important; }");
        }
        if (org.has(opt.background)) rules.push(sel + " { --org-header-chip: " + opt.background + "; }");
        if (org.has(opt.icon)) org.icon(card.querySelector(".bubble-sub-button-container .bubble-sub-button-" + n + " .bubble-sub-button-icon"), opt.icon);
      });
      card._orgHCss = rules.join("\n");
      return "";
    })()}
    ha-card {
      --org-header-weight: ${card._orgH.weight};
      --org-header-icon-color: ${card._orgH.color};
      --org-header-icon-size: ${card._orgH.size};
    }
    ha-card .bubble-container {
      display: flex !important;
      align-items: center !important;
      justify-content: flex-start !important;
      gap: 0 !important;
      height: auto !important;
      min-height: 0 !important;
      padding: var(--ha-space-6, 24px) 0 var(--ha-space-2) 0 !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    ha-card .bubble-container > .bubble-icon,
    ha-card .bubble-container > .bubble-line {
      display: none !important;
    }
    ha-card .bubble-container > .bubble-name {
      display: block !important;
      flex: 0 1 auto;
      min-width: 0;
      margin: 0 !important;
      padding: 0 !important;
      font-size: var(--ha-font-size-l) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      color: var(--primary-text-color) !important;
      white-space: nowrap !important;
      overflow-x: clip;
      overflow-y: visible;
      text-overflow: ellipsis;
    }
    ha-card .bubble-sub-button-container {
      position: relative !important;
      inset-inline-end: 0 !important;
      flex: 1 1 0% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: flex-end !important;
      gap: var(--ha-space-3) !important;
      height: auto !important;
      margin: 0 0 0 var(--ha-space-3) !important;
      padding: 0 !important;
      background: none !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button {
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: 0 !important;
      border-radius: 0 !important;
      background: none !important;
      box-shadow: none !important;
      font-size: var(--ha-font-size-m) !important;
      font-weight: var(--org-header-weight) !important;
      color: var(--secondary-text-color) !important;
      white-space: nowrap !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button:not(.bubble-action-enabled) {
      pointer-events: none;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button-name-container {
      font-size: inherit !important;
      font-weight: inherit !important;
      color: inherit !important;
      opacity: 1 !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      display: block !important;
      flex-shrink: 0;
      font-weight: var(--ha-font-weight-normal) !important;
      --mdc-icon-size: var(--org-header-icon-size) !important;
      margin: -2px var(--ha-space-1) 0 0 !important;
      color: var(--org-header-icon-color) !important;
      opacity: 1 !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
      margin: 0 !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button .bubble-sub-button-icon.icon-without-state:not(.hidden) {
      margin: -2px 0 0 0 !important;
    }
    ${card._orgH.max ? `
    ha-card .bubble-sub-button-container {
      flex: 0 1 auto !important;
      min-width: 0 !important;
      max-width: ${card._orgH.max} !important;
      margin: 0 0 0 auto !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button {
      min-width: 0 !important;
      max-width: 100% !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button-name-container {
      display: block !important;
      min-width: 0 !important;
      overflow: hidden !important;
      white-space: nowrap !important;
      text-overflow: ellipsis !important;
      -webkit-line-clamp: unset !important;
      line-height: inherit !important;
    }
    ` : ""}
    ${card._orgH.chip ? `
    ha-card .bubble-sub-button-container {
      gap: var(--ha-space-2) !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button.background-off,
    ha-card .bubble-sub-button-container .bubble-sub-button.background-on {
      gap: var(--ha-space-1) !important;
      min-height: var(--control-height-mini) !important;
      padding: 0 var(--ha-space-3) !important;
      border-radius: var(--radius-inner) !important;
      background-color: var(--org-header-chip, var(--fill-subtle)) !important;
      color: var(--primary-text-color) !important;
      font-variant-numeric: tabular-nums;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button.background-off .bubble-sub-button-icon:not(.hidden),
    ha-card .bubble-sub-button-container .bubble-sub-button.background-on .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--icon-size-2xs) !important;
      margin: 0 !important;
      color: inherit !important;
    }
    ha-card .bubble-sub-button-container .bubble-sub-button.background-off .bubble-sub-button-name-container:empty,
    ha-card .bubble-sub-button-container .bubble-sub-button.background-on .bubble-sub-button-name-container:empty {
      display: none !important;
    }
    ` : ""}
    ${card._orgHCss}