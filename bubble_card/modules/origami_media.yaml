origami_media:
  name: "Origami • Media"
  version: "5.2.0"
  supported:
    - media-player
  description: "Media styles media player cards. The speaker layout shows the music, the input and the cover, and the TV layout shows what plays or the running app. Its options name other players of the same device, a group leader, a cover, more inputs and the icons."
  editor:
    - name: layout
      label: "Layout"
      selector:
        select:
          mode: dropdown
          options:
            - label: Speaker
              value: speaker
            - label: TV
              value: tv
      default: speaker
    - name: players
      label: "Players (other media players for the same device)"
      selector:
        entity:
          domain: media_player
          multiple: true
    - name: collapse
      label: "Hide the slider when inactive"
      selector:
        boolean: {}
    - name: solid_controls
      label: "Filled play and power buttons"
      selector:
        boolean: {}
    - name: leader
      label: "Leader (for groups without group_members)"
      selector:
        template: {}
    - name: art
      label: "Picture (the cover's address, if the player has none)"
      selector:
        template: {}
    - name: ignore_art
      label: "Ignore pictures (texts in the addresses of pictures to leave out)"
      selector:
        text:
          multiple: true
    - name: inputs
      label: "Inputs (more source names that count as inputs)"
      selector:
        text:
          multiple: true
    - name: icons
      label: "Icons (a map from a state or an input to an icon)"
      selector:
        object: {}
    - name: keep_name
      label: "Keep name (the title goes to the state line)"
      selector:
        boolean: {}
    - name: state
      label: "State line (text or template)"
      selector:
        text: {}
    - name: badge
      label: "Group badge"
      selector:
        boolean: {}
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_media needs origami_base 12 or later");
      const own = this.config.origami_media ?? {};
      // Origami 2 named a TV's players art_entity and app_entity, and those still work as the TV layout with these players
      const old = [own.art_entity, own.app_entity].filter(Boolean);
      const cfg = old.length && !own.layout && !own.players ? { ...own, layout: "tv", players: old } : own;
      const env = { hass, renderTemplate };
      const ent = hass.states[entity];
      const tv = cfg.layout === "tv";
      const m = org.media(hass, entity, { env, tv, cfg });
      // A TV is on while its entity says so. When the entity has no answer, any player of the same device that is on decides.
      const power = m.power;
      // The speaker shows its music while it plays, and its name at other times
      const music = !tv && m.active && m.playing && !m.input && !!m.title;
      card._orgM = {
        m,
        music,
        on: tv ? power === true : m.active,
        playing: tv ? ["playing", "buffering"].includes(ent?.state) || m.playing : m.playing,
        powered: tv ? power === true : org.power(ent) === true,
        art: m.art && (!tv || power) ? m.art : null,
        collapse: !!cfg.collapse,
        // Origami 2 kept Filled play and power buttons under origami_base, and that place still works
        solid: !!(cfg.solid_controls ?? this.config.origami_base?.solid_controls),
        // Base hides the state line on compact rows and under the icon, and show_state: false hides it too
        state: this.config.show_state === false || card._org.opts.compact || card._org.opts.vertical ? "none" : "block"
      };
      const c = card._orgM;
      // With Filled play and power buttons, the play button is filled while media plays and the power button while the device is on
      c.filled = c.solid ? [c.playing ? ".bubble-play-pause-button" : "", c.powered ? ".bubble-power-button" : ""].filter(Boolean) : [];
      // With Keep name, the name line always shows the card's name, and the state line shows the title and the artist while music plays
      const keep = !!cfg.keep_name;
      const name = music && !keep ? m.title : org.name(hass, entity, this.config.name, env);
      const line = tv
        ? (power === null ? org.word(hass, ent ?? null, null, ent?.state ?? "unavailable")
          : !power ? org.word(hass, ent, null, "off")
          : m.title || (m.app ? org.word(hass, m.appEntity, "app_name", m.app) : "") || (m.source ? org.word(hass, m.show, "source") : "")
            || org.word(hass, m.player ?? ent, null, m.player?.state === "paused" ? "paused" : "on"))
        : m.input ? org.word(hass, m.show, "source")
        : music ? (keep ? [m.title, m.artist].filter(Boolean).join(" • ") : m.artist) || org.word(hass, m.player)
        : org.word(hass, m.show);
      // The State option replaces the state line while it has a value, such as a title from a template sensor
      const set = org.value(env, cfg.state, { entity, state: ent?.state ?? "unknown", attr: ent?.attributes ?? {} });
      const shown = org.has(set) ? String(set) : line;
      // Bubble Card hands the name and the state line to a module whose code contains these exact assignments, and it skips a write that repeats a line's text
      card.querySelector('.bubble-name').textContent = name;
      card.querySelector('.bubble-state').textContent = shown;
      if (!tv) org.icon(icon, m.icon(cfg.icons));
      // With Group badge, a crown marks the group leader and a link marks its members, as in Speaker Select. Without the option, Media leaves the mark to Speaker Select on a card that lists both.
      if (cfg.badge !== undefined) org.badge(cfg.badge ? m.role : null);
      return "";
    })()}
    ha-card {
      --org-color: ${card._orgM.m.color};
      --org-chip-bg: ${card._orgM.on ? "var(--org-field)" : "var(--org-inset)"};
      --org-chip-ink: ${card._orgM.on ? "var(--org-color)" : "var(--primary-text-color)"};
    }
    ${card._orgM.collapse && !card._orgM.on ? `
    .bubble-container,
    .bubble-media-player-container {
      height: var(--org-row-height) !important;
      min-height: 0 !important;
      max-height: var(--org-row-height) !important;
      overflow: hidden !important;
    }
    .bubble-sub-button-bottom-container,
    .with-bottom-buttons .bubble-sub-button-container:not(.fixed-top) {
      display: none !important;
    }
    ` : ""}
    ${card._org.cover(card._orgM.art, "1")}
    .bubble-name-container {
      display: flex !important;
    }
    .bubble-media-info-container {
      display: none !important;
    }
    .bubble-name,
    .bubble-state {
      margin: 0 !important;
      line-height: var(--ha-line-height-normal);
      overflow: hidden !important;
    }
    .bubble-state {
      display: ${card._orgM.state} !important;
    }
    ${card._orgM.music ? ".bubble-name.hidden { display: block !important; }" : ""}
    .bubble-media-button {
      min-width: var(--tile-size) !important;
      width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      border-radius: var(--radius-inner) !important;
      transition: var(--transition-interactive);
    }
    .bubble-media-button {
      background-color: transparent !important;
    }
    ${card._org.fill(card._orgM.filled)}
