origami_media:
  name: "Origami • Media"
  version: "5.0.0"
  supported:
    - media-player
  description: "The Media module styles media player cards together with Base. With the speaker layout, the card shows the title and the artist while music plays, the input while the speaker uses one, and the cover in the icon. With the TV layout, the state line shows the title, the app or the state, and the card's entity decides whether the TV is on. Players lists other media players for the same device, such as a Cast or Music Assistant player, and the first one that plays gives the title, the artist and the picture. Groups come from Home Assistant's group_members. For integrations without it, Leader gives the group leader's entity ID, and Picture gives the cover's address. Inputs adds source names that count as inputs. Icons replaces the icon for a state or an input, such as playing, off, bluetooth or tv. The words come from Home Assistant, and Base's words option shortens any of them. With Hide the slider when inactive, the card shrinks to its first row while nothing plays. With Filled play and power buttons, the play button is filled while media plays, and the power button is filled while the player is on. Cards with a slider at the bottom need rows set to 2.2."
  editor:
    - name: layout
      label: "Layout"
      selector:
        select:
          mode: dropdown
          options:
            - label: Speaker
              value: speaker
            - label: TV
              value: tv
      default: speaker
    - name: players
      label: "Players (other media players for the same device)"
      selector:
        entity:
          domain: media_player
          multiple: true
    - name: collapse
      label: "Hide the slider when inactive"
      selector:
        boolean: {}
    - name: solid_controls
      label: "Filled play and power buttons"
      selector:
        boolean: {}
    - name: leader
      label: "Leader (for groups without group_members)"
      selector:
        template: {}
    - name: art
      label: "Picture (the cover's address, if the player has none)"
      selector:
        template: {}
    - name: inputs
      label: "Inputs (more source names that count as inputs)"
      selector:
        text:
          multiple: true
    - name: icons
      label: "Icons (a map from a state or an input to an icon)"
      selector:
        object: {}
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass) throw new Error("origami_media needs origami_base 11 or later, listed before it");
      const cfg = this.config.origami_media ?? {};
      const env = { hass, renderTemplate };
      const ent = hass.states[entity];
      const ctx = { entity, state: ent?.state ?? "unknown", attr: ent?.attributes ?? {} };
      const m = org.media(hass, entity, { players: cfg.players, leader: org.value(env, cfg.leader, ctx), art: org.value(env, cfg.art, ctx), inputs: cfg.inputs });
      const tv = cfg.layout === "tv";
      // A TV is on while its entity says so. When the entity has no answer, any player of the same device that is on decides.
      const answers = (e) => e && !["unavailable", "unknown"].includes(e.state);
      const twins = [].concat(cfg.players ?? []).map((p) => hass.states[p]).filter(answers);
      const power = answers(ent) ? !["off", "standby"].includes(ent.state) : twins.length ? twins.some((p) => !["off", "standby"].includes(p.state)) : null;
      card._orgM = {
        tv,
        m,
        power,
        on: tv ? power === true : ["playing", "on"].includes(m.show?.state) || m.input !== null,
        playing: tv ? ["playing", "buffering"].includes(ent?.state) || m.playing : m.playing,
        art: m.art && (!tv || power) ? 'url(' + org.str(m.art) + ')' : "none",
        collapse: !!cfg.collapse,
        solid: !!cfg.solid_controls,
        rest: tv ? !power : !ent || ["off", "standby", "idle", "unavailable", "unknown"].includes(ent.state)
      };
      const c = card._orgM;
      // Bubble Card hands the state line to a module whose code contains this exact assignment
      const line = tv
        ? (power === null ? org.word(hass, ent ?? null, null, ent?.state ?? "unavailable")
          : !power ? org.word(hass, ent, null, "off")
          : m.title || (m.app ? org.word(hass, m.appEntity, "app_name", m.app) : "") || org.word(hass, m.player ?? ent, null, m.player?.state === "paused" ? "paused" : "on"))
        : m.input ? org.word(hass, m.show, "source") : org.word(hass, m.show);
      if (card.querySelector('.bubble-state') && card.querySelector('.bubble-state').innerText !== line) card.querySelector('.bubble-state').innerText = line;
      if (!tv) {
        org.icon(icon, m.icon(cfg.icons));
        const scroll = this.config.scrolling_effect !== false;
        org.title(card.querySelector(".bubble-title"), !m.input && m.show?.state === "playing" && m.title ? m.title : org.name(hass, entity, this.config.name), scroll);
        org.title(card.querySelector(".bubble-artist"), m.input ? org.word(hass, m.show, "source")
          : m.show?.state === "playing" && m.artist ? m.artist : org.word(hass, m.show), scroll);
      }
      return "";
    })()}
    ha-card {
      --org-color: var(--state-media_player-active-color);
      --org-chip-bg: ${card._orgM.on ? "var(--org-field)" : "var(--org-tile-bg, var(--org-inset))"};
      --org-chip-ink: ${card._orgM.on ? "var(--org-color)" : "var(--primary-text-color)"};
    }
    ${card._orgM.collapse && !card._orgM.on ? `
    .bubble-container,
    .bubble-media-player-container {
      height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4))) !important;
      min-height: 0 !important;
      max-height: var(--org-row-height, calc(var(--tile-size) + 2 * var(--ha-space-4))) !important;
      overflow: hidden !important;
    }
    .bubble-sub-button-bottom-container,
    .with-bottom-buttons .bubble-sub-button-container:not(.fixed-top) {
      display: none !important;
    }
    ` : ""}
    .bubble-icon-container {
      position: relative;
      ${this.config.tap_action ? "" : "pointer-events: none;"}
    }
    .bubble-icon-container,
    .bubble-main-icon-container {
      overflow: visible;
      background-image: none !important;
    }
    .bubble-icon-container.bubble-main-icon-container {
      background-color: var(--org-chip-bg) !important;
    }
    .bubble-main-icon-container::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: var(--org-tile-radius, var(--radius-inner));
      background-image: ${card._orgM.art};
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bubble-media-player .bubble-entity-picture {
      display: none !important;
    }
    ${card._orgM.rest ? ".bubble-entity-picture { display: none !important; }" : ""}
    .bubble-main-icon-container .bubble-icon {
      color: var(--org-chip-ink) !important;
      transition: opacity var(--duration-normal) ease, color var(--duration-normal) ease;
      opacity: ${card._orgM.art !== "none" ? 0 : 1} !important;
    }
    .bubble-name,
    .bubble-title,
    .bubble-state,
    .bubble-artist {
      display: block !important;
      max-width: var(--org-text-max, 100%) !important;
      margin: 0 !important;
      line-height: var(--ha-line-height-normal);
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis;
    }
    .bubble-state,
    .bubble-artist {
      display: var(--org-state-display, block) !important;
    }
    .bubble-sub-button-container {
      gap: var(--ha-space-2) !important;
      padding: 0;
      margin-inline-end: var(--ha-space-4);
    }
    .bubble-sub-button,
    .bubble-media-button {
      min-width: var(--tile-size) !important;
      width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      border-radius: var(--radius-inner) !important;
      transition: var(--transition-interactive);
    }
    .bubble-media-button {
      background-color: transparent !important;
    }
    ${card._orgM.solid && card._orgM.playing ? `
    .bubble-play-pause-button {
      color: var(--text-color-active);
      background-color: var(--fill-active) !important;
    }
    .bubble-play-pause-button .bubble-media-button-icon {
      color: var(--text-color-active) !important;
      --icon-primary-color: var(--text-color-active) !important;
    }
    ` : ""}
    ${card._orgM.solid && card._orgM.on ? `
    .bubble-power-button {
      color: var(--text-color-active);
      background-color: var(--fill-active) !important;
    }
    .bubble-power-button .bubble-media-button-icon {
      color: var(--text-color-active) !important;
      --icon-primary-color: var(--text-color-active) !important;
    }
    ` : ""}
    ${card._orgM.tv ? ".bubble-artist { display: none !important; }" : ""}
