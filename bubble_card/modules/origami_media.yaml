origami_media:
  name: "Origami • Media"
  version: "5.8.0"
  supported:
    - media-player
  description: "Media styles media player cards. The speaker layout shows the music, the input and the cover in the icon, above the name, behind the card or behind it and in the icon. The TV layout shows what plays or the running app. A play key shows the track's progress."
  editor:
    - name: layout
      label: "Layout"
      selector:
        select:
          mode: dropdown
          options:
            - label: Speaker
              value: speaker
            - label: TV
              value: tv
      default: speaker
    - name: players
      label: "Players (other media players for the same device)"
      selector:
        entity:
          domain: media_player
          multiple: true
    - name: collapse
      label: "Hide the slider when inactive"
      selector:
        boolean: {}
    - name: solid_controls
      label: "Filled play and power buttons"
      selector:
        boolean: {}
    - name: leader
      label: "Leader (for groups without group_members)"
      selector:
        template: {}
    - name: art
      label: "Picture (the cover's address, if the player has none)"
      selector:
        template: {}
    - name: ignore_art
      label: "Ignore pictures (texts in the addresses of pictures to leave out)"
      selector:
        text:
          multiple: true
    - name: inputs
      label: "Inputs (more source names that count as inputs)"
      selector:
        text:
          multiple: true
    - name: icons
      label: "Icons (a map from a state or an input to an icon)"
      selector:
        object: {}
    - name: keep_name
      label: "Keep name (the title goes to the state line)"
      selector:
        boolean: {}
    - name: state
      label: "State line (text or template)"
      selector:
        text: {}
    - name: badge
      label: "Group badge"
      selector:
        boolean: {}
    - name: icon_color
      label: "Icon colors (a map from a state or an input to a color)"
      selector:
        object: {}
    - name: cover
      label: "Cover (also a list, a map from the state or a template)"
      selector:
        select:
          mode: dropdown
          custom_value: true
          options:
            - label: In the icon
              value: icon
            - label: Large, above the name
              value: above
            - label: As the card's background
              value: background
            - label: In the icon and as the background
              value: icon background
            - label: Above the name and as the background
              value: above background
      default: icon
    - name: cover_mix
      label: "Cover mix (the cover's share in percent, behind the card)"
      selector:
        number:
          min: 0
          max: 100
          step: 5
          mode: slider
          unit_of_measurement: "%"
      default: 25
    - name: cover_blur
      label: "Cover blur (behind the card)"
      selector:
        boolean: {}
      default: false
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12.8)) throw new Error("origami_media needs origami_base 12.8 or later");
      const own = this.config.origami_media ?? {};
      // Origami 2 named a TV's players art_entity and app_entity, and those still work as the TV layout with these players
      const old = [own.art_entity, own.app_entity].filter(Boolean);
      const cfg = old.length && !own.layout && !own.players ? { ...own, layout: "tv", players: old } : own;
      const env = { hass, renderTemplate };
      const ent = hass.states[entity];
      const tv = cfg.layout === "tv";
      const m = org.media(hass, entity, { env, tv, cfg });
      // The cover option names one place or several, as a list or as words, also from a map from the state or a template, so a card can change its layout with the state without a helper. The background combines with the icon or with the square above the name.
      const places = String(org.value(env, cfg.cover, { entity, state: ent?.state ?? "unknown", attr: ent?.attributes ?? {} })).toLowerCase().split(/[^a-z]+/).filter(Boolean);
      // A TV is on while its entity says so. When the entity has no answer, any player of the same device that is on decides.
      const power = m.power;
      // A bottom sub-button with css_class play is the play key, and its row becomes the play row. Sub-buttons are found by number, because Bubble Card also turns a name such as Play into a class.
      const numbered = (cls) => org.items(this.config).map((item, i) => org.slug(item.css_class) === cls ? ".bubble-sub-button-" + (i + 1) : null).filter(Boolean);
      const play = numbered("play")[0] ?? null;
      // The speaker shows its music while it plays, and its name at other times. A card with a play key also shows paused music, because the key resumes it.
      const music = !tv && !m.input && !!m.title && ((m.active && m.playing) || (!!play && m.player?.state === "paused"));
      card._orgM = {
        m,
        music,
        on: tv ? power === true : m.active,
        playing: tv ? ["playing", "buffering"].includes(ent?.state) || m.playing : m.playing,
        powered: tv ? power === true : org.power(ent) === true,
        art: m.art && (!tv || power) ? m.art : null,
        collapse: !!cfg.collapse,
        // With background, the cover fills the card. Cover mix sets its share in a mix with the card's color, and Cover blur blurs it. The icon keeps the cover when the list also names icon or above, and without background it always does.
        back: places.includes("background"),
        above: places.includes("above"),
        boxed: !places.includes("background") || places.includes("icon") || places.includes("above"),
        mix: cfg.cover_mix ?? 25,
        blur: org.yes(cfg.cover_blur),
        // Origami 2 kept Filled play and power buttons under origami_base, and that place still works
        solid: !!(cfg.solid_controls ?? this.config.origami_base?.solid_controls),
        // Base hides the state line on compact rows and under the icon, and show_state: false hides it too
        state: this.config.show_state === false || card._org.opts.compact || card._org.opts.vertical ? "none" : "block"
      };
      const c = card._orgM;
      // A cover that goes fades out, so the card keeps the last cover until another one comes
      if (c.art) card._orgMArt = c.art;
      // With Filled play and power buttons, the play button is filled while media plays and the power button while the device is on
      c.filled = c.solid ? [c.playing ? ".bubble-play-pause-button" : "", c.powered ? ".bubble-power-button" : ""].filter(Boolean) : [];
      // With Keep name, the name line always shows the card's name, and the state line shows the title and the artist while music plays
      const keep = !!cfg.keep_name;
      const name = music && !keep ? m.title : org.name(hass, entity, this.config.name, env);
      const line = tv
        ? (power === null ? org.word(hass, ent ?? null, null, ent?.state ?? "unavailable")
          : !power ? org.word(hass, ent, null, "off")
          : m.title || (m.app ? org.word(hass, m.appEntity, "app_name", m.app) : "") || (m.source ? org.word(hass, m.show, "source") : "")
            || org.word(hass, m.player ?? ent, null, m.player?.state === "paused" ? "paused" : "on"))
        : m.input ? org.word(hass, m.show, "source")
        : music ? (keep ? [m.title, m.artist].filter(Boolean).join(" • ") : m.artist) || org.word(hass, m.player)
        : org.word(hass, m.show);
      // The State option replaces the state line while it has a value, such as a title from a template sensor
      const set = org.value(env, cfg.state, { entity, state: ent?.state ?? "unknown", attr: ent?.attributes ?? {} });
      const shown = org.has(set) ? String(set) : line;
      // A State value that repeats the name hides the state line, so a template can leave a single line such as Nothing playing
      if (org.has(set) && shown === name) c.state = "none";
      // Bubble Card hands the name and the state line to a module whose code contains these exact assignments, and it skips a write that repeats a line's text
      card.querySelector('.bubble-name').textContent = name;
      card.querySelector('.bubble-state').textContent = shown;
      org.remeasure(card.querySelector('.bubble-name'), this.config.scrolling_effect !== false);
      org.remeasure(card.querySelector('.bubble-state'), this.config.scrolling_effect !== false);
      if (!tv) org.icon(icon, m.icon(cfg.icons));
      // With Group badge, a crown marks the group leader and a link marks its members, as in Speaker Select. Without the option, Media leaves the mark to Speaker Select on a card that lists both.
      if (cfg.badge !== undefined) org.badge(cfg.badge ? m.role : null);
      // Icon colors is a map from the same kinds as Icons, so the icon can say what the speaker does without a cover
      c.ink = org.pick(cfg.icon_color, m.kind, true) ?? null;
      // A sub-button with css_class members shows how many speakers play in the group, the leader included
      const n = [].concat(m.show?.attributes?.group_members ?? []).length;
      org.readouts(hass, this.config, entity, () => n > 1 ? org.num(hass, n) : "", "members");
      c.members = numbered("members").map((sel) => "ha-card .bubble-sub-button" + sel);
      // A ring around the play key shows how far the track has played
      c.play = play;
      // A play key whose disabled key is set rests in the quiet fill with the disabled color, as any control that cannot work. Base reads the sub-buttons' own keys before Media runs.
      const pn = play ? Number(play.match(/\d+/)[0]) : 0;
      c.rest = !!play && org.yes((card._orgSubs ?? []).find((s) => s.n === pn)?.opt?.disabled);
      c.group = ".bubble-sub-button-group:has(> " + play + ")";
      c.row = "ha-card " + c.group;
      const key = play && card.querySelector(".bubble-sub-button" + play);
      if (key) {
        const ring = org.part(key, "org-ring", () => {
          const ns = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(ns, "svg");
          svg.setAttribute("viewBox", "0 0 64 64");
          ["org-ring-track", "org-ring-arc"].forEach((cls) => {
            const circle = document.createElementNS(ns, "circle");
            circle.setAttribute("cx", "32");
            circle.setAttribute("cy", "32");
            circle.setAttribute("r", "31");
            circle.setAttribute("class", cls);
            svg.appendChild(circle);
          });
          return svg;
        });
        // The ring follows a player in players that plays or pauses as the shown music does, or else the player whose music shows. Radio and inputs have no length, so the ring goes and its place stays.
        const moving = (p) => ["playing", "buffering"].includes(p?.state);
        // A player can lose track of the music, such as a Music Assistant player whose position stands still while the speaker plays on. Its position then stays the same across reports, runs past the end of the track, or it reports another title. The ring then follows the next player, and in the end the speaker itself.
        const seen = card._orgSeen ?? (card._orgSeen = new Map());
        const lost = (p) => {
          const a = p.attributes ?? {};
          const title = String(a.media_title ?? "").trim();
          if (m.title && title && title !== m.title) return true;
          const pos = Number(a.media_position), at = Date.parse(a.media_position_updated_at), length = Number(a.media_duration);
          if (!moving(p) || !Number.isFinite(pos) || !Number.isFinite(at)) return false;
          if (pos + (Date.now() - at) / 1000 > length + 10) return true;
          const was = seen.get(p.entity_id);
          if (!was || was.title !== title) seen.set(p.entity_id, { pos, at, title, still: false });
          else if (at - was.at >= 2000) seen.set(p.entity_id, { pos, at, title, still: pos - was.pos < (at - was.at) / 4000 });
          return seen.get(p.entity_id).still;
        };
        const timed = (p) => ["playing", "paused", "buffering"].includes(p?.state) && Number(p.attributes?.media_duration) > 0;
        const pool = m.input ? [] : [...m.twins.filter((p) => moving(p) === moving(m.player)), m.player, m.show].filter((p, i, all) => p && all.indexOf(p) === i);
        const src = pool.find((p) => timed(p) && !lost(p)) ?? pool.find(timed);
        const arc = ring.querySelector(".org-ring-arc");
        const sig = src ? [src.entity_id, src.state, src.attributes.media_position, src.attributes.media_position_updated_at, src.attributes.media_duration].join("|") : "";
        ring.style.display = src ? "" : "none";
        // The ring starts again only when the position changes, so other updates leave it where it is
        if (ring._orgSig !== sig) {
          ring._orgSig = sig;
          arc.getAnimations?.().forEach((a) => a.cancel());
          if (src) {
            const a = src.attributes;
            const length = Number(a.media_duration);
            const since = Date.parse(a.media_position_updated_at);
            const moving = ["playing", "buffering"].includes(src.state);
            const p0 = Math.min(1, Math.max(0, (Number(a.media_position ?? 0) + (moving && Number.isFinite(since) ? (Date.now() - since) / 1000 : 0)) / length));
            const full = 2 * Math.PI * 31;
            arc.style.strokeDasharray = String(full);
            arc.style.strokeDashoffset = String(full * (1 - p0));
            if (moving && p0 < 1 && arc.animate) arc.animate([{ strokeDashoffset: full * (1 - p0) }, { strokeDashoffset: 0 }], { duration: (1 - p0) * length * 1000, easing: "linear", fill: "forwards" });
          }
        }
      }
      return "";
    })()}
    ha-card {
      --org-color: ${card._orgM.m.color};
      ${card._orgM.state === "none" ? "--org-lines-h: 0px;" : card._org.opts.large ? "--org-lines-h: calc(var(--ha-font-size-xl) * var(--ha-line-height-normal) + var(--ha-space-1) + var(--ha-font-size-s) * var(--ha-line-height-normal));" : ""}
      --org-chip-bg: ${card._orgM.on && !card._orgM.ink ? "var(--org-field)" : "var(--org-inset)"};
      --org-chip-ink: ${card._orgM.ink ?? (card._orgM.on ? "var(--org-color)" : "var(--org-chip-rest, var(--primary-text-color))")};
    }
    ${card._orgM.members.length ? `${card._orgM.members.join(", ")} {
      gap: 0 !important;
      justify-content: center !important;
      width: auto !important;
      min-width: var(--tile-size) !important;
      padding: 0 var(--ha-space-3) !important;
    }
    ${card._orgM.members.map((s) => s + ":has(.bubble-sub-button-name-container:not(:empty))").join(", ")} {
      min-width: var(--control-height-lg) !important;
    }
    ${card._orgM.members.map((s) => s + " .bubble-sub-button-icon").join(", ")} {
      --mdc-icon-size: var(--icon-size-s) !important;
    }
    ${card._orgM.members.map((s) => s + " .bubble-sub-button-name-container").join(", ")} {
      margin-inline-start: var(--ha-space-1);
      font-size: var(--ha-font-size-m) !important;
      font-weight: var(--ha-font-weight-bold) !important;
    }
    ${card._orgM.members.map((s) => s + " .bubble-sub-button-name-container:empty").join(", ")} {
      display: none !important;
    }` : ""}
    ${card._orgM.play ? `
    ${card._orgM.row} {
      display: grid !important;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      align-items: center !important;
      justify-items: center !important;
      height: var(--control-height-lg) !important;
      gap: 0 !important;
    }
    ${card._orgM.row}:has(> :nth-child(5):last-child) {
      grid-template-columns: minmax(0, 57fr) minmax(0, 48fr) minmax(0, 106fr) minmax(0, 48fr) minmax(0, 57fr);
    }
    ha-card .bubble-sub-button-group:has(> ${card._orgM.play}:is(.hidden, [style*="display: none"])) {
      display: none !important;
    }
    ${card._orgM.row} > .bubble-sub-button {
      position: relative;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      padding: 0 !important;
      background: none !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    ${card._orgM.row} > .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--icon-size-s);
      margin: 0 !important;
      opacity: 1 !important;
    }
    ha-card :where(${card._orgM.group} > .bubble-sub-button) {
      color: var(--secondary-text-color) !important;
    }
    ha-card :where(${card._orgM.group}) > .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      color: inherit !important;
    }
    ${card._orgM.row} > .bubble-sub-button:first-child .bubble-sub-button-icon:not(.hidden) {
      translate: -1.1px 0;
    }
    ${card._orgM.row} > .bubble-sub-button:last-child .bubble-sub-button-icon:not(.hidden) {
      translate: 1px 0;
    }
    ha-card :where(${card._orgM.group} > .bubble-sub-button:has(+ ${card._orgM.play}), ${card._orgM.group} > ${card._orgM.play} + .bubble-sub-button) {
      color: var(--primary-text-color) !important;
    }
    ${card._orgM.row} > :is(.bubble-sub-button:has(+ ${card._orgM.play}), ${card._orgM.play} + .bubble-sub-button) .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: var(--control-height-icon);
    }
    ${card._orgM.row} > .bubble-sub-button${card._orgM.play} {
      display: grid !important;
      place-items: center;
      width: var(--control-height-lg) !important;
      height: var(--control-height-lg) !important;
      isolation: isolate;
    }
    ${card._orgM.row} > .bubble-sub-button${card._orgM.play} > :not(.org-ring) {
      grid-area: 1 / 1;
    }
    ${card._orgM.row} > .bubble-sub-button${card._orgM.play}::before {
      content: "";
      position: absolute;
      inset: calc((var(--control-height-lg) - var(--control-height-sm)) / 2);
      z-index: -1;
      border-radius: 50%;
      background-color: var(--fill-active);
    }
    ${card._orgM.row} > .bubble-sub-button${card._orgM.play} .bubble-sub-button-icon:not(.hidden) {
      --mdc-icon-size: 32px;
      color: var(--text-color-active) !important;
    }
    ${card._orgM.rest ? `${card._orgM.row} > .bubble-sub-button${card._orgM.play}::before {
      background-color: var(--fill-subtle);
    }
    ${card._orgM.row} > .bubble-sub-button${card._orgM.play} .bubble-sub-button-icon:not(.hidden) {
      color: var(--disabled-color) !important;
    }` : ""}
    ha-card .bubble-sub-button${card._orgM.play} .org-ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      rotate: -90deg;
      pointer-events: none;
    }
    ha-card .bubble-sub-button${card._orgM.play} .org-ring circle {
      fill: none;
      stroke-width: 2;
    }
    ha-card .bubble-sub-button${card._orgM.play} .org-ring-track {
      stroke: color-mix(in srgb, var(--primary-text-color) 12%, var(--ha-card-background));
    }
    ha-card .bubble-sub-button${card._orgM.play} .org-ring-arc {
      stroke: color-mix(in srgb, var(--primary-text-color) 64%, var(--ha-card-background));
      stroke-linecap: round;
    }` : ""}
    ${card._orgM.collapse && !card._orgM.on ? `
    .bubble-container,
    .bubble-media-player-container {
      height: var(--org-row-height) !important;
      min-height: 0 !important;
      max-height: var(--org-row-height) !important;
      overflow: hidden !important;
    }
    .bubble-sub-button-bottom-container,
    .with-bottom-buttons .bubble-sub-button-container:not(.fixed-top) {
      display: none !important;
    }
    ` : ""}
    ${card._org.cover(card._orgM.boxed ? card._orgM.art : null, "1", card.querySelector(".bubble-main-icon-container"))}
    ${card._orgM.above ? `
    /* Above the name, the icon's box becomes a square cover as wide as the card's content, so a tap on the cover does what a tap on the icon does. Without a cover, it shows the card's icon. The name, the main sub-buttons and the rows below stay in their places, and the card grows with the cover. */
    .card-content,
    ha-card .bubble-container {
      height: auto !important;
    }
    ha-card .bubble-wrapper {
      position: relative !important;
      height: auto !important;
      flex-wrap: wrap !important;
      align-items: flex-start !important;
      align-content: flex-start;
    }
    ha-card .bubble-content-container {
      display: contents !important;
    }
    ha-card .bubble-main-icon-container,
    ha-card .bubble-main-icon-container.hidden {
      display: flex !important;
      z-index: 1;
      flex: 0 0 calc(100% - 2 * var(--org-pad)) !important;
      width: auto !important;
      min-width: 0 !important;
      height: auto !important;
      min-height: 0 !important;
      aspect-ratio: 1;
      /* On a frameless card, the gap between its rows also stands between the cover and the name */
      margin: var(--org-pad) var(--org-pad) var(--org-gap, 0px) !important;
      /* The cover spans the card's width at the card's padding, so its corners run parallel to the card's corners, as a list's rows do */
      border-radius: max(0px, calc(var(--ha-card-border-radius) - var(--org-pad))) !important;
      container-type: inline-size;
    }
    ha-card .bubble-main-icon-container .bubble-icon {
      --mdc-icon-size: 30cqi;
    }
    ha-card .bubble-name-container {
      flex: 1 1 0% !important;
      align-self: stretch;
      justify-content: center;
      min-width: 0 !important;
      height: var(--org-row-height) !important;
      margin-inline-start: var(--org-pad) !important;
    }
    ha-card .bubble-sub-button-bottom-container {
      position: static !important;
      order: 1;
      flex: 0 0 auto;
    }` : ""}
    ${card._orgM.back ? `
    /* On a cover, a slider's track and the keys with a background take mostly the card's color, so their text stays readable. Without a cover, the card keeps its own background. */
    ha-card .bubble-background {
      overflow: hidden;
    }
    ${card._org.backdrop("ha-card .bubble-background::before", card._orgMArt, card._orgM.art ? card._orgM.mix : 0, card._orgM.blur, "0px", card.querySelector(".bubble-background"))}
    ${card._orgM.art ? `ha-card {
      --org-inset: color-mix(in srgb, var(--ha-card-background) 70%, transparent);
    }` : ""}
    ` : ""}
    .bubble-name-container {
      display: flex !important;
    }
    .bubble-media-info-container {
      display: none !important;
    }
    .bubble-name,
    .bubble-state {
      margin: 0 !important;
      line-height: var(--ha-line-height-normal);
      overflow: hidden !important;
    }
    .bubble-state {
      display: ${card._orgM.state} !important;
    }
    ${card._orgM.music ? ".bubble-name.hidden { display: block !important; }" : ""}
    .bubble-media-button {
      min-width: var(--tile-size) !important;
      width: var(--tile-size) !important;
      height: var(--tile-size) !important;
      border-radius: var(--radius-inner) !important;
      transition: var(--transition-interactive);
    }
    .bubble-media-button {
      background-color: transparent !important;
    }
    ${card._org.fill(card._orgM.filled)}
