origami_speaker:
  name: "Origami • Speaker Select"
  version: "5.3.0"
  supported:
    - media-player
    - button
  description: "Speaker Select turns media player cards into speaker rows for a music pop-up. Each row shows the speaker's name, what it plays and its cover. A crown and a link mark a group. On a button card with a slider, the whole row sets the volume."
  editor:
    - name: selected
      label: "Selected (an input_select, a select or a template)"
      selector:
        template: {}
    - name: players
      label: "Players (other media players for the same speaker)"
      selector:
        entity:
          domain: media_player
          multiple: true
    - name: leader
      label: "Leader (for groups without group_members)"
      selector:
        template: {}
    - name: art
      label: "Picture (the cover's address, if the player has none)"
      selector:
        template: {}
    - name: ignore_art
      label: "Ignore pictures (texts in the addresses of pictures to leave out)"
      selector:
        text:
          multiple: true
    - name: inputs
      label: "Inputs (more source names that count as inputs)"
      selector:
        text:
          multiple: true
    - name: icons
      label: "Icons (a map from a state or an input to an icon)"
      selector:
        object: {}
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_speaker needs origami_base 12 or later");
      // The row draws its own background, so Base leaves it as it is
      if (card.dataset.orgBg !== "own") card.dataset.orgBg = "own";
      const cfg = this.config.origami_speaker ?? {};
      const env = { hass, renderTemplate };
      const st = hass.states[entity];
      const ctx = { entity, state: st?.state ?? "unknown", attr: st?.attributes ?? {} };
      const m = org.media(hass, entity, { env, cfg });
      const name = org.name(hass, entity, this.config.name, env);
      // Selected is a helper whose state names the speaker, or a template that names it itself
      const pick = String(org.value(env, cfg.selected, ctx) ?? "").trim();
      const chosen = /^(input_)?select\./.test(pick) ? String(hass.states[pick]?.state ?? "") : pick;
      const member = m.role === "member";
      const line = [m.title, m.artist].filter(Boolean).join(" • ");
      card._orgSp = {
        m,
        grouped: m.role !== null,
        dead: org.power(st) === null,
        chosen: chosen !== "" && (chosen === entity || chosen.toLowerCase() === name.toLowerCase()),
        audible: org.power(st) !== null && (m.playing || ["playing", "buffering"].includes(st?.state)),
        // The row shows the track after the name while the speaker plays, pauses or buffers music of its own
        track: !!line && !member && !m.input && m.live,
        art: m.art
      };
      const s = card._orgSp;
      const rtl = !!hass.translationMetadata?.translations?.[hass.language]?.isRTL;
      // Bubble Card hands the state line to a module whose code contains this exact assignment, and it skips a write that repeats the line's text
      const next = s.dead ? org.word(hass, st)
        : member ? (rtl ? "← " : "→ ") + ((n) => org.rename(n) ?? n)(org.name(hass, m.leader))
        : m.input ? org.word(hass, m.show, "source")
        : s.track ? line
        : org.word(hass, m.show);
      card.querySelector('.bubble-state').textContent = next;
      org.remeasure(card.querySelector('.bubble-state'), this.config.scrolling_effect !== false);
      org.icon(icon, m.icon(cfg.icons));
      // Each readout shows its own speaker's volume
      org.readouts(hass, this.config, entity, (t) => org.power(t) === null || t?.attributes?.volume_level == null ? "–" : org.word(hass, t, "volume_level"));
      org.badge(m.role);
      // A readout without an action of its own passes the tap to the row, so the row's tap selects the speaker there too
      s.through = org.items(this.config).map((item, i) => org.slug(item.css_class) === "readout" && !item.tap_action && !item.hold_action && !item.double_tap_action ? "ha-card .bubble-sub-button-" + (i + 1) : null).filter(Boolean);
      return "";
    })()}
    ha-card {
      --org-row-height: calc(var(--control-height-list) + 2px);
      --org-icon-size: var(--icon-size-xs);
      --org-tile-size: calc(var(--org-icon-size) + 2 * var(--ha-space-1));
      --org-tile-inset: calc((var(--org-row-height) - var(--org-tile-size)) / 2);
      --org-tile-radius: max(var(--radius-small), calc(var(--ha-card-border-radius, var(--bubble-border-radius, 24px)) - var(--org-tile-inset)));
      --org-color: ${card._orgSp.m.color};
      --org-chip-bg: ${card._orgSp.audible ? "var(--org-field)" : "var(--fill-subtle)"};
      --org-chip-ink: ${card._orgSp.audible ? "var(--org-color)" : "var(--primary-text-color)"};
    }
    ha-card .bubble-container {
      height: 100% !important;
    }
    .bubble-background {
      background-color: var(--fill-subtle) !important;
      background-image: ${card._orgSp.chosen && card._orgSp.grouped ? "linear-gradient(var(--fill-loud), var(--fill-loud)), linear-gradient(var(--fill-strong), var(--fill-strong))" : card._orgSp.chosen ? "linear-gradient(var(--fill-loud), var(--fill-loud))" : card._orgSp.grouped ? "linear-gradient(var(--fill-strong), var(--fill-strong))" : "none"};
      overflow: hidden;
    }
    .bubble-background::before {
      content: ${card._orgSp.art ? '""' : "none"};
      position: absolute;
      inset: 0;
      background: ${card._orgSp.art ? "url(" + card._org.str(card._orgSp.art) + ") center / cover no-repeat" : "none"};
      filter: blur(40px);
      opacity: 0.2;
      pointer-events: none;
    }
    ${card._org.cover(card._orgSp.art, card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.audible || card._orgSp.chosen ? "1" : "var(--opacity-quiet)")}
    ha-card .bubble-sub-button-container {
      margin-inline-end: var(--ha-space-4) !important;
    }
    ha-card .bubble-content-container {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: var(--ha-space-2);
      flex: 1 1 auto;
      min-width: 0;
      overflow: visible;
      margin-inline-end: var(--ha-space-2);
    }
    ha-card .bubble-name-container {
      display: flex !important;
      flex: 1 1 auto !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      align-items: center !important;
      gap: var(--ha-space-2) !important;
      min-width: 0;
      overflow: hidden;
      margin: 0px !important;
    }
    ha-card .bubble-media-info-container {
      display: none !important;
    }
    .bubble-name {
      flex-shrink: 0;
      line-height: var(--ha-line-height-normal);
      opacity: ${card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.chosen ? "1" : "var(--opacity-strong)"} !important;
    }
    ha-card .bubble-state {
      display: block !important;
      flex: 1 1 0% !important;
      min-width: 0;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis;
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-medium) !important;
      line-height: var(--ha-line-height-normal) !important;
      color: var(--secondary-text-color) !important;
      opacity: 1 !important;
    }
    ha-card .bubble-name[data-animated="true"],
    ha-card .bubble-state[data-animated="true"] {
      text-overflow: clip;
    }
    ${this.config.button_type === "slider" ? `
    ha-card .bubble-range-fill::after {
      display: none;
    }` : ""}
    ${card._orgSp.through.length ? card._orgSp.through.join(", ") + ` {
      pointer-events: none !important;
    }` : ""}
    /* A row shows no media buttons, so the card needs no hide option for them */
    ha-card .bubble-buttons-container {
      display: none !important;
    }
    ha-card .bubble-sub-button.readout {
      padding: 0px !important;
      justify-content: flex-end !important;
    }
    ha-card .bubble-sub-button.readout .bubble-sub-button-name-container {
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      color: var(--secondary-text-color);
    }
