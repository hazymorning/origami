origami_speaker:
  name: "Origami • Speaker Select"
  version: "5.0.0"
  supported:
    - media-player
  description: "The Speaker Select module creates the speaker rows for a music pop-up and works with Base. The Media module is not needed. The speaker's name is always visible, followed by what it plays. Album art fills the icon and appears blurred behind the row. A crown marks the group leader, and a link marks its members, whose rows point to the leader. Groups come from Home Assistant's group_members. For integrations without it, Leader gives the group leader's entity ID, and its template returns nothing while the speaker is not in a group. Selected takes an input_select, a select or a template, and the row whose entity ID or name matches the helper's state or the template's result gets a stronger fill. Players lists other media players for the same speaker, such as a Music Assistant player, and the first one that plays gives the title, the artist and the picture. Picture gives the cover's address for integrations without one, and pictures whose address contains an entry of Ignore pictures never show. Inputs adds source names that count as inputs, and Icons replaces the icon for a state or an input. If the volume sub-button has css_class set to readout, the module writes the volume into it. In a sections view, set rows to 1. The example in bubble_card/README.md shows the other card options."
  editor:
    - name: selected
      label: "Selected (an input_select, a select or a template)"
      selector:
        template: {}
    - name: players
      label: "Players (other media players for the same speaker)"
      selector:
        entity:
          domain: media_player
          multiple: true
    - name: leader
      label: "Leader (for groups without group_members)"
      selector:
        template: {}
    - name: art
      label: "Picture (the cover's address, if the player has none)"
      selector:
        template: {}
    - name: ignore_art
      label: "Ignore pictures (texts in the addresses of pictures to leave out)"
      selector:
        text:
          multiple: true
    - name: inputs
      label: "Inputs (more source names that count as inputs)"
      selector:
        text:
          multiple: true
    - name: icons
      label: "Icons (a map from a state or an input to an icon)"
      selector:
        object: {}
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 11)) throw new Error("origami_speaker needs origami_base 11 or later, listed before it");
      // The row draws its own background, so Base leaves it as it is
      if (card.dataset.orgBg !== "own") card.dataset.orgBg = "own";
      const cfg = this.config.origami_speaker ?? {};
      const env = { hass, renderTemplate };
      const st = hass.states[entity];
      const ctx = { entity, state: st?.state ?? "unknown", attr: st?.attributes ?? {} };
      const m = org.media(hass, entity, { env, players: cfg.players, leader: org.value(env, cfg.leader, ctx), art: cfg.art, inputs: cfg.inputs, ignore: cfg.ignore_art });
      const name = org.name(hass, entity, this.config.name);
      // Selected is a helper whose state names the speaker, or a template that names it itself
      const pick = String(org.value(env, cfg.selected, ctx) ?? "").trim();
      const chosen = /^(input_)?select\./.test(pick) ? String(hass.states[pick]?.state ?? "") : pick;
      const member = m.role === "member";
      const line = [m.title, m.artist].filter(Boolean).join(" • ");
      card._orgSp = {
        m,
        member,
        grouped: m.role !== null,
        dead: !st || ["unavailable", "unknown"].includes(st.state),
        chosen: chosen !== "" && (chosen === entity || chosen.toLowerCase() === name.toLowerCase()),
        audible: ["playing", "buffering"].includes(st?.state) || (member && m.playing),
        // The row shows the track after the name when the speaker plays one of its own
        track: !!line && !member && !m.input && st?.state !== "idle",
        line,
        art: m.art ? 'url(' + org.str(m.art) + ')' : "none"
      };
      const s = card._orgSp;
      const rtl = !!hass.translationMetadata?.translations?.[hass.language]?.isRTL;
      // Bubble Card hands the state line to a module whose code contains this exact assignment
      const next = s.dead ? org.word(hass, st)
        : member ? (rtl ? "← " : "→ ") + (org.rename(org.name(hass, m.leader)) ?? org.name(hass, m.leader))
        : m.input ? org.word(hass, m.show, "source")
        : m.playing ? (line || org.word(hass, m.show))
        : org.word(hass, m.show);
      if (card.querySelector('.bubble-state') && card.querySelector('.bubble-state').innerText !== next) card.querySelector('.bubble-state').innerText = next;
      org.title(card.querySelector(".bubble-title"), s.track ? line : "", this.config.scrolling_effect !== false);
      org.icon(icon, m.icon(cfg.icons));
      org.write(card.querySelector(".readout .bubble-sub-button-state") ?? card.querySelector(".readout .bubble-sub-button-name-container"),
        s.dead || st?.attributes?.volume_level == null ? "–" : org.word(hass, st, "volume_level"));
      // A crown marks the group leader, and a link marks its members
      const host = card.querySelector(".bubble-main-icon-container") ?? card.querySelector(".bubble-icon-container");
      if (host) {
        let b = host.querySelector(".org-group-badge");
        if (!b) {
          b = document.createElement("div");
          b.className = "org-group-badge";
          b.appendChild(document.createElement("ha-icon"));
          host.appendChild(b);
        }
        const shown = s.grouped ? "flex" : "none";
        if (b.style.display !== shown) b.style.display = shown;
        org.icon(b.querySelector("ha-icon"), member ? "mdi:link-variant" : "mdi:crown");
      }
      return "";
    })()}
    ha-card {
      --org-row-height: calc(var(--control-height-list) + 2px);
      --org-icon-size: var(--icon-size-xs);
      --org-tile-size: calc(var(--org-icon-size) + 2 * var(--ha-space-1));
      --org-chip-inset: calc((var(--org-row-height) - var(--org-tile-size)) / 2);
      --org-name-size: var(--ha-font-size-m);
      --org-color: var(--state-media_player-active-color);
      --org-chip-bg: ${card._orgSp.audible ? "var(--org-field)" : "var(--fill-subtle)"};
      --org-chip-ink: ${card._orgSp.audible ? "var(--org-color)" : "var(--primary-text-color)"};
      --org-text-max: 100%;
    }
    ha-card .bubble-container {
      height: 100% !important;
    }
    .bubble-background {
      background-color: var(--fill-subtle) !important;
      background-image: ${card._orgSp.chosen && card._orgSp.grouped ? "linear-gradient(var(--fill-loud), var(--fill-loud)), linear-gradient(var(--fill-strong), var(--fill-strong))" : card._orgSp.chosen ? "linear-gradient(var(--fill-loud), var(--fill-loud))" : card._orgSp.grouped ? "linear-gradient(var(--fill-strong), var(--fill-strong))" : "none"};
      overflow: hidden;
    }
    .bubble-background::before {
      content: ${card._orgSp.art !== "none" ? '""' : "none"};
      position: absolute;
      inset: 0;
      background-image: ${card._orgSp.art};
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(40px);
      opacity: 0.2;
      pointer-events: none;
    }
    ha-card .bubble-icon-container {
      min-height: 0px !important;
      margin-block: 0px !important;
      margin-inline: var(--org-chip-inset) var(--ha-space-1) !important;
      border-radius: max(var(--radius-small), calc(var(--ha-card-border-radius, var(--bubble-border-radius, 24px)) - var(--org-chip-inset))) !important;
      position: relative;
      overflow: visible !important;
    }
    ha-card .bubble-main-icon-container::before {
      content: ${card._orgSp.art !== "none" ? '""' : "none"};
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      background-image: ${card._orgSp.art};
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .bubble-media-player .bubble-entity-picture,
    .bubble-main-icon-container .bubble-entity-picture {
      display: none !important;
    }
    ha-card .bubble-icon-container .bubble-icon {
      color: var(--org-chip-ink) !important;
      transition: opacity var(--duration-normal) ease, color var(--duration-normal) ease;
      opacity: ${card._orgSp.art !== "none" ? "0" : card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.audible || card._orgSp.chosen ? "1" : "var(--opacity-quiet)"} !important;
    }
    .org-group-badge {
      position: absolute;
      top: -3px;
      inset-inline-end: -3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--org-color);
      background-color: var(--tint);
      box-shadow: 0 0 0 2px var(--ha-card-background);
      pointer-events: none;
      z-index: 3;
      --mdc-icon-size: 10px;
    }
    .org-group-badge ha-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    ha-card .bubble-content-container {
      display: flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: var(--ha-space-2);
      flex: 1 1 auto;
      min-width: 0;
      overflow: visible;
      margin-inline-end: var(--ha-space-2);
    }
    ha-card .bubble-name-container {
      display: flex !important;
      flex: ${card._orgSp.track ? "0 0 auto" : "0 1 auto"} !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      align-items: baseline !important;
      gap: var(--ha-space-2) !important;
      min-width: 0;
      overflow: hidden;
      margin: 0px !important;
    }
    ha-card .bubble-media-info-container {
      ${card._orgSp.track ? "display: flex !important;" : ""}
      flex: 1 1 0% !important;
      min-width: 0;
      margin: 0px !important;
    }
    .bubble-name {
      flex-shrink: 0;
      line-height: var(--ha-line-height-normal);
      opacity: ${card._orgSp.dead ? "var(--opacity-disabled)" : card._orgSp.chosen ? "1" : "var(--opacity-strong)"} !important;
    }
    ha-card .bubble-state,
    ha-card .bubble-title {
      min-width: 0;
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-medium) !important;
      line-height: var(--ha-line-height-normal) !important;
      color: var(--secondary-text-color) !important;
      opacity: 1 !important;
    }
    ha-card .bubble-state {
      display: ${card._orgSp.track ? "none" : "flex"} !important;
    }
    ha-card .bubble-artist {
      display: none !important;
    }
    ha-card .bubble-name[data-animated="true"],
    ha-card .bubble-title[data-animated="true"] {
      text-overflow: clip;
    }
    ha-card .bubble-sub-button.readout {
      padding: 0px !important;
      justify-content: flex-end !important;
    }
    ha-card .bubble-sub-button.readout .bubble-sub-button-name-container {
      font-size: var(--ha-font-size-s) !important;
      font-weight: var(--ha-font-weight-bold) !important;
      color: var(--secondary-text-color);
    }
