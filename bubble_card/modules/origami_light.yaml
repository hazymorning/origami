origami_light:
  name: "Origami • Light"
  version: "6.0.1"
  supported:
    - button
  description: "Light colors the slider of a light card in the state color for lights. In dark mode, the fill stays gray and only its mark takes the color, so the text on the slider stays readable."
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_light needs origami_base 12 or later, listed before it");
      // A light that is off still drags its slider in the light color, not in the gray of an off entity
      return "";
    })()}
    ha-card {
      --org-light: ${card._org.me.on ? "var(--org-color)" : "var(--state-light-active-color, var(--state-active-color))"};
      --org-slider-fill: ${card._org.opts.dark ? "color-mix(in srgb, var(--org-light) var(--tint-strength), var(--org-slider-base))" : "color-mix(in srgb, var(--org-light) var(--fill-strength), var(--ha-card-background))"};
      --org-slider-mark: var(--org-light);
    }
    .bubble-range-value {
      font-size: var(--ha-font-size-s);
      font-weight: var(--ha-font-weight-bold);
    }
