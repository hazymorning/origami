origami_button:
  name: "Origami • Button"
  version: "3.1.0"
  supported:
    - sub-buttons
  description: "The Button module creates rows and grids of buttons on a sub-buttons card. Put every button in the bottom list under sub_button, and turn on show_name for each button that should show its name. With Background on, the buttons are filled. With Background off, they are plain text. Setting Columns to 0 sizes the buttons to their text, and 1 to 6 creates an even grid. Active takes plain text, a map from the card entity's state or a template, and it highlights every button whose name, css_class or tap target matches it, in any language. Separate several values with commas. A button whose tap sets what its entity shows now, such as a source, an option, a preset or a speed, is also highlighted, and so is a button whose own entity is on and has a state color, unless its Background is off. With Segmented on, the buttons in each Bubble Card group form one bar, with a thin line between them. The groups share one row, so all buttons have the same width, and the active button shows a filled pill. Segmented buttons are as tall as other controls and have bold labels in the Segment label size, and they ignore Background, Alignment, Columns, Active style and Scroll sideways. The Lamp style tints active buttons in the Lamp color, and a button whose own entity is on takes that entity's state color. With Scroll sideways on, the buttons stay in one row that scrolls sideways, and Columns has no effect. List Base first, as on every Origami card. Base's Fade in option lets the buttons fade in when they appear."
  editor:
    - name: background
      label: "Background"
      selector:
        boolean: {}
      default: true
    - name: align
      label: "Alignment"
      selector:
        select:
          mode: dropdown
          options:
            - label: Start
              value: start
            - label: Center
              value: center
            - label: End
              value: end
      default: start
    - name: columns
      label: "Columns (0 = sized to text)"
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
      default: 0
    - name: muted
      label: "Muted"
      selector:
        boolean: {}
      default: false
    - name: icon_size
      label: "Icon size"
      selector:
        text: {}
      default: "var(--icon-size-2xs)"
    - name: padding
      label: "Outer padding"
      selector:
        text: {}
      default: "0"
    - name: active
      label: "Active button (template or text)"
      selector:
        template: {}
    - name: color
      label: "Lamp color (a color, a map from the card entity's state or a template)"
      selector:
        template: {}
    - name: active_style
      label: "Active style"
      selector:
        select:
          mode: dropdown
          options:
            - label: Lamp
              value: lamp
            - label: Toggle
              value: toggle
      default: lamp
    - name: segmented
      label: "Segmented"
      selector:
        boolean: {}
      default: false
    - name: label_size
      label: "Segment label size"
      selector:
        select:
          mode: dropdown
          options:
            - label: Large
              value: large
            - label: Normal
              value: normal
      default: large
    - name: scroll
      label: "Scroll sideways"
      selector:
        boolean: {}
      default: false
    - name: press
      label: "Press feedback"
      selector:
        boolean: {}
      default: true
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 11)) throw new Error("origami_button needs origami_base 11 or later, listed before it");
      const cfg = this.config.origami_button ?? {};
      const lang = hass.locale?.language ?? hass.language ?? "en";
      // A name matches an active value in any script. Bubble Card's class names for the same text count too, so a css_class still matches.
      const norm = (v) => String(v ?? "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      const low = (v) => String(v ?? "").trim().toLocaleLowerCase(lang);
      const env = { hass, renderTemplate };
      const st = hass.states[entity];
      const ctx = { entity, state: st?.state ?? "unknown", attr: st?.attributes ?? {} };
      const raw = String(org.value(env, cfg.active, ctx) ?? "").trim();
      let list = [];
      if (raw.startsWith("[")) {
        try { list = JSON.parse(raw); } catch (e) { list = [raw]; }
      } else if (raw) {
        list = raw.split(",");
      }
      const want = (Array.isArray(list) ? list : [list]).map(low).filter(Boolean);
      const slugs = want.map(norm).filter(Boolean);
      // A button is active when its name, its css_class or an entity its tap targets matches, when its tap sets what its entity shows now, or while its own entity is on
      const lamps = [];
      const active = org.items(this.config).map((item, i) => {
        const names = [item.name, item.css_class].filter((v) => typeof v === "string" && !/\{(\{|%)|\$\{/.test(v));
        const tap = org.act(item);
        const targets = [].concat(tap.target?.entity_id ?? tap.data?.entity_id ?? tap.service_data?.entity_id ?? []).map(low);
        const named = names.some((v) => want.includes(low(v)) || (norm(v) && slugs.includes(norm(v)))) || targets.some((v) => want.includes(v));
        // A tap that sets a value lights the button while its entity has that value. Otherwise, a button with an entity of its own follows Base's rule for that entity.
        const id = item.entity ?? entity;
        const set = org.matches(hass, item, id);
        const plain = String(item.css_class ?? "").toLowerCase().split(/\s+/).includes("plain");
        const lit = set === null && !!item.entity && item.show_background !== false && org.filled(hass, item, id);
        // A button whose own entity is on takes that entity's state color as its lamp
        if (item.entity && org.look(hass, item.entity).lit) lamps.push([i + 1, org.look(hass, item.entity).color]);
        return named || (set === true && !plain) || lit ? i + 1 : 0;
      }).filter(Boolean);
      const lamp = String(org.value(env, cfg.color, ctx) ?? "").trim();
      const base = "ha-card .bubble-sub-button-bottom-container .bubble-sub-button";
      const sel = active.map((n) => base + ".bubble-sub-button-" + n);
      const seg = !!cfg.segmented;
      const scroll = !!cfg.scroll && !seg;
      // Segments fill one row and center their content, and a scrolling row is a single line, so both ignore Columns
      const align = seg ? "center" : ["start", "center", "end"].includes(cfg.align) ? cfg.align : "start";
      const cols = seg || scroll ? 0 : Math.max(0, Math.min(6, parseInt(cfg.columns ?? 0, 10) || 0));
      const pad = String(cfg.padding ?? "").trim();
      const size = String(cfg.icon_size ?? "").trim();
      card._orgB = {
        bg: cfg.background ?? true,
        muted: !!cfg.muted,
        // The active segment is filled like the Toggle style
        toggle: seg || cfg.active_style === "toggle",
        seg,
        scroll,
        press: cfg.press ?? true,
        large: cfg.label_size !== "normal",
        // The Lamp style tints active buttons in the lamp color, or in the state color of a button's own entity
        lamp: lamp || "var(--lamp-color)",
        lamps: lamps.filter(([n]) => active.includes(n)).map(([n, c]) => base + ".bubble-sub-button-" + n + " { --org-btn-lamp: " + c + "; }").join("\n    "),
        cols,
        pad: pad || "0",
        size: size || "var(--icon-size-2xs)",
        row: (scroll && align !== "start" ? "safe " : "") + { start: "flex-start", center: "center", end: "flex-end" }[align],
        rev: { start: "flex-end", center: "center", end: "flex-start" }[align],
        // on() adds each suffix it receives to every active button's selector and joins the results into one list
        on: (...ends) => sel.length ? sel.flatMap((s) => ends.map((e) => s + e)).join(",\n    ") : ".org-none"
      };
      return "";
    })()}
    ha-card {
      --org-btn-height: ${card._orgB.seg ? "var(--control-height)" : card._orgB.bg ? "var(--control-height-icon)" : "auto"};
      --org-btn-padding: ${card._orgB.seg ? "0 var(--ha-space-2)" : card._orgB.bg ? "0 var(--ha-space-4)" : "var(--ha-space-2) var(--ha-space-4)"};
      --org-btn-bg: ${card._orgB.bg || card._orgB.seg ? "var(--fill-subtle)" : "transparent"};
      --org-btn-opacity: ${card._orgB.muted ? "var(--opacity-muted)" : "1"};
      --org-btn-icon-size: ${card._orgB.size};
      --org-btn-lamp: ${card._orgB.lamp};
    }
    ${card._orgB.lamps}
    ha-card .bubble-container {
      display: block !important;
      height: auto !important;
      min-height: 0 !important;
      padding: ${card._orgB.pad} !important;
      box-sizing: border-box !important;
      background: none !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: visible !important;
    }
    ha-card .bubble-container > .bubble-sub-button-container {
      display: none !important;
    }
    ha-card .bubble-sub-button-bottom-container {
      position: static !important;
      inset: auto !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      gap: ${card._orgB.seg ? "0" : "var(--ha-space-2)"} !important;
      pointer-events: auto !important;
      ${card._orgB.cols ? `display: grid !important;
      grid-template-columns: repeat(${card._orgB.cols}, minmax(0, 1fr)) !important;` : `display: flex !important;
      flex-wrap: ${card._orgB.seg || card._orgB.scroll ? "nowrap" : "wrap"} !important;
      justify-content: ${card._orgB.row} !important;`}
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-alignment-lane,
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(.hidden) {
      display: contents !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      box-sizing: border-box !important;
      ${card._orgB.cols ? "" : `flex: ${card._orgB.seg ? "1 1 0" : "0 0 auto"} !important;`}
      width: auto !important;
      min-width: 0 !important;
      height: var(--org-btn-height) !important;
      padding: var(--org-btn-padding) !important;
      justify-content: ${card._orgB.rev} !important;
      align-items: center !important;
      gap: 0 !important;
      border-radius: ${card._orgB.seg ? "0" : "var(--radius-inner)"} !important;
      background: var(--org-btn-bg) !important;
      box-shadow: none !important;
      color: ${card._orgB.seg ? "var(--primary-text-color)" : "var(--secondary-text-color)"} !important;
      font-size: var(--ha-font-size-m) !important;
      white-space: nowrap !important;
      transition: var(--transition-interactive) !important;
      ${card._orgB.seg ? "isolation: isolate;" : ""}
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right {
      justify-content: ${card._orgB.row} !important;
    }
    ${!card._orgB.press ? "" : card._orgB.seg ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      --org-btn-bg: var(--fill-strong);
    }` : `ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      transform: scale(var(--press-scale));
    }`}
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-name-container {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap !important;
      font-size: ${card._orgB.seg ? (card._orgB.large ? "var(--ha-font-size-l)" : "var(--ha-font-size-m)") : "var(--ha-font-size-s)"} !important;
      font-weight: ${card._orgB.seg ? "var(--ha-font-weight-bold)" : "var(--ha-font-weight-medium)"} !important;
      ${card._orgB.seg ? "font-variant-numeric: tabular-nums;" : ""}
      color: inherit !important;
      opacity: var(--org-btn-opacity) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      display: block !important;
      flex-shrink: 0;
      --mdc-icon-size: var(--org-btn-icon-size) !important;
      margin-block: 0 !important;
      margin-inline: 0 var(--ha-space-2) !important;
      color: inherit !important;
      opacity: ${card._orgB.seg ? "calc(var(--org-btn-opacity) * var(--opacity-strong))" : "var(--org-btn-opacity)"} !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
      margin-block: 0 !important;
      margin-inline: var(--ha-space-2) 0 !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon.icon-without-state:not(.hidden) {
      margin: 0 !important;
    }
    ${card._orgB.seg ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(:first-child, :nth-child(1 of .bubble-sub-button:not(.hidden))) {
      border-start-start-radius: var(--radius-inner) !important;
      border-end-start-radius: var(--radius-inner) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(:last-child, :nth-last-child(1 of .bubble-sub-button:not(.hidden))) {
      border-start-end-radius: var(--radius-inner) !important;
      border-end-end-radius: var(--radius-inner) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(:is(:last-child, :nth-last-child(1 of .bubble-sub-button-group:not(.hidden)))) > .bubble-sub-button:is(:last-child, :nth-last-child(1 of .bubble-sub-button:not(.hidden))) {
      margin-inline-end: var(--ha-space-3);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:not(.hidden) ~ .bubble-sub-button::after {
      content: "";
      position: absolute;
      inset-block: 25%;
      inset-inline-start: 0;
      width: 2px;
      background-color: var(--fill-loud);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button::before {
      --org-btn-inset: calc((var(--control-height) - var(--control-height-row)) / 2);
      content: "";
      position: absolute;
      inset: var(--org-btn-inset);
      z-index: -1;
      border-radius: calc(var(--radius-inner) - var(--org-btn-inset));
      background-color: var(--fill-active);
      opacity: 0;
      transition: opacity var(--duration-normal) ease;
    }
    ${card._orgB.on("::before")} {
      opacity: 1;
    }
    ${card._orgB.on("::after", " + .bubble-sub-button::after")} {
      display: none;
    }` : ""}
    ${card._orgB.scroll ? `ha-card .bubble-sub-button-bottom-container {
      width: auto !important;
      margin: calc(-1 * var(--scroller-bleed)) !important;
      padding: var(--scroller-padding) !important;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      mask-image: var(--scroller-mask);
    }
    ha-card:dir(rtl) .bubble-sub-button-bottom-container {
      mask-image: linear-gradient(to left, transparent 0px, black var(--scroller-bleed), black calc(100% - var(--ha-space-12, 48px)), transparent 100%);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      scroll-snap-align: start;
      scroll-margin-inline-start: var(--scroller-bleed);
    }` : ""}
    ${card._orgB.on("")} {
      ${card._orgB.seg ? "" : card._orgB.toggle ? "background: var(--toggle-on) !important;" : card._orgB.bg ? "background: color-mix(in srgb, var(--org-btn-lamp) var(--tint-strength), var(--ha-card-background)) !important;" : ""}
      color: ${card._orgB.toggle ? "var(--ha-card-background)" : "var(--primary-text-color)"} !important;
    }
    ${card._orgB.on(" .bubble-sub-button-icon:not(.hidden)")} {
      color: ${card._orgB.toggle ? "var(--ha-card-background)" : "var(--org-btn-lamp)"} !important;
      opacity: 1 !important;
    }
    ${card._orgB.on(" .bubble-sub-button-name-container")} {
      opacity: 1 !important;
      ${card._orgB.toggle ? "" : "font-weight: var(--ha-font-weight-bold) !important;"}
    }
