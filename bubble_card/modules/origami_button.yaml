origami_button:
  name: "Origami • Button"
  version: "3.7.1"
  supported:
    - sub-buttons
    - button
  description: "Button turns the bottom sub-buttons of a sub-buttons or button card into rows, grids, chips, segmented bars, labeled tiles or a scrolling row. A button lights up while its entity has the value its tap sets, while its own entity is on, or when it matches the active option."
  editor:
    - name: background
      label: "Background"
      selector:
        boolean: {}
      default: true
    - name: align
      label: "Alignment"
      selector:
        select:
          mode: dropdown
          options:
            - label: Start
              value: start
            - label: Center
              value: center
            - label: End
              value: end
      default: start
    - name: columns
      label: "Columns (0 = sized to text)"
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
      default: 0
    - name: muted
      label: "Dimmed text and icons"
      selector:
        boolean: {}
      default: false
    - name: icon_size
      label: "Icon size"
      selector:
        text: {}
      default: "var(--icon-size-2xs)"
    - name: padding
      label: "Outer padding"
      selector:
        text: {}
      default: "0"
    - name: active
      label: "Active button (template or text)"
      selector:
        template: {}
    - name: color
      label: "Lamp color (a color, a map from the card entity's state or a template)"
      selector:
        template: {}
    - name: active_style
      label: "Active style"
      selector:
        select:
          mode: dropdown
          options:
            - label: Lamp
              value: lamp
            - label: Toggle
              value: toggle
      default: lamp
    - name: segmented
      label: "Segmented (true for all groups, or the names of groups that become small switches)"
      selector:
        text: {}
    - name: chips
      label: "Chips"
      selector:
        boolean: {}
      default: false
    - name: labels
      label: "Labels"
      selector:
        select:
          mode: dropdown
          options:
            - label: Inside
              value: inside
            - label: Below
              value: below
      default: inside
    - name: outline
      label: "Outlined button (template or text)"
      selector:
        template: {}
    - name: start
      label: "Button that starts the row (template or text)"
      selector:
        template: {}
    - name: pending
      label: "Show a tapped button's next look until its state changes"
      selector:
        boolean: {}
      default: false
    - name: label_size
      label: "Segment label size"
      selector:
        select:
          mode: dropdown
          options:
            - label: Large
              value: large
            - label: Normal
              value: normal
      default: large
    - name: scroll
      label: "Scroll sideways"
      selector:
        boolean: {}
      default: false
    - name: press
      label: "Press feedback"
      selector:
        boolean: {}
      default: true
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12.5)) throw new Error("origami_button needs origami_base 12.5 or later");
      const cfg = this.config.origami_button ?? {};
      const lang = hass.locale?.language ?? hass.language ?? "en";
      // A name matches an active value in any script. Bubble Card's class names for the same text count too, so a css_class still matches.
      const low = (v) => String(v ?? "").trim().toLocaleLowerCase(lang);
      const env = { hass, renderTemplate };
      const st = hass.states[entity];
      const ctx = { entity, state: st?.state ?? "unknown", attr: st?.attributes ?? {} };
      // pick() reads active, outline or start as a list of names, css classes or entity IDs, and hit() tells whether a button matches such a list
      const pick = (v) => {
        const raw = String(org.value(env, v, ctx) ?? "").trim();
        let list = [];
        if (raw.startsWith("[")) {
          try { list = JSON.parse(raw); } catch (e) { list = [raw]; }
        } else if (raw) {
          list = raw.split(",");
        }
        const want = (Array.isArray(list) ? list : [list]).map(low).filter(Boolean);
        return { want, slugs: want.map(org.slug).filter(Boolean) };
      };
      const hit = (item, m) => {
        if (!m.want.length) return false;
        const names = [item.name, item.css_class].filter((v) => ["string", "number"].includes(typeof v) && !/\{(\{|%)|\$\{/.test(String(v))).map(String);
        return names.some((v) => m.want.includes(low(v)) || m.slugs.includes(org.slug(v))) || org.targets(item).map(low).some((v) => m.want.includes(v));
      };
      const want = pick(cfg.active);
      // segmented is true for one bar of all groups. A list of group names makes only those groups small segmented switches, which can sit in any row.
      const segRaw = cfg.segmented;
      const seg = segRaw === true || (!Array.isArray(segRaw) && org.yes(segRaw));
      const segNames = seg ? [] : [].concat(segRaw ?? []).flatMap((v) => String(v).split(",")).map(low).filter((v) => v && v !== "false");
      // Bubble Card numbers the sub-buttons of the groups first, in their order. On a button card, the main sub-buttons come before the bottom ones, and Button leaves them to Base.
      const own = this.config.card_type === "sub-buttons";
      const bottom = Array.isArray(this.config.sub_button) ? [] : this.config.sub_button?.bottom ?? [];
      const grouped = bottom.filter((g) => Array.isArray(g?.group));
      const loose = bottom.filter((g) => g && !Array.isArray(g.group));
      const mains = org.items(this.config).length - grouped.reduce((a, g) => a + g.group.filter(Boolean).length, 0) - loose.length;
      let k = mains;
      const bars = bottom.filter((g) => Array.isArray(g?.group)).map((g) => ({ name: low(g.name), n: g.group.filter(Boolean).map(() => ++k) })).filter((g) => segNames.includes(g.name));
      const inBar = bars.flatMap((g) => g.n);
      // A button is active when its name, its css_class or an entity its tap targets matches, when its tap sets what its entity shows now, or while its own entity is on. Its own on key decides before all of these.
      const lamps = [];
      const subs = org.subs(env, this.config, "origami_button").filter(({ n }) => n > mains);
      // A button waits only while its look can change. A tap that only opens something never changes it, and segments show their choice at once. A button's own pending key decides for that button.
      const keyed = (opt, k) => !!opt && k in opt;
      const changes = (opt, item) => keyed(opt, "on") || !!item.entity || cfg.active !== undefined || org.matches(hass, item, item.entity ?? entity) !== null;
      const pendingOn = (opt, item, n) => !seg && !inBar.includes(n) && ![...org.links, "none"].includes(org.act(item).action) && (keyed(opt, "pending") ? org.yes(opt.pending) : !!cfg.pending && changes(opt, item));
      const active = subs.map(({ n, item, opt }) => {
        const mine = item.entity ? org.look(hass, item.entity) : null;
        // A button whose own entity is on takes that entity's state color as its lamp
        if (mine?.lit) lamps.push([n, mine.color]);
        if (keyed(opt, "on") || org.yes(opt?.disabled)) return org.why(hass, item, item.entity ?? entity, opt) ? n : 0;
        const named = hit(item, want);
        // A tap that sets a value lights the button while its entity has that value. Otherwise, a button with an entity of its own and a background follows Base's rule for that entity.
        const r = org.why(hass, item, item.entity ?? entity);
        return named || r === "set" || (r !== null && !!item.entity && item.show_background !== false) ? n : 0;
      }).filter(Boolean);
      // pending shows a tapped button with the look it is about to get, at reduced opacity and without taps, until its state changes or 10 seconds pass
      const pend = card._orgPend ?? (card._orgPend = new Map());
      const mark = (el, p) => {
        el?.classList.toggle("org-pending-on", !!p && !p.was);
        el?.classList.toggle("org-pending-off", !!p && p.was);
      };
      subs.forEach(({ n, item, opt }) => {
        const p = pend.get(n);
        if (p && (active.includes(n) !== p.was || Date.now() > p.until || !pendingOn(opt, item, n))) pend.delete(n);
        mark(card.querySelector(".bubble-sub-button-bottom-container .bubble-sub-button-" + n), pend.get(n));
      });
      // Bubble Card runs a tap through a hass-action event, so a tap on a button marks it there
      if (!card._orgPendOn) {
        card._orgPendOn = true;
        card.addEventListener("hass-action", (e) => {
          const el = e.composedPath().find((x) => x.classList?.contains("bubble-sub-button"));
          const n = Number(el?.className.match(/bubble-sub-button-(\d+)/)?.[1]);
          if (e.detail?.action !== "tap" || !card._orgB?.pending?.includes(n)) return;
          const p = { was: card._orgB.active.includes(n), until: Date.now() + 10000 };
          pend.set(n, p);
          mark(el, p);
          setTimeout(() => { if (pend.get(n) === p) { pend.delete(n); mark(el, null); } }, 10000);
        });
      }
      const lamp = String(org.value(env, cfg.color, ctx) ?? "").trim();
      const base = "ha-card .bubble-sub-button-bottom-container .bubble-sub-button";
      const sel = [...active.filter((n) => !inBar.includes(n)).map((n) => base + ".bubble-sub-button-" + n + ":not(.org-pending-off)"), base + ".org-pending-on"];
      const chips = !!cfg.chips;
      const scroll = !!cfg.scroll && !seg;
      // With labels below, each button is a large icon field with its name under it, as for scenes
      const below = cfg.labels === "below" && !seg;
      // Segments fill one row and center their content, and a scrolling row is a single line, so both ignore Columns
      const align = seg ? "center" : ["start", "center", "end"].includes(cfg.align) ? cfg.align : "start";
      const cols = seg || scroll ? 0 : Math.max(0, Math.min(6, parseInt(cfg.columns ?? 0, 10) || 0));
      const pad = String(cfg.padding ?? "").trim();
      const size = String(cfg.icon_size ?? "").trim() || (below ? "var(--icon-size-l)" : "var(--icon-size-2xs)");
      // Each button can have its own name, icon, color, name_color and background, with the same keys as a value in Header
      const values = org.values(env, this.config, "origami_button", "ha-card .bubble-sub-button-bottom-container", seg ? (cfg.label_size !== "normal" ? "var(--ha-font-size-l)" : "var(--ha-font-size-m)") : "var(--ha-font-size-s)", subs).join("\n    ");
      // A small segmented switch is a track around its group, and its active segment takes the stronger fill
      const bar = (g) => "ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:has(> :is(" + g.n.map((n) => ".bubble-sub-button-" + n).join(", ") + ")):not(.hidden)";
      // In a row that does not scroll, a switch fills the free width and its segments share it
      const barCss = bars.map((g) => bar(g) + " { display: flex !important; flex: " + (scroll ? "0 0 auto" : "1 1 auto") + "; gap: 0 !important; box-sizing: border-box; height: var(--org-btn-height); padding: var(--ha-space-1); border-radius: var(--org-btn-radius); background-color: var(--fill-subtle);}\n    "
        + bar(g) + " > .bubble-sub-button { " + (scroll ? "" : "flex: 1 1 0 !important; ") + "height: 100% !important; justify-content: center !important; padding: 0 calc(var(--ha-space-4) - 2px) !important; border-radius: calc(var(--org-btn-radius) - var(--ha-space-1)) !important; background: transparent !important; color: var(--secondary-text-color) !important; }").join("\n    ");
      const barOn = bars.flatMap((g) => g.n.filter((n) => active.includes(n)).map((n) => bar(g) + " > .bubble-sub-button.bubble-sub-button-" + n));
      // A divider is a short line between two buttons, and it shows while its group shows
      const dividers = subs.filter(({ item }) => org.slug(item.css_class) === "divider").map(({ n }) => base + ".bubble-sub-button-" + n);
      // outline rings the matching buttons that are not active, such as the scene for the time of day
      const ring = pick(cfg.outline);
      const rings = subs.filter(({ n, item }) => !active.includes(n) && hit(item, ring)).map(({ n }) => base + ".bubble-sub-button-" + n + (below ? " .bubble-sub-button-icon:not(.hidden)" : ""));
      // start lets the row begin at the matching button, and the buttons before it follow at the end, as in a cycle of scenes for the times of day
      let gi = mains, li = mains + grouped.reduce((a, g) => a + g.group.filter(Boolean).length, 0);
      const seq = bottom.flatMap((x) => Array.isArray(x?.group) ? x.group.filter(Boolean).map(() => ++gi) : x ? [++li] : []);
      const first = pick(cfg.start);
      const s = seq.findIndex((n) => hit(subs.find((x) => x.n === n)?.item ?? {}, first));
      // A button card leaves its own row, its main sub-buttons and their fill to Base
      if (!own && card.dataset.orgFill !== "bottom") card.dataset.orgFill = "bottom";
      card._orgB = {
        own,
        below,
        rings,
        order: s < 0 ? "" : seq.map((n, i) => base + ".bubble-sub-button-" + n + " { order: " + ((i - s + seq.length) % seq.length) + "; }").join("\n    "),
        bg: cfg.background ?? true,
        muted: !!cfg.muted,
        // The active segment is filled like the Toggle style
        toggle: seg || cfg.active_style === "toggle",
        seg,
        scroll,
        chips,
        active,
        pending: subs.filter(({ n, item, opt }) => pendingOn(opt, item, n)).map(({ n }) => n),
        bars: barCss,
        // each() adds each suffix it receives to every selector in a list and joins the results, or matches nothing for an empty list
        each: (list, ...ends) => list.length ? list.flatMap((s) => ends.map((e) => s + e)).join(",\n    ") : ".org-none",
        barOn,
        dividers,
        press: cfg.press ?? true,
        large: cfg.label_size !== "normal",
        // The Lamp style tints active buttons in the lamp color, or in the state color of a button's own entity
        lamp: lamp || "var(--lamp-color)",
        lamps: lamps.filter(([n]) => active.includes(n)).map(([n, c]) => base + ".bubble-sub-button-" + n + " { --org-btn-lamp: " + c + "; }").join("\n    "),
        cols,
        values,
        pad: pad || "0",
        size,
        row: (scroll && align !== "start" ? "safe " : "") + { start: "flex-start", center: "center", end: "flex-end" }[align],
        rev: { start: "flex-end", center: "center", end: "flex-start" }[align],
        // on() adds each suffix it receives to every active button's selector and joins the results into one list
        on: (...ends) => card._orgB.each(sel, ...ends)
      };
      return "";
    })()}
    ha-card {
      --org-btn-height: ${card._orgB.seg ? "var(--control-height)" : card._orgB.bg ? "var(--control-height-icon)" : "auto"};
      --org-btn-padding: ${card._orgB.seg ? "0 var(--ha-space-2)" : card._orgB.bg ? "0 var(--ha-space-4)" : "var(--ha-space-2) var(--ha-space-4)"};
      --org-btn-bg: ${card._orgB.bg || card._orgB.seg ? "var(--fill-subtle)" : "transparent"};
      --org-btn-opacity: ${card._orgB.muted ? "var(--opacity-muted)" : "1"};
      --org-btn-icon-size: ${card._orgB.size};
      --org-btn-lamp: ${card._orgB.lamp};
      --org-btn-radius: calc(${card._orgB.seg ? "var(--control-height)" : "var(--control-height-icon)"} * var(--radius-ratio, 0.35));
    }
    ${card._orgB.lamps}
    ${card._orgB.values}
    ${card._orgB.order}
    ${card._orgB.own ? card._org.unframe(card._orgB.pad) : ""}
    ha-card .bubble-sub-button-bottom-container {
      position: static !important;
      inset: auto !important;
      gap: ${card._orgB.seg ? "0" : "var(--ha-space-2)"} !important;
      pointer-events: auto !important;
      ${card._orgB.cols ? `display: grid !important;
      grid-template-columns: repeat(${card._orgB.cols}, minmax(0, 1fr)) !important;` : `display: flex !important;
      flex-direction: row !important;
      flex-wrap: ${card._orgB.seg || card._orgB.scroll ? "nowrap" : "wrap"} !important;
      justify-content: ${card._orgB.row} !important;`}
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-alignment-lane,
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(.hidden) {
      display: contents !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      box-sizing: border-box !important;
      ${card._orgB.cols ? "" : `flex: ${card._orgB.seg ? "1 1 0" : "0 0 auto"} !important;`}
      width: auto !important;
      min-width: 0 !important;
      height: var(--org-btn-height) !important;
      padding: var(--org-btn-padding) !important;
      justify-content: ${card._orgB.rev} !important;
      align-items: center !important;
      gap: 0 !important;
      border-radius: ${card._orgB.seg ? "0" : "var(--org-btn-radius)"} !important;
      background: var(--org-value-chip, var(--org-btn-bg)) !important;
      box-shadow: none !important;
      color: ${card._orgB.seg ? "var(--primary-text-color)" : "var(--secondary-text-color)"} !important;
      font-size: var(--ha-font-size-m) !important;
      white-space: nowrap !important;
      transition: var(--transition-interactive) !important;
      ${card._orgB.seg ? "isolation: isolate;" : ""}
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right {
      justify-content: ${card._orgB.row} !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(.content-icon-top, .content-icon-bottom) {
      height: auto !important;
      min-height: calc(2 * var(--org-btn-height)) !important;
      padding: var(--ha-space-3) var(--ha-space-2) !important;
      justify-content: center !important;
      gap: var(--ha-space-2) !important;
    }
    ${!card._orgB.press ? "" : card._orgB.seg ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      --org-btn-bg: var(--fill-strong);
      --org-value-chip: var(--fill-strong);
    }` : `ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bubble-action-enabled:active {
      transform: scale(var(--press-scale));
    }`}
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-name-container {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap !important;
      font-size: ${card._orgB.seg ? (card._orgB.large ? "var(--ha-font-size-l)" : "var(--ha-font-size-m)") : "var(--ha-font-size-s)"} !important;
      font-weight: ${card._orgB.seg ? "var(--ha-font-weight-bold)" : "var(--ha-font-weight-medium)"} !important;
      ${card._orgB.seg ? "font-variant-numeric: tabular-nums;" : ""}
      color: inherit !important;
      opacity: var(--org-btn-opacity) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      display: block !important;
      flex-shrink: 0;
      --mdc-icon-size: var(--org-btn-icon-size) !important;
      margin-block: 0 !important;
      margin-inline: 0 var(--ha-space-2) !important;
      color: inherit !important;
      opacity: ${card._orgB.seg ? "calc(var(--org-btn-opacity) * var(--opacity-strong))" : "var(--org-btn-opacity)"} !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
      margin-block: 0 !important;
      margin-inline: var(--ha-space-2) 0 !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon.icon-without-state:not(.hidden),
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(.content-icon-top, .content-icon-bottom) .bubble-sub-button-icon:not(.hidden) {
      margin: 0 !important;
    }
    ${card._orgB.seg ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(:first-child, :nth-child(1 of .bubble-sub-button:not(.hidden))) {
      border-start-start-radius: var(--org-btn-radius) !important;
      border-end-start-radius: var(--org-btn-radius) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:is(:last-child, :nth-last-child(1 of .bubble-sub-button:not(.hidden))) {
      border-start-end-radius: var(--org-btn-radius) !important;
      border-end-end-radius: var(--org-btn-radius) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-group:not(:is(:last-child, :nth-last-child(1 of .bubble-sub-button-group:not(.hidden)))) > .bubble-sub-button:is(:last-child, :nth-last-child(1 of .bubble-sub-button:not(.hidden))) {
      margin-inline-end: var(--ha-space-3);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:not(.hidden) ~ .bubble-sub-button::after {
      content: "";
      position: absolute;
      inset-block: 25%;
      inset-inline-start: 0;
      width: var(--org-line-width);
      background-color: var(--org-line-color);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button::before {
      --org-btn-inset: calc((var(--control-height) - var(--control-height-row)) / 2);
      content: "";
      position: absolute;
      inset: var(--org-btn-inset);
      z-index: -1;
      border-radius: calc(var(--org-btn-radius) - var(--org-btn-inset));
      background-color: var(--fill-active);
      opacity: 0;
      transition: opacity var(--duration-normal) ease;
    }
    ${card._orgB.on("::before")} {
      opacity: 1;
    }
    ${card._orgB.on("::after", " + .bubble-sub-button::after")} {
      display: none;
    }` : ""}
    ${card._orgB.chips ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      color: var(--primary-text-color) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      color: var(--secondary-text-color) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right {
      padding-inline-end: var(--ha-space-3) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button:not(:has(.bubble-sub-button-name-container:not(:empty))) {
      width: var(--org-btn-height) !important;
      padding: 0 !important;
      justify-content: center !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button.content-icon-right .bubble-sub-button-icon:not(.hidden) {
      margin-inline: var(--ha-space-1) 0 !important;
    }` : ""}
    ${card._orgB.below ? `ha-card .bubble-sub-button-bottom-container .bubble-sub-button {
      flex-direction: column !important;
      justify-content: flex-start !important;
      ${card._orgB.cols ? "" : "width: calc(var(--tile-size-lg) + var(--ha-space-2)) !important;"}
      height: auto !important;
      padding: 0 !important;
      gap: 0 !important;
      background: none !important;
      color: var(--primary-text-color) !important;
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button .bubble-sub-button-icon:not(.hidden) {
      display: flex !important;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      order: -1;
      width: 100% !important;
      height: var(--tile-size-lg) !important;
      margin: 0 !important;
      border-radius: min(calc(var(--tile-size-lg) * var(--radius-ratio, 0.35)), var(--ha-card-border-radius));
      background: var(--org-value-chip, var(--org-btn-bg));
      transition: var(--transition-interactive);
    }
    ha-card .bubble-sub-button-bottom-container .bubble-sub-button-name-container {
      max-width: 100%;
      margin-top: var(--ha-space-3) !important;
      font-size: var(--ha-font-size-m) !important;
    }` : ""}
