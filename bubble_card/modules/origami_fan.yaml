origami_fan:
  name: "Origami • Fan"
  version: "3.0.1"
  supported:
    - button
  description: "Fan lets the fan icon spin at the fan's speed. The icon turns the other way while the fan runs in reverse, and it stands still when the device asks for less motion."
  code: |
    ${(() => {
      const org = card._org;
      if (org?.hass !== hass || !(org.version >= 12)) throw new Error("origami_fan needs origami_base 12 or later");
      const st = hass.states[entity];
      const pct = Math.min(Math.max(Number(st?.attributes?.percentage) || 0, 0), 100);
      card._orgFanSpin = st?.state === "on"
        ? "origami-fan-spin " + (2.8 - (pct / 100) * 2.1).toFixed(2) + "s linear infinite" + (st.attributes?.direction === "reverse" ? " reverse" : "")
        : "none";
      return "";
    })()}
    @keyframes origami-fan-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      ha-card .bubble-icon {
        animation: ${card._orgFanSpin} !important;
        transform-origin: center;
      }
    }
