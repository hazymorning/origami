origami_fan:
  name: "Origami • Fan"
  version: "3.0.0"
  supported:
    - button
  description: "The Fan module lets the fan icon spin at the fan's speed, and it works with Base. The icon turns the other way while the fan runs in reverse, and it stands still when the system asks for less motion. Base fills the power button while the fan runs and fills each speed button while the fan runs at that button's speed. Bubble Card writes the state line from state_content in Home Assistant's own words, for example percentage."
  code: |
    ${(() => {
      const st = hass.states[entity];
      const pct = Math.min(Math.max(Number(st?.attributes?.percentage) || 0, 0), 100);
      card._orgFanSpin = st?.state === "on"
        ? "origami-fan-spin " + (2.8 - (pct / 100) * 2.1).toFixed(2) + "s linear infinite" + (st.attributes?.direction === "reverse" ? " reverse" : "")
        : "none";
      return "";
    })()}
    @keyframes origami-fan-spin {
      to {
        transform: rotate(360deg);
      }
    }
    @media (prefers-reduced-motion: no-preference) {
      ha-card .bubble-icon {
        animation: ${card._orgFanSpin} !important;
        transform-origin: center;
      }
    }
