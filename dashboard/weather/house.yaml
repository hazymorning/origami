# The Home layout, with the next sunset or sunrise, the wind and how warm three of the rooms are.
type: custom:origami-weather
weather_entity: weather.home
# Light or dark with the theme, like the rest of the dashboard
color_mode: theme
sun_enabled: false
moon_enabled: false
cloud_effects: false
mist_effects: true
mist_density: 0.7
night_sky_effects: false
balloon_effects: false
plane_effects: false
background_mode: color
background_thresholds:
  - value: sunny
    color: '#e7e2d9'
    color_dark: '#0d1f30'
  - value: clear-night
    color: '#dbdce1'
    color_dark: '#0d1f30'
  - value: partlycloudy
    color: '#e0deda'
    color_dark: '#1a2530'
  - value: cloudy
    color: '#d3d4d6'
    color_dark: '#262a2e'
  - value: fog
    color: '#e6e6e5'
    color_dark: '#343a3d'
  - value: windy
    color: '#dadfdd'
    color_dark: '#16292a'
  - value: windy-variant
    color: '#d5dad9'
    color_dark: '#14262b'
  - value: rainy
    color: '#cdd2d6'
    color_dark: '#15232b'
  - value: pouring
    color: '#c8cdd2'
    color_dark: '#111d24'
  - value: lightning
    color: '#cfced3'
    color_dark: '#231f31'
  - value: lightning-rainy
    color: '#cacacf'
    color_dark: '#1d1c2b'
  - value: snowy
    color: '#e6eaed'
    color_dark: '#2b363c'
  - value: snowy-rainy
    color: '#d8dddf'
    color_dark: '#222e32'
  - value: hail
    color: '#d2d9da'
    color_dark: '#1a2a2d'
  - value: exceptional
    color: '#ded8d2'
    color_dark: '#2c1b17'
card_height: 256px
card_padding: 20px
content_align: between
button_containers:
  - name: Sun and wind
    justify_content: between
    align_items: start
    button_text_size: 12px
    buttons:
      - name: Sunset (by day)
        entity: sun.sun
        attribute: next_setting
        visibility:
          - condition: state
            entity: sun.sun
            state: above_horizon
        inner_gap: 6px
        elements:
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunset
          - type: text
            weight: '700'
            color: var(--primary-text-color)
      - name: Sunrise (at night)
        entity: sun.sun
        attribute: next_rising
        visibility:
          - condition: state
            entity: sun.sun
            state: below_horizon
        inner_gap: 6px
        elements:
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            text: Sunrise
          - type: text
            weight: '700'
            color: var(--primary-text-color)
      - name: Wind compass
        entity: weather.home
        type: ring
        style: vertical
        ring_min: 0
        ring_max: 360
        ring_fill: false
        ring_width: 1
        ring_color: var(--secondary-text-color)
        ring_marker_icon_size: 17
        ring_values:
          - value: 0
            marker_size: 14
            marker_gap: true
            marker_icon: mdi:alpha-n
            marker_icon_color: var(--secondary-text-color)
          - attribute: wind_bearing
            marker_size: 7
            marker_color: var(--primary-text-color)
        width: 54px
        padding: '0'
        inner_gap: 4px
        elements:
          - type: text
            weight: '700'
            color: var(--primary-text-color)
            attribute: wind_speed
            precision: 0
            format: ' '
            size: 15px
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            attribute: wind_speed_unit
            size: 8px
  - name: House
    layer: middle
    position: custom
    position_anchor: top-right
    position_x: 34px
    position_y: 18px
    image: home
    custom_width: min(178px, 75% - 49px)
  # Each room shows while its sensor has a value, so a room without a sensor isn't shown
  - name: Temperature and rooms
    align: spread
    align_items: end
    gap: clamp(14px, 6cqw, 22px)
    button_gap: 4px
    button_text_size: 12px
    buttons:
      - name: Outside
        entity: weather.home
        style: split
        elements:
          - type: text
            weight: '700'
            color: var(--primary-text-color)
            precision: 0
            format: °
            attribute: temperature
            size: clamp(40px, 17cqw, 52px)
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            overflow: wrap
      - name: 'Room: Living'
        entity: sensor.living_room_temperature
        style: vertical
        align: start
        elements:
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            text: Living
          - type: text
            weight: '700'
            color: var(--primary-text-color)
            precision: 0
            format: °
            size: 16px
        visibility:
          - condition: numeric_state
            entity: sensor.living_room_temperature
      - name: 'Room: Office'
        entity: sensor.office_temperature
        style: vertical
        align: start
        elements:
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            text: Office
          - type: text
            weight: '700'
            color: var(--primary-text-color)
            precision: 0
            format: °
            size: 16px
        visibility:
          - condition: numeric_state
            entity: sensor.office_temperature
      - name: 'Room: Bath'
        entity: sensor.bathroom_temperature
        style: vertical
        align: start
        elements:
          - type: text
            weight: '500'
            color: var(--secondary-text-color)
            text: Bath
          - type: text
            weight: '700'
            color: var(--primary-text-color)
            precision: 0
            format: °
            size: 16px
        visibility:
          - condition: numeric_state
            entity: sensor.bathroom_temperature
