# The Diorama layout from Origami Weather. Its pictures, one for every kind of weather, come with the card.
# A tap shows the next days, as on Origami Weather's Sky layout.
type: custom:origami-weather
weather_entity: weather.home
# Light or dark with the theme, like the rest of the dashboard
color_mode: theme
card_height: 160px
card_padding: '0'
# On a phone, the card keeps a little more space from the greeting above it
card_offset: 20px 0px 0px 0px
sun_size: 30
moon_size: 30
sun_moon_x: dynamic
cloud_effects: false
background_mode: images
weather_image_path: diorama/light/
weather_image_path_dark: diorama/dark/
weather_image_type: webp
weather_image_front: true
background_thresholds:
  - value: sunny
    color: '#eee5d7'
    color_dark: '#453728'
  - value: partlycloudy
    color: '#dee9ef'
    color_dark: '#2f3e46'
  - value: cloudy
    color: '#e2e5e7'
    color_dark: '#35393c'
  - value: fog
    color: '#e8e7e5'
    color_dark: '#312f2e'
  - value: rainy
    color: '#d9e1ea'
    color_dark: '#2f3946'
  - value: pouring
    color: '#d7dde4'
    color_dark: '#2d363f'
  - value: lightning
    color: '#e5dfe8'
    color_dark: '#3f3743'
  - value: lightning-rainy
    color: '#dfdbe2'
    color_dark: '#37313c'
  - value: hail
    color: '#d3dfdf'
    color_dark: '#293838'
  - value: snowy
    color: '#e5eaec'
    color_dark: '#344043'
  - value: snowy-rainy
    color: '#dde2e5'
    color_dark: '#383d41'
  - value: windy
    color: '#dce6e3'
    color_dark: '#2f3f3c'
  - value: windy-variant
    color: '#dae1de'
    color_dark: '#2f3936'
  - value: clear-night
    color: '#e0e3ed'
    color_dark: '#2b2f40'
  - value: exceptional
    color: '#eadad3'
    color_dark: '#47332c'
# A tap shows the next days over the landscape, and they stay after a reload on the same device
visibility_fade: true
remember_switches: true
card_tap_action:
  action: toggle
  entity: origami.forecast
css: |
  #weather-bg > img { object-position: right bottom; }
  /* On a wide screen, the heading above the card sets the space */
  @media (min-width: 768px) { :host { margin: 0px 0px 0px 0px !important; } }
button_containers:
  # Hidden while the next days show. A tap on it opens the weather's dialog.
  - name: Now
    padding: var(--ha-space-4, 16px) var(--ha-space-4, 16px) var(--ha-space-4, 16px) calc(var(--ha-space-4, 16px) + 4px)
    visibility:
      - condition: state
        entity: origami.forecast
        state: 'off'
    buttons:
      - name: Temperature and condition
        entity: weather.home
        style: vertical
        inner_gap: 6px
        elements:
          - type: text
            attribute: temperature
            size: 40px
            weight: '700'
            precision: 0
            format: °
          - type: text
            size: 12px
            weight: '500'
            overflow: wrap
  # The next days, as on the Sky layout. A tap on a day hides them again.
  - name: Days
    position: custom
    position_anchor: top-left
    position_x: '0'
    position_y: '0'
    custom_width: 100%
    padding: 44px max(0px, calc(63.5px - 12.5cqw))
    layout: horizontal-scroll
    scroll_count: 5
    row_height: 100%
    align_items: stretch
    gap: '0'
    align: center
    scroll_fade: true
    scroll_fade_size: 48px
    background: true
    grouped: true
    border: none
    blurred_background: true
    background_blur: 16
    background_color: 'color-mix(in srgb, var(--origami-card-bg-color, var(--ha-card-background, var(--card-background-color, #fff))) 30%, transparent)'
    button_style: vertical
    button_gap: 5px
    button_text_size: 12px
    button_icon_size: 28px
    visibility:
      - condition: state
        entity: origami.forecast
        state: 'on'
    buttons:
      # Every day after Today repeats it, with its own name and offset
      - &day
        name: Today
        entity: weather.home
        forecast: daily
        forecast_offset: 0
        tap_action:
          action: toggle
          entity: origami.forecast
        elements:
          - type: text
            attribute: datetime
            format: '%a'
            weight: '500'
          - type: icon
            icon: weather
            margin: 5px 0 4px
          - type: text
            attribute: temperature
            format: °
            size: 15px
            weight: '700'
          - type: text
            attribute: templow
            format: °
            size: 13px
            weight: '500'
          - type: bar
            bar_shape: curve
            bar_height: 2px
            bar_color: color-mix(in srgb, currentColor 22%, transparent)
            margin: '-75px 0 0'
            bar_values:
              - attribute: temperature
                marker_size: 28px
                marker_gap: true
      - <<: *day
        name: Tomorrow
        forecast_offset: 1
      - <<: *day
        name: In 2 days
        forecast_offset: 2
      - <<: *day
        name: In 3 days
        forecast_offset: 3
      - <<: *day
        name: In 4 days
        forecast_offset: 4
      - <<: *day
        name: In 5 days
        forecast_offset: 5
      - <<: *day
        name: In 6 days
        forecast_offset: 6
      - <<: *day
        name: In 7 days
        forecast_offset: 7
      - <<: *day
        name: In 8 days
        forecast_offset: 8
      - <<: *day
        name: In 9 days
        forecast_offset: 9
grid_options:
  columns: full
