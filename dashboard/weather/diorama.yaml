# Origami Weather's Diorama layout, a paper landscape for each kind of weather. Its pictures come with the card.
type: custom:origami-weather
weather_entity: weather.home
# Light or dark with the theme, like the rest of the dashboard
color_mode: theme
card_height: 160px
card_padding: '0'
sun_size: 30
moon_size: 30
sun_moon_x: dynamic
cloud_effects: false
background_mode: images
weather_image_path: diorama/light/
weather_image_path_dark: diorama/dark/
weather_image_type: webp
weather_image_front: true
background_thresholds:
  - value: sunny
    color: '#eee5d7'
    color_dark: '#453728'
  - value: partlycloudy
    color: '#dee9ef'
    color_dark: '#2f3e46'
  - value: cloudy
    color: '#e2e5e7'
    color_dark: '#35393c'
  - value: fog
    color: '#e8e7e5'
    color_dark: '#312f2e'
  - value: rainy
    color: '#d9e1ea'
    color_dark: '#2f3946'
  - value: pouring
    color: '#d7dde4'
    color_dark: '#2d363f'
  - value: lightning
    color: '#e5dfe8'
    color_dark: '#3f3743'
  - value: lightning-rainy
    color: '#dfdbe2'
    color_dark: '#37313c'
  - value: hail
    color: '#d3dfdf'
    color_dark: '#293838'
  - value: snowy
    color: '#e5eaec'
    color_dark: '#344043'
  - value: snowy-rainy
    color: '#dde2e5'
    color_dark: '#383d41'
  - value: windy
    color: '#dce6e3'
    color_dark: '#2f3f3c'
  - value: windy-variant
    color: '#dae1de'
    color_dark: '#2f3936'
  - value: clear-night
    color: '#e0e3ed'
    color_dark: '#2b2f40'
  - value: exceptional
    color: '#eadad3'
    color_dark: '#47332c'
card_tap_action:
  action: more-info
css: '#weather-bg > img { object-position: right bottom; }'
button_containers:
  - name: Now
    padding: var(--ha-space-4, 16px) var(--ha-space-4, 16px) var(--ha-space-4, 16px) calc(var(--ha-space-4, 16px) + 4px)
    buttons:
      - name: Temperature and condition
        entity: weather.home
        style: vertical
        inner_gap: 6px
        elements:
          - type: text
            attribute: temperature
            size: 40px
            weight: '700'
            precision: 0
            format: °
          - type: text
            size: 12px
            weight: '500'
            overflow: wrap
grid_options:
  columns: full
