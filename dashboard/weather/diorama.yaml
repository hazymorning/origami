# A paper diorama for each kind of weather, with its own pictures for light and dark mode. The sun and the moon
# cross the sky behind the hills, and the temperature and the weather stand at the top.
type: custom:origami-weather
weather_entity: weather.home
color_mode: theme
card_height: 150px
card_padding: 0px 0px 0px 0px
card_offset: 20px 0px 0px 0px
card_tap_action:
  action: more-info
sun_moon_size: 40
sun_moon_x: dynamic
# The chips lie on a colored card, so they have the chip shadow, as on a tile
shadow_color: var(--tile-chip-shadow)
# The pictures have their own clouds
cloud_effects: false
# One picture for each kind of weather, named after it, such as partlycloudy.webp, from the diorama folder of this repository
background_mode: images
weather_image_path: https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/
weather_image_path_dark: https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/
grid_options:
  columns: full
  rows: auto
content_direction: row
content_align: end
css: |
  /* Origami Weather with the Origami theme's values */
  :host {
    --origami-text-light: var(--primary-text-color);
    --origami-text-dark: var(--primary-text-color);
    --origami-bottom-font-weight: var(--ha-font-weight-normal);
    --origami-bottom-bg-filter: var(--blur-soft);
    /* A chip's corner is 35 % of its height: the text and 6px above and below it */
    --origami-bottom-bg-radius: calc((1em + 12px) * var(--radius-ratio));
  }
  /* The pictures have a clear sky, and the card paints the paper in the weather's color. Each picture is also the mask of the sky,
     so the sun, the moon and the stars show only in the open sky and set behind the hills, the trees and the clouds. */
  #card-root { --paper: #e2e5e7; --sky: none; }
  #card-root.scheme-dark { --paper: #1b1e20; }
  #card-root.weather-sunny { --paper: #eee5d7; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/sunny.webp"); }
  #card-root.scheme-dark.weather-sunny { --paper: #261d13; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/sunny.webp"); }
  #card-root.weather-partlycloudy { --paper: #dee9ef; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/partlycloudy.webp"); }
  #card-root.scheme-dark.weather-partlycloudy { --paper: #182227; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/partlycloudy.webp"); }
  #card-root.weather-cloudy { --paper: #e2e5e7; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/cloudy.webp"); }
  #card-root.scheme-dark.weather-cloudy { --paper: #1b1e20; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/cloudy.webp"); }
  #card-root.weather-fog { --paper: #e8e7e5; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/fog.webp"); }
  #card-root.scheme-dark.weather-fog { --paper: #222120; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/fog.webp"); }
  #card-root.weather-rainy { --paper: #d9e1ea; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/rainy.webp"); }
  #card-root.scheme-dark.weather-rainy { --paper: #171e26; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/rainy.webp"); }
  #card-root.weather-pouring { --paper: #d7dde4; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/pouring.webp"); }
  #card-root.scheme-dark.weather-pouring { --paper: #151b21; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/pouring.webp"); }
  #card-root.weather-lightning { --paper: #e5dfe8; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/lightning.webp"); }
  #card-root.scheme-dark.weather-lightning { --paper: #221d25; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/lightning.webp"); }
  #card-root.weather-lightning-rainy { --paper: #dfdbe2; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/lightning-rainy.webp"); }
  #card-root.scheme-dark.weather-lightning-rainy { --paper: #1d1920; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/lightning-rainy.webp"); }
  #card-root.weather-hail { --paper: #d3dfdf; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/hail.webp"); }
  #card-root.scheme-dark.weather-hail { --paper: #121c1c; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/hail.webp"); }
  #card-root.weather-snowy { --paper: #e5eaec; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/snowy.webp"); }
  #card-root.scheme-dark.weather-snowy { --paper: #1c2426; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/snowy.webp"); }
  #card-root.weather-snowy-rainy { --paper: #dde2e5; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/snowy-rainy.webp"); }
  #card-root.scheme-dark.weather-snowy-rainy { --paper: #1e2124; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/snowy-rainy.webp"); }
  #card-root.weather-windy { --paper: #dce6e3; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/windy.webp"); }
  #card-root.scheme-dark.weather-windy { --paper: #182220; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/windy.webp"); }
  #card-root.weather-windy-variant { --paper: #dae1de; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/windy-variant.webp"); }
  #card-root.scheme-dark.weather-windy-variant { --paper: #171d1b; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/windy-variant.webp"); }
  #card-root.weather-clear-night { --paper: #e0e3ed; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/clear-night.webp"); }
  #card-root.scheme-dark.weather-clear-night { --paper: #161924; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/clear-night.webp"); }
  #card-root.weather-exceptional { --paper: #eadad3; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/exceptional.webp"); }
  #card-root.scheme-dark.weather-exceptional { --paper: #271a15; --sky: url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/exceptional.webp"); }
  #card-root.scheme-light, #card-root.scheme-dark { background-color: var(--paper); }
  /* The landscape stands at the bottom left, however wide the card is */
  #weather-bg > img { object-position: left bottom; }
  #card-root.has-weather-bg :is(#sun-moon-layer, #star-canvas) {
    -webkit-mask-image: var(--sky), linear-gradient(#000 0 0);
    -webkit-mask-position: left bottom, 0 0;
    -webkit-mask-size: cover, 100% 100%;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-composite: xor;
    mask-image: var(--sky), linear-gradient(#000 0 0);
    mask-position: left bottom, 0 0;
    mask-size: cover, 100% 100%;
    mask-repeat: no-repeat;
    mask-composite: exclude;
  }
  /* The paper changes softly with the weather, and a new picture fades in */
  @media (prefers-reduced-motion: no-preference) {
    #card-root.scheme-light, #card-root.scheme-dark { transition: background-color 1.2s var(--ease-standard), transform .4s cubic-bezier(.2, 0, .2, 1); }
    #weather-bg > img { animation: appear .9s var(--ease-standard) both; }
  }
  @keyframes appear { from { opacity: 0; } }
  /* Rain, snow, birds and planes in calmer colors */
  #weather-effects { filter: saturate(.6); }
  /* On a wide screen, the heading above the card sets the space */
  @media (min-width: 768px) { :host { margin: 0px 0px 0px 0px !important; } }
button_containers:
  # The next sunset by day, and the next sunrise by night
  - position: custom
    position_anchor: top-left
    padding: 16px 16px 16px 16px
    button_gap: 6px
    buttons:
      - entity: sun.sun
        visibility:
          - condition: state
            entity: sun.sun
            state: above_horizon
        elements:
          - type: icon
            icon: mdi:weather-sunset-down
          - type: text
            entity: sun.sun
            attribute: next_setting
            size: 12px
            weight: '700'
            color: var(--primary-text-color)
      - entity: sun.sun
        visibility:
          - condition: state
            entity: sun.sun
            state: below_horizon
        elements:
          - type: icon
            icon: mdi:weather-sunset-up
          - type: text
            entity: sun.sun
            attribute: next_rising
            size: 12px
            weight: '700'
            color: var(--primary-text-color)
  # The temperature and the weather
  - position: custom
    position_anchor: top-right
    align: end
    padding: 16px 20px 16px 20px
    buttons:
      - entity: weather.home
        style: vertical
        inner_gap: 6px
        padding: 0px 0px 0px 0px
        elements:
          - type: text
            attribute: temperature
            precision: 0
            format: °
            size: 40px
            weight: '700'
            color: var(--primary-text-color)
          - type: text
            size: 12px
            weight: '500'
