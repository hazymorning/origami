type: custom:origami-weather
weather_entity: weather.home
color_mode: theme
card_height: 185px
card_padding: 16px
card_offset: 12px 0px 12px 0px
card_tap_action:
  action: more-info
sun_moon_size: 40
sun_moon_x: 32
sun_moon_y: 46
# One calm color for each kind of weather, and a plain one for anything else
background_mode: color
background_color: '#e6e3de'
background_color_dark: '#1c1b19'
background_threshold_entity: weather.home
background_thresholds:
  - value: sunny
    color: '#eee5d7'
    color_dark: '#261d13'
  - value: clear-night
    color: '#e0e3ed'
    color_dark: '#161924'
  - value: partlycloudy
    color: '#dee9ef'
    color_dark: '#182227'
  - value: cloudy
    color: '#e2e5e7'
    color_dark: '#1b1e20'
  - value: fog
    color: '#e8e7e5'
    color_dark: '#222120'
  - value: windy
    color: '#dce6e3'
    color_dark: '#182220'
  - value: windy-variant
    color: '#dae1de'
    color_dark: '#171d1b'
  - value: rainy
    color: '#d9e1ea'
    color_dark: '#171e26'
  - value: pouring
    color: '#d7dde4'
    color_dark: '#151b21'
  - value: lightning
    color: '#e5dfe8'
    color_dark: '#221d25'
  - value: lightning-rainy
    color: '#dfdbe2'
    color_dark: '#1d1920'
  - value: hail
    color: '#d3dfdf'
    color_dark: '#121c1c'
  - value: snowy
    color: '#e5eaec'
    color_dark: '#1c2426'
  - value: snowy-rainy
    color: '#dde2e5'
    color_dark: '#1e2124'
  - value: exceptional
    color: '#eadad3'
    color_dark: '#271a15'
grid_options:
  columns: full
  rows: auto
css: |
  /* Today's lowest and highest temperature sit on one chip with the card's inner corners */
  .buttons-group.grouped.with-bg > .buttons-row .button.with-bg {
    border-radius: var(--radius-inner) !important;
    box-shadow: var(--tile-chip-shadow, var(--ha-card-box-shadow)) !important;
  }
  /* The color changes softly when the weather changes */
  @media (prefers-reduced-motion: no-preference) {
    #card-root.bg-custom-color.bg-custom-color { transition: background-color 1.2s var(--ease-standard, ease), transform .4s cubic-bezier(.2, 0, .2, 1); }
  }
  /* On a wide screen, the heading above the card sets the space */
  @media (min-width: 768px) { :host { margin: 0 !important; } }
button_containers:
  # The weather and the temperature
  - padding: 4px
    buttons:
      - entity: weather.home
        style: vertical
        align: start
        inner_gap: 6px
        padding: '0'
        elements:
          - type: text
            size: 13px
            weight: '500'
            color: var(--primary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            size: 40px
            weight: '700'
            color: var(--primary-text-color)
  # Today's lowest and highest temperature
  - position: custom
    position_anchor: bottom-left
    position_x: 0px
    position_y: 0px
    grouped: true
    background: true
    separator: true
    gap: 0px
    button_gap: 4px
    button_icon_size: 13px
    button_text_size: 13px
    button_padding: 8px 12px
    button_shadow: false
    buttons:
      - entity: weather.home
        forecast: daily
        shadow: false
        background: false
        elements:
          - type: text
            text: 'Today:'
            margin: 0 2px 0 0
            weight: '500'
          - type: text
            attribute: templow
            format: ' '
            weight: '700'
            color: var(--primary-text-color)
          - type: text
            text: '-'
          - type: text
            attribute: temperature
            format: °
            weight: '700'
  # The house, the card's demo house
  - position: custom
    position_anchor: top-right
    position_x: 4px
    position_y: 4px
    custom_width: 170px
    image: demo-home-image
