# Origami Weather's Comparison layout in calm colors: the temperature, the next days, a bar with the temperature now and
# today's high, the weather and the chance of rain. The card's color follows the weather, and nothing else moves.
type: custom:origami-weather
weather_entity: weather.home
color_mode: theme
card_height: content
card_padding: 20px 20px 20px 20px
card_offset: 20px 0px 0px 0px
card_tap_action:
  action: more-info
# No sun, moon, sky or anything flying by. The color alone shows the weather
sun_enabled: false
moon_enabled: false
cloud_effects: false
precipitation_effects: false
night_sky_effects: false
bird_effects: false
plane_effects: false
balloon_effects: false
background_haze: false
# One calm color for each kind of weather, the same as on the house card, and a plain one for anything else
background_mode: color
background_color: '#e6e3de'
background_color_dark: rgba(28, 27, 25, 0.7)
background_threshold_entity: weather.home
background_thresholds:
  - value: sunny
    color: '#eee5d7'
    color_dark: '#261d13'
  - value: clear-night
    color: '#e0e3ed'
    color_dark: '#161924'
  - value: partlycloudy
    color: '#dee9ef'
    color_dark: '#182227'
  - value: cloudy
    color: '#e2e5e7'
    color_dark: '#1b1e20'
  - value: fog
    color: '#e8e7e5'
    color_dark: '#222120'
  - value: windy
    color: '#dce6e3'
    color_dark: '#182220'
  - value: windy-variant
    color: '#dae1de'
    color_dark: '#171d1b'
  - value: rainy
    color: '#d9e1ea'
    color_dark: '#171e26'
  - value: pouring
    color: '#d7dde4'
    color_dark: '#151b21'
  - value: lightning
    color: '#e5dfe8'
    color_dark: '#221d25'
  - value: lightning-rainy
    color: '#dfdbe2'
    color_dark: '#1d1920'
  - value: hail
    color: '#d3dfdf'
    color_dark: '#121c1c'
  - value: snowy
    color: '#e5eaec'
    color_dark: '#1c2426'
  - value: snowy-rainy
    color: '#dde2e5'
    color_dark: '#1e2124'
  - value: exceptional
    color: '#eadad3'
    color_dark: '#271a15'
grid_options:
  columns: full
  rows: auto
css: |
  /* Origami Weather with the Origami theme's values */
  :host {
    --origami-text-light: var(--primary-text-color);
    --origami-text-dark: var(--primary-text-color);
    --origami-bottom-font-weight: var(--ha-font-weight-normal);
    --origami-bottom-bg-filter: var(--blur-soft);
  }

  /* The card's color changes softly with the weather */
  @media (prefers-reduced-motion: no-preference) {
    #card-root.bg-custom-color.bg-custom-color { transition: background-color 1.2s var(--ease-standard), transform .4s cubic-bezier(.2, 0, .2, 1); }
  }

  /* On a wide screen, the heading above the card sets the space */
  @media (min-width: 768px) { :host { margin: 0px 0px 0px 0px !important; } }
button_containers:
  # The temperature
  - buttons:
      - entity: weather.home
        background: false
        padding: 0px 0px 0px 0px
        style: vertical
        align: start
        inner_gap: 6px
        elements:
          - type: text
            text: Outside
            size: 14px
            weight: '500'
          - type: text
            attribute: temperature
            precision: 0
            format: °
            size: 42px
            weight: '700'
  # Today and the next days, three at a time, on tiles that scroll
  - position: custom
    position_anchor: top-right
    layout: horizontal-scroll
    custom_width: 60%
    scroll_count: 3
    gap: 8px
    background: true
    button_style: vertical
    button_padding: 16px 8px 16px 8px
    button_icon_size: 26px
    button_icon_padding: 0px 0px 8px 0px
    # The tiles are a faint white, so the weather's color shows through them
    button_background_color: color-mix(in srgb, var(--tile-chip-background) 45%, transparent)
    button_blurred_background: true
    buttons:
      - entity: weather.home
        forecast: daily
        align: center
        elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
      - entity: weather.home
        forecast: daily
        forecast_offset: 1
        align: center
        elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
      - entity: weather.home
        forecast: daily
        forecast_offset: 2
        align: center
        elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
      - entity: weather.home
        forecast: daily
        forecast_offset: 3
        align: center
        elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
  # The temperature now and today's high on a bar from -10° to 35°
  - padding: 0px 0px 0px 0px
    margin: 66px 0px 8px 0px
    buttons:
      - entity: weather.home
        forecast: daily
        background: false
        padding: 0px 0px 0px 0px
        width: 100%
        elements:
          - type: bar
            bar_min: '-10'
            bar_max: '35'
            bar_height: 2px
            bar_color: var(--fill-strong)
            bar_marker_size: 10px
            bar_values:
              - entity: weather.home
                attribute: temperature
                marker_color: var(--primary-text-color)
              - attribute: temperature
  # The weather, and today's chance of rain
  - padding: 0px 4px 0px 4px
    margin: 12px 0px 0px 0px
    align: start
    button_text_size: 16px
    buttons:
      - entity: weather.home
        background: false
        padding: 0px 0px 0px 0px
        align: spread
        elements:
          - type: icon
            icon: weather
            padding: 0px 4px 0px 0px
          - type: text
            weight: '700'
            margin: 0px auto 0px 0px
      - entity: weather.home
        forecast: daily
        background: false
        padding: 0px 0px 0px 0px
        align: spread
        elements:
          - type: icon
            icon: mdi:umbrella-outline
            margin: 0px 0px 0px auto
          - type: text
            attribute: precipitation_probability
            format: ' %'
            weight: '400'
