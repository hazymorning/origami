# Origami Weather's own sky, which follows the weather and the time of day: clouds, rain and snow, the sun by day,
# and the moon and the stars at night, with birds, planes and balloons now and then. The temperature stands in the middle,
# with the day's high and low, the wind and the humidity below it.
type: custom:origami-weather
weather_entity: weather.home
color_mode: theme
card_height: content
card_padding: 24px 20px 24px 20px
card_offset: 20px 0px 0px 0px
card_tap_action:
  action: more-info
# The sun and the moon stand on the right, away from the temperature
sun_moon_size: 48px
sun_moon_x: 84
content_align: between
content_align_items: center
grid_options:
  columns: full
  rows: auto
css: |
  /* Origami Weather with the Origami theme's values */
  :host {
    --origami-text-light: var(--primary-text-color);
    --origami-text-dark: var(--primary-text-color);
    --origami-bottom-font-weight: var(--ha-font-weight-normal);
    --origami-bottom-bg-filter: var(--blur-soft);
  }
  /* Rain, snow, birds and planes in calmer colors */
  #weather-effects { filter: saturate(.6); }
  /* On a wide screen, the heading above the card sets the space */
  @media (min-width: 768px) { :host { margin: 0 !important; } }
button_containers:
  # The temperature and the weather
  - padding: '0'
    margin: 0px 0px 24px 0px
    align: center
    buttons:
      - entity: weather.home
        background: false
        style: vertical
        align: center
        padding: '0'
        elements:
          - type: text
            attribute: temperature
            precision: 0
            format: °
            size: 58px
            weight: '700'
            color: var(--primary-text-color)
          - type: text
            size: 15px
            weight: '500'
  # The day's high and low, the wind and the humidity
  - padding: '0'
    gap: 18px
    align: center
    justify_content: center
    button_padding: '0'
    button_gap: 5px
    button_icon_size: 15px
    button_text_size: 13px
    buttons:
      - entity: weather.home
        forecast: daily
        background: false
        style: inline
        align: center
        padding: '0'
        elements:
          - type: icon
            icon: mdi:arrow-up
            icon_background: false
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
      - entity: weather.home
        forecast: daily
        background: false
        style: inline
        align: center
        padding: '0'
        elements:
          - type: icon
            icon: mdi:arrow-down
            icon_background: false
          - type: text
            attribute: templow
            precision: 0
            format: °
            weight: '500'
      - entity: weather.home
        background: false
        style: inline
        align: center
        padding: '0'
        elements:
          - type: icon
            icon: mdi:weather-windy
            icon_background: false
          - type: text
            attribute: wind_speed
            precision: 0
            fancy_unit: true
            weight: '700'
      - entity: weather.home
        background: false
        style: inline
        align: center
        padding: '0'
        elements:
          - type: icon
            icon: mdi:water-percent
            icon_background: false
          - type: text
            attribute: humidity
            format: ' %'
            weight: '700'
