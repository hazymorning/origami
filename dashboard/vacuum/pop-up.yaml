type: custom:bubble-card
card_type: pop-up
hash: '#popup_vacuum'
name: Vacuum
show_header: true
popup_mode: fit-content
hide_backdrop: false
margin: 7px
margin_top_mobile: 24px
margin_top_desktop: 30%
bg_opacity: '100'
bg_blur: '0'
backdrop_blur: '10'
button_type: name
show_icon: false
with_bottom_offset: true
performance_mode: performance
modules:
  - origami_base
  - origami_popup
origami_popup:
  gap: var(--ha-space-4)
  mini_popups:
    # The wrench above the rooms opens the parts, with the hours left before each one needs care
    maintenance:
      - type: custom:bubble-card
        card_type: separator
        name: Maintenance
        modules:
          - origami_header
      - type: custom:bubble-card
        card_type: sub-buttons
        modules:
          - origami_tiles
        origami_base:
          sub_button_height: 44px
        origami_tiles:
          layout: list
          slim: true
          dividers: true
          sign: none
          background: false
        sub_button:
          main: []
          bottom:
            # A part turns red and says Due once its time is up
            - entity: sensor.robot_main_brush_time_left
              name: Main brush
              icon: mdi:brush
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_side_brush_time_left
              name: Side brush
              icon: mdi:rotate-right
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_filter_time_left
              name: Filter
              icon: mdi:air-filter
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_sensor_time_left
              name: Sensors
              icon: mdi:leak
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
sub_button:
  main: []
  bottom: []
cards:
  - type: vertical-stack
    cards:
      # The vacuum's state as the name and how long ago it changed below it, with the battery and the bin at the end
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: vacuum.robot
        name: "{{ state_translated('vacuum.robot') }}"
        icon: mdi:robot-vacuum
        state_content: last_changed
        modules:
          - origami_base
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: more-info
        rows: auto
        sub_button:
          bottom_layout: rows
          main:
            # The battery says Charging while the vacuum charges in its dock
            - entity: sensor.robot_battery
              show_name: true
              show_icon: false
              show_background: false
              origami_base:
                name: ${num(state, 0, '%') || '–'}
                label: "${states('vacuum.robot') === 'docked' && Number(state) < 100 ? 'Charging' : 'Battery'}"
              tap_action:
                action: more-info
            # The bin, which fills with each run and turns red when full. A tap after emptying it sets it back to 0%.
            - entity: counter.vacuum_bin
              show_name: true
              show_icon: false
              show_background: false
              origami_base:
                name: ${num(Math.min(state / attr.maximum, 1) * 100, 0, '%') || '–'}
                name_color: "${Number(state) >= Number(attr.maximum) ? 'var(--error-color)' : ''}"
                label: Bin
              tap_action:
                action: perform-action
                perform_action: counter.reset
                target:
                  entity_id: counter.vacuum_bin
                confirmation:
                  text: Mark the bin as empty?
          bottom:
            - name: Controls
              group:
                # Start, or Resume after a pause. While the vacuum cleans, Pause takes its place.
                - name: Start
                  icon: mdi:play
                  show_name: true
                  origami_base:
                    name: "${state === 'paused' ? 'Resume' : ''}"
                    hidden: "${state === 'cleaning'}"
                    disabled: "${['unavailable', 'unknown'].includes(state)}"
                    'on': true
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.start
                    target:
                      entity_id: vacuum.robot
                - name: Pause
                  icon: mdi:pause
                  show_name: true
                  origami_base:
                    hidden: "${state !== 'cleaning'}"
                    'on': true
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.pause
                    target:
                      entity_id: vacuum.robot
                # Back to the dock, filled while the vacuum is on its way
                - name: Dock
                  icon: mdi:home-import-outline
                  fill_width: false
                  origami_base:
                    disabled: "${['docked', 'unavailable', 'unknown'].includes(state)}"
                    'on': "${state === 'returning'}"
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.return_to_base
                    target:
                      entity_id: vacuum.robot
                - name: Stop
                  icon: mdi:stop
                  fill_width: false
                  origami_base:
                    disabled: "${!['cleaning', 'paused', 'returning'].includes(state)}"
                    'on': false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.stop
                    target:
                      entity_id: vacuum.robot
      # The wrench opens the maintenance list and turns red when a part is due
      - type: custom:bubble-card
        card_type: separator
        name: Rooms
        modules:
          - origami_base
          - origami_header
        origami_header:
          icon_size: var(--icon-size-s)
        sub_button:
          main:
            - name: Maintenance
              icon: mdi:wrench-outline
              show_background: false
              origami_header:
                color: >-
                  ${['sensor.robot_main_brush_time_left', 'sensor.robot_side_brush_time_left',
                  'sensor.robot_filter_time_left', 'sensor.robot_sensor_time_left'].some((id) =>
                  Number(states(id)) <= 0) ? 'var(--error-color)' : ''}
              tap_action:
                action: fire-dom-event
                mini_popup: maintenance
      # A tap sends the vacuum to clean the room, the area in Home Assistant whose ID is cleaning_area_id.
      # While the vacuum cleans, the room it is in lights up. A button's name or css_class is that room's name in the vacuum's app.
      - type: custom:bubble-card
        card_type: sub-buttons
        scrolling_effect: false
        modules:
          - origami_base
          - origami_button
        origami_base:
          sub_button_height: var(--control-height-list)
          sub_button_text_size: var(--ha-font-size-m)
        origami_button:
          columns: 2
          active_style: toggle
          icon_size: var(--icon-size-s)
          padding: 0 0 var(--ha-space-2)
          active: "${states('vacuum.robot') === 'cleaning' ? states('sensor.robot_current_room') : ''}"
        sub_button:
          main: []
          bottom:
            - name: Living
              icon: mdi:sofa-outline
              css_class: living-room
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: living_room
            - name: Kitchen
              icon: mdi:silverware-fork-knife
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: kitchen
            - name: Bedroom
              icon: mdi:bed-outline
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: bedroom
            - name: Bathroom
              icon: mdi:shower
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: bathroom
      # The suction power. A level is filled while the vacuum has its fan speed, which each level's css_class names
      # as the vacuum's fan_speed_list attribute does.
      - type: custom:bubble-card
        card_type: sub-buttons
        scrolling_effect: false
        modules:
          - origami_base
          - origami_button
        origami_button:
          columns: 2
          segmented: Suction
          active: "${hass.states['vacuum.robot']?.attributes?.fan_speed ?? ''}"
        sub_button:
          main: []
          bottom:
            - name: Suction label
              group:
                - name: Suction
                  show_name: true
                  show_icon: false
                  origami_button:
                    background: transparent
                  tap_action:
                    action: none
            - name: Suction
              group:
                - name: '1'
                  css_class: quiet
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: quiet
                - name: '2'
                  css_class: balanced
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: balanced
                - name: '3'
                  css_class: turbo
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: turbo
                - name: '4'
                  css_class: max
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: max
