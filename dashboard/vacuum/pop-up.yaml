type: custom:bubble-card
card_type: pop-up
hash: '#popup_vacuum'
name: Vacuum
show_header: true
popup_mode: fit-content
margin: 7px
margin_top_mobile: 24px
margin_top_desktop: 30%
button_type: name
show_icon: false
with_bottom_offset: true
modules:
  - origami_base
  - origami_popup
origami_popup:
  gap: var(--ha-space-4)
  mini_popups:
    # The wrench above the rooms opens the parts, with the hours left before each one needs care
    maintenance:
      - type: custom:bubble-card
        card_type: separator
        name: Maintenance
        modules:
          - origami_header
      - type: custom:bubble-card
        card_type: sub-buttons
        modules:
          - origami_tiles
        origami_base:
          sub_button_height: 44px
        origami_tiles:
          layout: list
          slim: true
          dividers: true
          sign: none
          background: false
        sub_button:
          main: []
          bottom:
            # A part turns red and says Due once its time is up
            - entity: sensor.robot_main_brush_time_left
              name: Main brush
              icon: mdi:brush
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_side_brush_time_left
              name: Side brush
              icon: mdi:rotate-right
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_filter_time_left
              name: Filter
              icon: mdi:air-filter
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
            - entity: sensor.robot_sensor_time_left
              name: Sensors
              icon: mdi:leak
              origami_tiles:
                state: "${Number(state) <= 0 ? 'Due' : num(state, 0, attr.unit_of_measurement)}"
                state_color: "${Number(state) <= 0 ? 'var(--error-color)' : ''}"
    # The map key above the rooms opens the vacuum's map, with how long ago it changed
    map:
      - type: custom:bubble-card
        card_type: separator
        name: Map
        modules:
          - origami_header
        sub_button:
          main:
            - entity: image.robot_map
              show_name: true
              show_icon: false
              show_background: false
              origami_header:
                name: ${ago(state)}
              tap_action:
                action: none
      - type: picture-entity
        entity: image.robot_map
        show_name: false
        show_state: false
        tap_action:
          action: more-info
sub_button:
  main: []
  bottom: []
cards:
  - type: vertical-stack
    cards:
      # The vacuum's state as the name and how long ago it changed below it, with the battery at the end
      - type: custom:bubble-card
        card_type: button
        button_type: name
        entity: vacuum.robot
        name: "{{ state_translated('vacuum.robot') }}"
        icon: mdi:robot-vacuum
        state_content: last_changed
        modules:
          - origami_base
        tap_action:
          action: more-info
        button_action:
          tap_action:
            action: more-info
        rows: auto
        sub_button:
          bottom_layout: rows
          main:
            # The battery says Charging while the vacuum charges in its dock
            - entity: sensor.robot_battery
              show_name: true
              show_icon: false
              show_background: false
              origami_base:
                name: ${num(state, 0, '%') || '–'}
                label: "${states('vacuum.robot') === 'docked' && Number(state) < 100 ? 'Charging' : 'Battery'}"
              tap_action:
                action: more-info
          bottom:
            - name: Controls
              group:
                # Start, or Resume after a pause. While the vacuum cleans, Pause takes its place.
                - name: Start
                  icon: mdi:play
                  show_name: true
                  origami_base:
                    name: "${state === 'paused' ? 'Resume' : ''}"
                    hidden: "${state === 'cleaning'}"
                    disabled: "${['unavailable', 'unknown'].includes(state)}"
                    'on': true
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.start
                    target:
                      entity_id: vacuum.robot
                - name: Pause
                  icon: mdi:pause
                  show_name: true
                  origami_base:
                    hidden: "${state !== 'cleaning'}"
                    'on': true
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.pause
                    target:
                      entity_id: vacuum.robot
                # Back to the dock, filled while the vacuum is on its way
                - name: Dock
                  icon: mdi:home-import-outline
                  fill_width: false
                  origami_base:
                    disabled: "${['docked', 'unavailable', 'unknown'].includes(state)}"
                    'on': "${state === 'returning'}"
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.return_to_base
                    target:
                      entity_id: vacuum.robot
                # Stop, while there's no bin
                - name: Stop
                  icon: mdi:stop
                  fill_width: false
                  origami_base:
                    hidden: "${!!hass.states['counter.vacuum_bin']}"
                    disabled: "${!['cleaning', 'paused', 'returning'].includes(state)}"
                    'on': false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.stop
                    target:
                      entity_id: vacuum.robot
                # The bin, which fills with each run and turns red when full, drawn under styles below.
                # A tap sends the vacuum to the spot where the bin gets emptied and sets the bin back to empty.
                - entity: counter.vacuum_bin
                  name: Bin
                  icon: mdi:delete-outline
                  css_class: bin
                  fill_width: false
                  origami_base:
                    hidden: "${!hass.states['counter.vacuum_bin']}"
                    color: "${Number(state) >= Number(attr.maximum) ? 'var(--error-color)' : ''}"
                    'on': false
                  tap_action:
                    action: perform-action
                    perform_action: script.vacuum_empty_bin
                    data:
                      vacuum: vacuum.robot
                      counter: counter.vacuum_bin
                      spot: [25500, 27500]
                    confirmation:
                      text: Empty the bin?
        # The bin's key fills from the bottom as the bin fills, in red once it's full
        styles: |-
          ha-card .bubble-sub-button-bottom-container .bubble-sub-button.bin {
            background-image: linear-gradient(to top, ${(c => Number(c?.state) >= Number(c?.attributes?.maximum) ?
            'color-mix(in srgb, var(--error-color) 24%, transparent)' : 'var(--fill-strong)')(hass.states['counter.vacuum_bin'])}
            ${(c => Math.min(Number(c?.state) / Number(c?.attributes?.maximum), 1) * 100 || 0)(hass.states['counter.vacuum_bin'])}%,
            transparent 0) !important;
          }
      # The map opens the vacuum's map. The wrench opens the maintenance list and turns red when a part is due.
      - type: custom:bubble-card
        card_type: separator
        name: Rooms
        modules:
          - origami_base
          - origami_header
        origami_header:
          icon_size: var(--icon-size-s)
        sub_button:
          main:
            - name: Map
              icon: mdi:map-outline
              show_background: false
              origami_header:
                hidden: "${!hass.states['image.robot_map']}"
              tap_action:
                action: fire-dom-event
                mini_popup: map
            - name: Maintenance
              icon: mdi:wrench-outline
              show_background: false
              origami_header:
                color: >-
                  ${['sensor.robot_main_brush_time_left', 'sensor.robot_side_brush_time_left',
                  'sensor.robot_filter_time_left', 'sensor.robot_sensor_time_left'].some((id) =>
                  Number(states(id)) <= 0) ? 'var(--error-color)' : ''}
              tap_action:
                action: fire-dom-event
                mini_popup: maintenance
      # A tap sends the vacuum to clean the room, the area in Home Assistant whose ID is cleaning_area_id.
      # While the vacuum cleans, the room it is in lights up. A button's name or css_class is that room's name in the vacuum's app.
      - type: custom:bubble-card
        card_type: sub-buttons
        scrolling_effect: false
        modules:
          - origami_base
          - origami_button
        origami_base:
          sub_button_height: var(--control-height-list)
          sub_button_text_size: var(--ha-font-size-m)
        origami_button:
          columns: 2
          active_style: toggle
          icon_size: var(--icon-size-s)
          padding: 0 0 var(--ha-space-2)
          active: "${states('vacuum.robot') === 'cleaning' ? states('sensor.robot_current_room') : ''}"
        sub_button:
          main: []
          bottom:
            - name: Living
              icon: mdi:sofa-outline
              css_class: living-room
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: living_room
            - name: Kitchen
              icon: mdi:silverware-fork-knife
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: kitchen
            - name: Bedroom
              icon: mdi:bed-outline
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: bedroom
            - name: Bathroom
              icon: mdi:shower
              show_name: true
              tap_action:
                action: perform-action
                perform_action: vacuum.clean_area
                target:
                  entity_id: vacuum.robot
                data:
                  cleaning_area_id: bathroom
      # The vacuum's settings, each a label and a small switch. A choice is filled while it holds, which its css_class names.
      # Suction is the vacuum's fan speed, with the names its fan_speed_list attribute lists.
      # Passes and no-go zones only keep a choice in two helpers. They show only while the helpers exist.
      - type: custom:bubble-card
        card_type: sub-buttons
        scrolling_effect: false
        modules:
          - origami_base
          - origami_button
        origami_button:
          columns: 2
          segmented: Suction, Passes, No-go zones
          active: >-
            ${[hass.states['vacuum.robot']?.attributes?.fan_speed,
            'passes-' + states('input_select.vacuum_passes'),
            'zones-' + states('input_boolean.vacuum_no_go_zones')].join(',')}
        sub_button:
          main: []
          bottom:
            - name: Suction label
              group:
                - name: Suction
                  show_name: true
                  show_icon: false
                  origami_button:
                    background: transparent
                  tap_action:
                    action: none
            - name: Suction
              group:
                - name: '1'
                  css_class: quiet
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: quiet
                - name: '2'
                  css_class: balanced
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: balanced
                - name: '3'
                  css_class: turbo
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: turbo
                - name: '4'
                  css_class: max
                  show_name: true
                  show_icon: false
                  tap_action:
                    action: perform-action
                    perform_action: vacuum.set_fan_speed
                    target:
                      entity_id: vacuum.robot
                    data:
                      fan_speed: max
            - name: Passes label
              group:
                - name: Passes
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_select.vacuum_passes']}"
                  origami_button:
                    background: transparent
                  tap_action:
                    action: none
            - name: Passes
              group:
                - name: 1×
                  css_class: passes-1
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_select.vacuum_passes']}"
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.vacuum_passes
                    data:
                      option: '1'
                - name: 2×
                  css_class: passes-2
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_select.vacuum_passes']}"
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.vacuum_passes
                    data:
                      option: '2'
                - name: 3×
                  css_class: passes-3
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_select.vacuum_passes']}"
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    target:
                      entity_id: input_select.vacuum_passes
                    data:
                      option: '3'
            - name: No-go zones label
              group:
                - name: No-go zones
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_boolean.vacuum_no_go_zones']}"
                  origami_button:
                    background: transparent
                  tap_action:
                    action: none
            - name: No-go zones
              group:
                - name: 'On'
                  css_class: zones-on
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_boolean.vacuum_no_go_zones']}"
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.vacuum_no_go_zones
                - name: 'Off'
                  css_class: zones-off
                  show_name: true
                  show_icon: false
                  origami_base:
                    hidden: "${!hass.states['input_boolean.vacuum_no_go_zones']}"
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.vacuum_no_go_zones
