# Each favorite is a sub-button: a box with its icon and a short name, in a row that scrolls sideways.
# Its visibility conditions decide when it appears. A favorite lights up while its entity is on,
# and one whose tap opens a pop-up lights up when its on key says so.
type: custom:bubble-card
card_type: sub-buttons
modules:
  - origami_base
  - origami_button
origami_button:
  scroll: true
  # A little space below the row, before the next heading
  padding: 0 0 var(--ha-space-2)
grid_options:
  columns: full
  rows: auto
sub_button:
  main: []
  bottom:
    # Music, from 22:00 to 4:00
    - name: Music
      entity: media_player.bedroom
      icon: mdi:speaker
      force_icon: true
      show_name: true
      content_layout: icon-top
      origami_button:
        'on': ${state === 'playing'}
      visibility:
        - condition: time
          after: '22:00'
          before: '03:59:59'
      tap_action:
        action: navigate
        navigation_path: '#popup_music'
      hold_action:
        action: more-info
    # Fan, while it runs or when the living room or the bedroom is above 24°
    - name: Fan
      entity: fan.bedroom
      icon: mdi:fan
      show_name: true
      content_layout: icon-top
      origami_button:
        'on': ${state === 'on'}
      visibility:
        - condition: state
          entity: fan.bedroom
          state_not:
            - unavailable
            - unknown
        - condition: or
          conditions:
            - condition: state
              entity: fan.bedroom
              state: 'on'
            - condition: numeric_state
              entity: sensor.living_room_temperature
              above: 24
            - condition: numeric_state
              entity: sensor.bedroom_temperature
              above: 24
      tap_action:
        action: navigate
        navigation_path: '#popup_fan'
      hold_action:
        action: more-info
    # Dinner, with the recipe photo in place of the icon
    - name: Dinner
      entity: sensor.dinner
      icon: mdi:chef-hat
      show_name: true
      content_layout: icon-top
      origami_button:
        field: ${attr.recipe?.image}
      visibility:
        - condition: state
          entity: sensor.dinner
          state_not:
            - unknown
            - unavailable
        - condition: time
          after: '14:00'
          before: '20:59:59'
      tap_action:
        action: url
        url_path: https://tandoor.dev
      hold_action:
        action: more-info
    # Oven, only while it is on, and always first
    - name: Oven
      entity: sensor.oven
      icon: mdi:toaster-oven
      show_name: true
      content_layout: icon-top
      origami_button:
        'on': true
        color: var(--state-climate-heat-color)
        order: -2
      visibility:
        - condition: state
          entity: sensor.oven
          state_not: 'Off'
      tap_action:
        action: navigate
        navigation_path: '#popup_kitchen'
      hold_action:
        action: more-info
    # Vacuum. While it cleans, it comes first and its progress replaces the name.
    - name: Vacuum
      entity: vacuum.robot
      icon: mdi:robot-vacuum
      force_icon: true
      show_name: true
      content_layout: icon-top
      origami_button:
        name: >-
          ${(p => ['docked', 'returning'].includes(state) || p >= 99 ? 'Vacuum'
          : Number.isNaN(p) ? '' : p < 0 ? 'Error'
          : num(p, 0, '%'))(Math.round(states('sensor.robot_cleaning_progress')))}
        'on': ${state === 'cleaning'}
        order:
          cleaning: -1
      tap_action:
        action: navigate
        navigation_path: '#popup_vacuum'
      hold_action:
        action: more-info
    # Bath, with the remaining minutes, lit in blue while it runs
    - name: Bath
      entity: input_boolean.bath_time
      icon: mdi:shower
      show_name: true
      content_layout: icon-top
      origami_button:
        name:
          'on': ${num(minutesUntil('input_datetime.bath_time_end'), 0, 'minute')}
        color:
          'on': var(--blue-color)
      visibility:
        - condition: or
          conditions:
            - condition: state
              entity: input_boolean.bath_time
              state: 'on'
            - condition: time
              after: '11:00'
              before: '22:59:59'
      tap_action:
        action: toggle
      hold_action:
        action: more-info
    # Printer, with the remaining minutes while it prints
    - name: Printer
      entity: switch.printer
      icon: mdi:printer-outline
      show_name: true
      content_layout: icon-top
      origami_button:
        name:
          'on': ${num(minutesUntil('input_datetime.printer_end'), 0, 'minute')}
      tap_action:
        action: toggle
      hold_action:
        action: more-info
