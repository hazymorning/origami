# Each tile is a sub-button. Its visibility conditions decide when it appears.
# The tiles stand in one row that scrolls sideways. Without scroll, they stand in a grid of two columns.
type: custom:bubble-card
card_type: sub-buttons
modules:
  - origami_base
  - origami_tiles
origami_tiles:
  scroll: true
grid_options:
  columns: full
  rows: auto
sub_button:
  bottom:
    # Music, while the speaker plays, with the cover as its picture
    - name: Music
      entity: media_player.bedroom
      icon: mdi:speaker
      force_icon: true
      origami_tiles:
        color: var(--state-media_player-active-color)
        image: ${attr.entity_picture}
      visibility:
        - condition: state
          entity: media_player.bedroom
          state: playing
      tap_action:
        action: navigate
        navigation_path: '#popup_music'
      hold_action:
        action: more-info
    # Fan, while it runs or when the living room or the bedroom is above 24°
    - name: Fan
      entity: fan.bedroom
      icon: mdi:fan
      state_content: percentage
      visibility:
        - condition: state
          entity: fan.bedroom
          state_not:
            - unavailable
            - unknown
        - condition: or
          conditions:
            - condition: state
              entity: fan.bedroom
              state: 'on'
            - condition: numeric_state
              entity: sensor.living_room_temperature
              above: 24
            - condition: numeric_state
              entity: sensor.bedroom_temperature
              above: 24
      tap_action:
        action: navigate
        navigation_path: '#popup_fan'
      hold_action:
        action: more-info
    # Shopping list, while it has items, with their count as its name
    - name: Shopping
      entity: todo.shopping_list
      icon: mdi:cart-outline
      origami_tiles:
        name: "${num(state, 0)} ${Number(state) === 1 ? 'item' : 'items'}"
        state: To buy
      visibility:
        - condition: numeric_state
          entity: todo.shopping_list
          above: 0
      tap_action:
        action: navigate
        navigation_path: /todo?entity_id=todo.shopping_list
      hold_action:
        action: more-info
    # TV, while it's on
    - name: TV
      entity: media_player.living_room_tv
      icon: mdi:television
      visibility:
        - condition: state
          entity: media_player.living_room_tv
          state_not:
            - 'off'
            - standby
            - unavailable
            - unknown
      tap_action:
        action: navigate
        navigation_path: '#popup_tv'
      hold_action:
        action: more-info
    # The robot vacuum. While it cleans, the progress replaces its name.
    - name: Vacuum
      entity: vacuum.robot
      icon: mdi:robot-vacuum
      force_icon: true
      origami_tiles:
        name: >-
          ${(p => ['docked', 'returning'].includes(state) || p >= 99 ? 'Vacuum'
          : Number.isNaN(p) ? '' : p < 0 ? 'Error'
          : num(p, 0, '%'))(Math.round(states('sensor.robot_cleaning_progress')))}
        state:
          docked: ${word('off')}
          idle: ${word('off')}
          cleaning: Vacuum
        order:
          cleaning: -1
      tap_action:
        action: navigate
        navigation_path: '#popup_vacuum'
      hold_action:
        action: more-info
    # Kitchen timer, while it runs, with the minutes left, and always first
    - name: Timer
      entity: timer.kitchen
      icon: mdi:timer-outline
      origami_tiles:
        name:
          active: ${num(minutesUntil('timer.kitchen'), 0, 'minute')}
        color: var(--amber-color)
        order: -2
      visibility:
        - condition: state
          entity: timer.kitchen
          state_not: idle
      tap_action:
        action: more-info
