# Each tile is a sub-button. Its visibility conditions decide when it appears.
type: custom:bubble-card
card_type: sub-buttons
modules:
  - origami_base
  - origami_tiles
grid_options:
  columns: full
  rows: auto
origami_base:
  padding: 0 0 var(--ha-space-2) 0
sub_button:
  bottom:
    # Music, from 22:00 to 4:00
    - name: Bedroom
      entity: media_player.bedroom
      icon: mdi:speaker
      force_icon: true
      origami_tiles:
        state: Music
        color: var(--state-media_player-active-color)
      visibility:
        - condition: time
          after: '22:00'
          before: '03:59:59'
      tap_action:
        action: navigate
        navigation_path: '#popup_music'
      hold_action:
        action: more-info
    # Fan, while it runs or when the living room or the bedroom is above 24°
    - name: Fan
      entity: fan.bedroom
      icon: mdi:fan
      state_content: percentage
      visibility:
        - condition: state
          entity: fan.bedroom
          state_not:
            - unavailable
            - unknown
        - condition: or
          conditions:
            - condition: state
              entity: fan.bedroom
              state: 'on'
            - condition: numeric_state
              entity: sensor.living_room_temperature
              above: 24
            - condition: numeric_state
              entity: sensor.bedroom_temperature
              above: 24
      tap_action:
        action: navigate
        navigation_path: '#popup_fan'
      hold_action:
        action: more-info
    # Dinner, with the recipe photo as the icon
    - name: Cooking
      entity: sensor.dinner
      icon: mdi:chef-hat
      origami_tiles:
        state: Dinner
        image: ${attr.recipe?.image}
        image_size: 230%
      visibility:
        - condition: state
          entity: sensor.dinner
          state_not:
            - unknown
            - unavailable
        - condition: time
          after: '14:00'
          before: '20:59:59'
      tap_action:
        action: url
        url_path: https://tandoor.dev
      hold_action:
        action: more-info
    # Oven, only while it is on, and always first
    - name: Oven
      entity: sensor.oven
      icon: mdi:toaster-oven
      origami_tiles:
        color: var(--state-climate-heat-color)
        order: -2
      visibility:
        - condition: state
          entity: sensor.oven
          state_not: 'Off'
      tap_action:
        action: navigate
        navigation_path: '#popup_kitchen'
      hold_action:
        action: more-info
    # Vacuum. While it cleans, the progress replaces the name.
    - name: Vacuum
      entity: vacuum.robot
      icon: mdi:robot-vacuum
      force_icon: true
      origami_tiles:
        name: >-
          ${(p => ['docked', 'returning'].includes(state) || p >= 99 ? 'Vacuum'
          : Number.isNaN(p) ? '' : p < 0 ? 'Error'
          : num(p, 0, '%'))(Math.round(states('number.robot_cleaning_progress')))}
        state:
          docked: ${word('off')}
          idle: ${word('off')}
          cleaning: Vacuum
        order:
          cleaning: -1
      tap_action:
        action: navigate
        navigation_path: '#popup_vacuum'
      hold_action:
        action: more-info
    # Bath, with the remaining minutes while it runs
    - name: Bath
      entity: input_boolean.bath_time
      icon: mdi:shower
      origami_tiles:
        name:
          'on': ${num(minutesUntil('input_datetime.bath_time_end'), 0, 'minute')}
        state:
          'on': Running
          'off': Ready
        color:
          'on': var(--blue-color)
      visibility:
        - condition: or
          conditions:
            - condition: state
              entity: input_boolean.bath_time
              state: 'on'
            - condition: time
              after: '11:00'
              before: '22:59:59'
      tap_action:
        action: toggle
      hold_action:
        action: more-info
    # Printer, with the remaining minutes while it prints
    - name: Printer
      entity: switch.printer
      icon: mdi:printer-outline
      origami_tiles:
        name:
          'on': ${num(minutesUntil('input_datetime.printer_end'), 0, 'minute')}
        state:
          'on': Running
      tap_action:
        action: toggle
      hold_action:
        action: more-info
