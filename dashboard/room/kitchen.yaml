type: custom:bubble-card
card_type: pop-up
hash: '#popup_kitchen'
name: Kitchen
button_type: name
show_icon: false
scrolling_effect: false
margin: 7px
margin_top_mobile: 22px
margin_top_desktop: 30%
modules:
  - origami_base
  - origami_popup
cards:
  - type: vertical-stack
    cards:
      # Up next: tonight's dinner from a meal planner, with its photo in the icon and softly behind the card. Any entity with
      # a picture works the same, such as the next episode of a series.
      - type: custom:bubble-card
        card_type: button
        button_type: state
        entity: sensor.dinner_tonight
        name: "{{ states('sensor.dinner_tonight') }}"
        icon: mdi:silverware-fork-knife
        state_content: description
        scrolling_effect: false
        modules:
          - origami_base
        origami_base:
          art: ${attr.entity_picture}
        button_action:
          tap_action:
            action: more-info

      # Media: the speaker, with its cover in the icon
      - type: custom:bubble-card
        card_type: media-player
        button_type: state
        entity: media_player.kitchen
        name: Speaker
        icon: mdi:speaker
        modules:
          - origami_base
          - origami_media
        origami_base:
          group: true
        hide:
          power_button: true
          previous_button: true
          next_button: true
          volume_button: true
          play_pause_button: true
        tap_action:
          action: navigate
          navigation_path: '#popup_music'
        button_action:
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
        sub_button:
          bottom_layout: rows
          main:
            - icon: mdi:play
              show_background: true
              origami_base:
                icon: "${state === 'playing' ? 'mdi:pause' : ''}"
              tap_action:
                action: perform-action
                perform_action: media_player.media_play_pause
                target:
                  entity_id: media_player.kitchen
            - icon: mdi:skip-next
              show_background: false
              tap_action:
                action: perform-action
                perform_action: media_player.media_next_track
                target:
                  entity_id: media_player.kitchen
          bottom:
            - entity: media_player.kitchen
              sub_button_type: slider
              always_visible: true
        rows: auto

      # Light: one lamp with a slider, and the automation that turns it on with motion, as a row with a switch
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Light
            modules:
              - origami_base
              - origami_header
            origami_header:
              weight: medium
              icon_size: var(--icon-size-s)
            sub_button:
              main:
                - entity: light.kitchen
                  show_icon: false
                  show_name: true
                  show_background: false
                  origami_header:
                    name: "${state === 'on' ? (attr.brightness ? num(attr.brightness / 2.55, 0, '%') : 'On') : 'Off'}"
                  tap_action:
                    action: more-info
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: light.kitchen
            name: Counter
            icon: mdi:wall-sconce-flat
            modules:
              - origami_base
            origami_base:
              compact: true
              tile: true
            sub_button:
              main:
                - entity: light.kitchen
                  sub_button_type: slider
                  always_visible: true
                  allow_light_slider_to_0: true
            rows: 1
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: automation.kitchen_motion_light
            name: Motion
            icon: mdi:motion-sensor
            modules:
              - origami_base
            origami_base:
              compact: true
              toggle: true
              tile: true
            sub_button:
              main:
                - icon: mdi:circle
                  show_background: true
                  tap_action:
                    action: toggle
            rows: 1

      # Climate: the header shows the temperature and the humidity, with a dot in a color for the temperature
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Climate
            modules:
              - origami_base
              - origami_header
            origami_header:
              weight: medium
              icon_size: var(--icon-size-2xs)
            sub_button:
              main:
                # Without the humidity, the value shows the temperature in Home Assistant's words
                - entity: sensor.kitchen_temperature
                  icon: mdi:circle
                  show_state: true
                  show_background: false
                  origami_header:
                    name: ${num(state, 1)}° / ${num(states('sensor.kitchen_humidity'), 0, '%')}
                    # Blue up to 17°, green up to 22°, then yellow and orange, and red above 30°, in Celsius. Fahrenheit is converted first.
                    color: >-
                      ${(t => [[12, '#728FA8B3'], [15, '#7C97A9B3'], [17, '#8BA2A8B3'], [18.5, '#9AAEA3B3'],
                      [22, '#88A37EB3'], [24, '#99A677B3'], [25, '#AEA76FB3'], [26, '#BB9F68B3'],
                      [27, '#C0935FB3'], [28, '#BF8A5FB3'], [29, '#BB7E5DB3'], [30.5, '#B3735CB3'],
                      [32, '#AA6A5AB3'], [Infinity, '#9C6056B3']]
                      .find(([top]) => t <= top)?.[1] ?? 'transparent')
                      (hass.config.unit_system.temperature === '°F' ? (state - 32) / 1.8 : parseFloat(state))}
          # Minus and plus move the target by half a degree, and a tap on the card opens the thermostat
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: climate.kitchen
            name: Heating
            icon: mdi:thermostat
            modules:
              - origami_base
              - origami_climate
            origami_base:
              group: true
              tile: true
            button_action:
              tap_action:
                action: more-info
            sub_button:
              main:
                - icon: mdi:minus
                  show_background: true
                  tap_action:
                    action: perform-action
                    perform_action: script.thermostat_step
                    data:
                      thermostat: climate.kitchen
                      step: -0.5
                - entity: climate.kitchen
                  css_class: readout
                  show_icon: false
                  show_name: false
                  show_background: false
                  state_content: temperature
                - icon: mdi:plus
                  show_background: true
                  tap_action:
                    action: perform-action
                    perform_action: script.thermostat_step
                    data:
                      thermostat: climate.kitchen
                      step: 0.5
            rows: 1.375
          # A plug as a compact row with a switch
          - type: custom:bubble-card
            card_type: button
            button_type: switch
            entity: switch.kitchen_air_purifier
            name: Air purifier
            icon: mdi:air-filter
            modules:
              - origami_base
            origami_base:
              compact: true
              toggle: true
              tile: true
            sub_button:
              main:
                - icon: mdi:circle
                  show_background: true
                  tap_action:
                    action: toggle
            rows: 1

      # Everything off turns off the lamp and the air purifier. The thermostat keeps its setting, and the motion light stays ready.
      - type: custom:bubble-card
        card_type: sub-buttons
        modules:
          - origami_base
          - origami_button
        origami_button:
          background: false
          align: center
          muted: true
          icon_size: var(--icon-size-xs)
          padding: var(--ha-space-6) 0 100px 0
        sub_button:
          main: []
          bottom:
            - name: Everything off
              icon: mdi:power
              show_name: true
              tap_action:
                action: perform-action
                perform_action: homeassistant.turn_off
                target:
                  entity_id:
                    - light.kitchen
                    - switch.kitchen_air_purifier
