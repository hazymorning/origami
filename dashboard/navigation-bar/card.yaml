  }

  /* Right to left, the cover stands at the right, so its glow, its link and the progress start there */
  .media-player:dir(rtl) {
    --g-x: calc(var(--g-size) / 2 - var(--g-out));
  }

  .media-player:dir(rtl) .media-player-bg {
    -webkit-mask: linear-gradient(to left, #000, transparent 55%);
    mask: linear-gradient(to left, #000, transparent 55%);
  }

  .media-player:dir(rtl) .media-player-progress-bar-fill {
    transform-origin: right;
  }

  /* On a wider screen, the bar stands at the right edge, in the middle of its height */
  .navbar.desktop.right {
    right: 0px !important;
  }

  .navbar.desktop.right .navbar-card.desktop.right {
    border-radius: var(--ha-card-border-radius) 0px 0px var(--ha-card-border-radius) !important;
    border: 2px solid var(--fill-strong) !important;
    border-right: none !important;
    padding: var(--ha-space-4) var(--ha-space-4) var(--ha-space-4) var(--ha-space-3) !important;
  }
