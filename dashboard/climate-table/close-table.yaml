alias: Close the climate table
description: Closes the climate table once it has been open for 3 minutes.
mode: single
triggers:
  - trigger: state
    entity_id: input_boolean.climate_table
    to: 'on'
    for:
      minutes: 3
actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.climate_table
