name: Tidy up

# A one-off run. It starts when its own pull request is marked as ready for review, and at the end it closes that pull request and deletes its branch.
# For every branch with an open pull request, it gives the commits that an assistant made the repository owner's name and removes assistant trailers.
# Such a branch that starts with claude/ or ccr- gets the name falz/ instead. Branches whose pull requests are all closed are deleted.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency: tidy-up

jobs:
  tidy:
    name: Tidy up the branches
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      SELF: ${{ github.head_ref }}
      SELF_PR: ${{ github.event.pull_request.number }}
      NEW_NAME: ${{ github.repository_owner }}
      NEW_EMAIL: ${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com
      FILTER_BRANCH_SQUELCH_WARNING: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Clean up the branches
        shell: bash
        run: |
          set -uo pipefail
          note() { echo "- $1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo "## Tidy up" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "$NEW_NAME"
          git config user.email "$NEW_EMAIL"
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' > branches.txt
          mapfile -t branches < branches.txt
          for b in "${branches[@]}"; do
            case "$b" in main|next|"$SELF") continue ;; esac
            open=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$b" --jq 'length')
            all=$(gh api "repos/$REPO/pulls?state=all&head=$OWNER:$b" --jq 'length')
            if [ "$open" -gt 0 ]; then
              base=$(gh api "repos/$REPO/pulls?state=open&head=$OWNER:$b" --jq '.[0].base.ref')
              git fetch -q origin "$b" "$base"
              old=$(git rev-parse "origin/$b")
              git checkout -q -B tidy "origin/$b"
              git filter-branch -f \
                --env-filter '
                  if [ "$GIT_AUTHOR_EMAIL" = "noreply@anthropic.com" ]; then export GIT_AUTHOR_NAME="$NEW_NAME" GIT_AUTHOR_EMAIL="$NEW_EMAIL"; fi
                  if [ "$GIT_COMMITTER_EMAIL" = "noreply@anthropic.com" ]; then export GIT_COMMITTER_NAME="$NEW_NAME" GIT_COMMITTER_EMAIL="$NEW_EMAIL"; fi' \
                --msg-filter 'python3 -c "import re, sys; t = re.sub(r\"(?im)^(co-authored-by:.*(anthropic|claude).*|claude-session:.*|.*generated with \[claude code\].*)\n?\", \"\", sys.stdin.read()); sys.stdout.write(t.rstrip() + chr(10))"' \
                -- "origin/$base..tidy" > /dev/null 2>&1
              new=$(git rev-parse tidy)
              if [ "$new" != "$old" ]; then
                if git push -q --force-with-lease="refs/heads/$b:$old" origin "tidy:refs/heads/$b"; then
                  note "Rewrote the commits of \`$b\` with the owner's name and without assistant trailers."
                else
                  note "Could not rewrite the commits of \`$b\`."
                fi
              fi
              case "$b" in
                claude/*|ccr-*)
                  to="falz/${b#claude/}"
                  if gh api -X POST "repos/$REPO/branches/$b/rename" -f new_name="$to" > /dev/null 2>&1; then
                    note "Renamed \`$b\` to \`$to\`. Its open pull request moved along."
                  else
                    note "Could not rename \`$b\`. It goes away when its pull request is merged, or it can be renamed on the Branches page."
                  fi ;;
              esac
            elif [ "$all" -gt 0 ]; then
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null 2>&1; then
                note "Deleted \`$b\`, because its pull requests are closed."
              else
                note "Could not delete \`$b\`."
              fi
            else
              note "Left \`$b\` alone, because it has no pull request."
            fi
          done
          if gh api -X PATCH "repos/$REPO" -F delete_branch_on_merge=true > /dev/null 2>&1; then
            note "Branches are now deleted automatically when their pull request is merged."
          else
            note "To delete branches automatically after a merge, turn on Automatically delete head branches in [the settings](https://github.com/$REPO/settings)."
          fi

      - name: Close this pull request and delete its branch
        if: always()
        shell: bash
        run: |
          gh pr close "$SELF_PR" --repo "$REPO" --comment "The cleanup ran once. The summary of the run lists what changed: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$SELF" > /dev/null 2>&1 || true
