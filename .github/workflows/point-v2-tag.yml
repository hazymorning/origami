# One-off: point the V2.0 tag at the latest main. This file is never merged.
name: Point V2.0 at main
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move the V2.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: 2d518701458b81704db30ef7d5ad3a22f6f7888d
        run: |
          gh api -X PATCH "repos/$REPO/git/refs/tags/V2.0" -f sha="$TARGET" -F force=true
          gh api "repos/$REPO/git/refs/tags/V2.0" --jq .object.sha
