# The Graph module in the module reference. Light: the living room's last day in the temperature colors of the room cards,
# with the heating as soft blocks behind it and guide lines with their values. Dark: the energy of the last week, a bar for each
# day in own colors by value, green up to 10 kWh, then amber and red from 14 kWh.
