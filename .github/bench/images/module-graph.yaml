# The server's load of the last day behind its card, with processor and memory as the legend, from home.yaml's history.
# Light: around noon. Dark: late in the evening.
kind: panel
cards:
- type: custom:bubble-card
  card_type: button
  button_type: name
  entity: sensor.system_monitor_processor_use
  show_icon: false
  show_name: false
  modules:
    - origami_base
    - origami_graph
  origami_base:
    frameless: true
    padding: var(--ha-space-6)
    sub_button_height: var(--control-height-mini)
    sub_button_text_size: var(--ha-font-size-s)
  origami_graph:
    entities:
      - sensor.system_monitor_processor_use
      - sensor.system_monitor_memory_usage
    position: background
    height: 100%
    line: true
    fill: fade
    min: 0
    legend: true
  button_action:
    tap_action:
      action: more-info
  sub_button:
    main:
      - entity: sensor.system_monitor_processor_use
        name: CPU
        show_name: true
        show_icon: false
        show_background: true
      - entity: sensor.system_monitor_memory_usage
        name: RAM
        show_name: true
        show_icon: false
        show_background: true
