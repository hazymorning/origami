# The home view on a phone, as far as the screen reaches, with the navigation bar at the bottom. Light shows a gray midday
# with birds over the lake and the vacuum cleaning in the notifications, dark a clear night with a bath running in the
# notifications and the climate table open with all six rooms. In each, the first favorite is on and the others wait for a tap, and the vacuum never shows twice.
# The menu has its own image, because it is closed until it opens. The seed keeps the weather card's sky the same in every shot.
