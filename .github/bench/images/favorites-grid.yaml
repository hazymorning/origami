# The favorites as a grid of tiles, without scroll. In each moment, the first favorite is on and the others wait for a tap.
kind: panel
light:
  states:
    switch.printer: {state: 'off', attributes: {friendly_name: Printer}}
    vacuum.robot: {state: docked, attributes: {friendly_name: Robot, battery_level: 100}}
  cards:
    - {file: favorites/header.yaml}
    - file: favorites/tiles.yaml
      only: [Oven, Vacuum, Bath, Printer]
      with:
        origami_tiles: null
dark:
  states:
    input_boolean.bath_time: {state: 'off', attributes: {friendly_name: Bath time}}
  cards:
    - {file: favorites/header.yaml}
    - file: favorites/tiles.yaml
      only: [Music, Vacuum, Bath, Printer]
      with:
        origami_tiles: null
trim: 16
