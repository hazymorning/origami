# Three thermostats that are heating, idle and off
kind: panels
cards:
  - &climate
    type: custom:bubble-card
    card_type: button
    button_type: switch
    entity: climate.living_room
    name: Living room
    icon: mdi:radiator
    modules: [origami_base, origami_climate]
    origami_base: {group: true, tile: true}
    origami_climate:
      icons: {heating: mdi:radiator, preheating: mdi:radiator, 'off': mdi:radiator-off}
    sub_button:
      main:
        - {icon: mdi:minus, show_background: true}
        - {entity: climate.living_room, css_class: readout, show_icon: false, show_name: false, show_background: false, state_content: temperature}
        - {icon: mdi:plus, show_background: true}
    rows: 1.375
  - <<: *climate
    entity: climate.bedroom
    name: Bedroom
    sub_button:
      main:
        - {icon: mdi:minus, show_background: true}
        - {entity: climate.bedroom, css_class: readout, show_icon: false, show_name: false, show_background: false, state_content: temperature}
        - {icon: mdi:plus, show_background: true}
  - <<: *climate
    entity: climate.bathroom
    name: Bathroom
    sub_button:
      main:
        - {icon: mdi:minus, show_background: true}
        - {entity: climate.bathroom, css_class: readout, show_icon: false, show_name: false, show_background: false, state_content: temperature}
        - {icon: mdi:plus, show_background: true}
states:
  climate.living_room: {state: heat, attributes: {friendly_name: Living room, hvac_action: heating, hvac_modes: ['off', heat], temperature: 21.5, current_temperature: 20.4, min_temp: 7, max_temp: 30, target_temp_step: 0.5}}
  climate.bedroom: {state: heat, attributes: {friendly_name: Bedroom, hvac_action: idle, hvac_modes: ['off', heat], temperature: 18, current_temperature: 18.6, min_temp: 7, max_temp: 30, target_temp_step: 0.5}}
  climate.bathroom: {state: 'off', attributes: {friendly_name: Bathroom, hvac_action: 'off', hvac_modes: ['off', heat], temperature: null, current_temperature: 19.2, min_temp: 7, max_temp: 30, target_temp_step: 0.5}}
