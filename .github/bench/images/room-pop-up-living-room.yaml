# Midday: music from the speaker, one lamp on. Late evening: the TV with the speaker as its sound, the heating, and the scenes
# mini pop-up open with Late chosen.
kind: phone
home: true
open: '#popup_living_room'
cards:
  - {file: room/living-room.yaml}
states:
  media_player.living_room_tv_cast:
    state: playing
    attributes: {friendly_name: Living room TV, app_name: Netflix, media_title: Before the Storm, media_content_type: video, entity_picture: /local/tv-2.jpg}
  switch.living_room_console: {state: 'off', attributes: {friendly_name: Console}}
  light.living_room_tv: {state: 'off', attributes: {friendly_name: TV light, supported_color_modes: [brightness]}}
  light.living_room_ceiling: {state: 'off', attributes: {friendly_name: Ceiling, supported_color_modes: [brightness]}}
  scene.living_room_evening: {state: '2026-11-03T18:00:30+00:00', attributes: {friendly_name: Evening}}
  scene.living_room_night: {state: '2026-11-03T23:10:00+00:00', attributes: {friendly_name: Night}}
  scene.living_room_dinner: {state: '2026-11-02T19:00:00+00:00', attributes: {friendly_name: Dinner}}
  scene.living_room_movie: {state: '2026-11-01T20:30:00+00:00', attributes: {friendly_name: Movie}}
  fan.living_room: {state: 'off', attributes: {friendly_name: Living room fan, percentage: 0, percentage_step: 33.33}}
light:
  states:
    media_player.living_room:
      state: playing
      attributes: {friendly_name: Living room, volume_level: 0.24, media_title: Paper Boats, media_artist: Lumen Fields, media_content_type: music, entity_picture: /local/cover-1.jpg, source: WiFi, source_list: [WiFi, Bluetooth, Optical In], group_members: [media_player.living_room]}
    media_player.living_room_tv: {state: 'off', attributes: {friendly_name: Living room TV}}
    light.living_room:
      state: 'on'
      attributes: {friendly_name: Living room, brightness: 100, supported_color_modes: [brightness], color_mode: brightness, entity_id: [light.living_room_floor_lamp, light.living_room_string_lights, light.living_room_tv, light.living_room_table_lamp, light.living_room_ceiling]}
    light.living_room_floor_lamp: {state: 'off', attributes: {friendly_name: Floor lamp, supported_color_modes: [brightness]}}
    light.living_room_string_lights: {state: 'off', attributes: {friendly_name: String lights, supported_color_modes: [brightness]}}
    light.living_room_table_lamp: {state: 'on', attributes: {friendly_name: Table lamp, brightness: 100, supported_color_modes: [brightness], color_mode: brightness}}
    scene.living_room_morning: {state: '2026-11-04T07:05:00+00:00', attributes: {friendly_name: Morning}}
    scene.living_room_late: {state: '2026-11-03T21:40:00+00:00', attributes: {friendly_name: Late}}
    climate.living_room:
      state: heat
      attributes: {friendly_name: Living room, hvac_action: idle, hvac_modes: ['off', heat], temperature: 21, current_temperature: 21.4, min_temp: 7, max_temp: 30, target_temp_step: 0.5}
dark:
  click: ['ha-icon[icon="mdi:palette-outline"] >> nth=0']
  states:
    media_player.living_room:
      state: 'on'
      attributes: {friendly_name: Living room, volume_level: 0.31, source: Optical In, source_list: [WiFi, Bluetooth, Optical In], group_members: [media_player.living_room]}
    media_player.living_room_tv:
      state: 'on'
      attributes: {friendly_name: Living room TV, source: Netflix}
    light.living_room:
      state: 'on'
      attributes: {friendly_name: Living room, brightness: 70, supported_color_modes: [brightness], color_mode: brightness, entity_id: [light.living_room_floor_lamp, light.living_room_string_lights, light.living_room_tv, light.living_room_table_lamp, light.living_room_ceiling]}
    light.living_room_floor_lamp: {state: 'on', attributes: {friendly_name: Floor lamp, brightness: 80, supported_color_modes: [brightness], color_mode: brightness}}
    light.living_room_string_lights: {state: 'on', attributes: {friendly_name: String lights, brightness: 60, supported_color_modes: [brightness], color_mode: brightness}}
    light.living_room_table_lamp: {state: 'off', attributes: {friendly_name: Table lamp, supported_color_modes: [brightness]}}
    scene.living_room_morning: {state: '2026-11-04T07:05:00+00:00', attributes: {friendly_name: Morning}}
    scene.living_room_late: {state: '2026-11-04T22:10:00+00:00', attributes: {friendly_name: Late}}
    climate.living_room:
      state: heat
      attributes: {friendly_name: Living room, hvac_action: heating, hvac_modes: ['off', heat], temperature: 21, current_temperature: 20.6, min_temp: 7, max_temp: 30, target_temp_step: 0.5}
