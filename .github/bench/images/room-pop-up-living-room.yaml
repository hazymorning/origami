kind: phones
home: true
open: '#popup_living_room'
cards:
  - {file: room/living-room.yaml}
states:
  media_player.living_room:
    state: playing
    attributes: {friendly_name: Living room, volume_level: 0.28, source: Optical In, source_list: [WiFi, Bluetooth, Optical In], group_members: [media_player.living_room]}
  media_player.living_room_tv:
    state: 'on'
    attributes: {friendly_name: Living room TV, source: HDMI 1}
  media_player.living_room_tv_cast:
    state: playing
    attributes: {friendly_name: Living room TV, app_name: YouTube, media_title: Autumn in the Alps, media_content_type: video, entity_picture: /local/cover-2.jpg}
  switch.living_room_console: {state: 'off', attributes: {friendly_name: Console}}
  light.living_room:
    state: 'on'
    attributes: {friendly_name: Living room, brightness: 150, supported_color_modes: [brightness], color_mode: brightness, entity_id: [light.living_room_floor_lamp, light.living_room_string_lights, light.living_room_tv, light.living_room_table_lamp, light.living_room_ceiling]}
  light.living_room_tv: {state: 'off', attributes: {friendly_name: TV light, supported_color_modes: [brightness]}}
  light.living_room_ceiling: {state: 'off', attributes: {friendly_name: Ceiling, supported_color_modes: [brightness]}}
  light.living_room_floor_lamp: {state: 'on', attributes: {friendly_name: Floor lamp, brightness: 170, supported_color_modes: [brightness], color_mode: brightness}}
  light.living_room_string_lights: {state: 'on', attributes: {friendly_name: String lights, brightness: 110, supported_color_modes: [brightness], color_mode: brightness}}
  light.living_room_table_lamp: {state: 'on', attributes: {friendly_name: Table lamp, brightness: 140, supported_color_modes: [brightness], color_mode: brightness}}
  scene.living_room_evening: {state: '2026-11-04T18:00:30+00:00', attributes: {friendly_name: Evening}}
  scene.living_room_late: {state: '2026-11-03T21:40:00+00:00', attributes: {friendly_name: Late}}
  scene.living_room_night: {state: '2026-11-03T23:10:00+00:00', attributes: {friendly_name: Night}}
  scene.living_room_dinner: {state: '2026-11-02T19:00:00+00:00', attributes: {friendly_name: Dinner}}
  fan.living_room: {state: 'off', attributes: {friendly_name: Living room fan, percentage: 0, percentage_step: 33.33}}
  climate.living_room:
    state: heat
    attributes: {friendly_name: Living room, hvac_action: idle, hvac_modes: ['off', heat], temperature: 21, current_temperature: 21.4, min_temp: 7, max_temp: 30, target_temp_step: 0.5}
