        unit_of_measurement: '%'
        device_class: humidity
        friendly_name: Bathroom humidity
    climate.bathroom:
      state: heat
      attributes:
        friendly_name: Bathroom
        hvac_action: heating
        hvac_modes:
        - 'off'
        - heat
        temperature: 24
        current_temperature: 23.4
        min_temp: 7
        max_temp: 30
        target_temp_step: 0.5
