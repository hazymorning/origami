        friendly_name: Bright
    scene.bathroom_bath:
      state: '2026-11-03T21:30:00+00:00'
      attributes:
        friendly_name: Bath
    scene.bathroom_night:
      state: '2026-11-03T23:20:00+00:00'
      attributes:
        friendly_name: Night
    media_player.bathroom:
      state: playing
      attributes:
        friendly_name: Bathroom
        volume_level: 0.22
        media_title: Low Tide
        media_artist: Quiet Harbour
        media_content_type: music
        entity_picture: /local/cover-2.jpg
        source: Bluetooth
        source_list:
        - WiFi
        - Bluetooth
        group_members:
        - media_player.bathroom
    light.bathroom_mirror:
      state: 'off'
      attributes:
        friendly_name: Mirror
        supported_color_modes:
