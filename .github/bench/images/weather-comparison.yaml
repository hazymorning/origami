# The comparison card on its own. Light shows a rainy midday, and dark a clear night with a sunny day ahead.
# The card stands on its own here, so it has no offset above it.
kind: panel
cards:
  - file: weather/comparison.yaml
    with:
      card_offset: 0px 0px 0px 0px
light:
  states:
    weather.home:
      state: rainy
      attributes: {friendly_name: Home, temperature: 8.7, temperature_unit: °C, humidity: 88, wind_speed: 14, wind_speed_unit: km/h, pressure: 1006, supported_features: 3}
  messages:
    weather/subscribe_forecast:
      type: daily
      forecast:
        - {datetime: '2026-11-04T11:00:00+00:00', condition: rainy, temperature: 11, templow: 6, precipitation_probability: 80}
        - {datetime: '2026-11-05T11:00:00+00:00', condition: cloudy, temperature: 12, templow: 5, precipitation_probability: 30}
        - {datetime: '2026-11-06T11:00:00+00:00', condition: partlycloudy, temperature: 13, templow: 4, precipitation_probability: 10}
        - {datetime: '2026-11-07T11:00:00+00:00', condition: sunny, temperature: 14, templow: 5, precipitation_probability: 0}
dark:
  states:
    weather.home:
      state: clear-night
      attributes: {friendly_name: Home, temperature: 3.6, temperature_unit: °C, humidity: 81, wind_speed: 4, wind_speed_unit: km/h, pressure: 1021, supported_features: 3}
  messages:
    weather/subscribe_forecast:
      type: daily
      forecast:
        - {datetime: '2026-11-04T11:00:00+00:00', condition: sunny, temperature: 12, templow: 2, precipitation_probability: 0}
        - {datetime: '2026-11-05T11:00:00+00:00', condition: partlycloudy, temperature: 11, templow: 3, precipitation_probability: 10}
        - {datetime: '2026-11-06T11:00:00+00:00', condition: cloudy, temperature: 10, templow: 4, precipitation_probability: 20}
        - {datetime: '2026-11-07T11:00:00+00:00', condition: rainy, temperature: 9, templow: 5, precipitation_probability: 70}
