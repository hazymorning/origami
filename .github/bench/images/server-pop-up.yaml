# Midday: one update waits. Late evening: the update is in and all is good. Each graph shows the 24 hours before its time,
# with the nightly backup at 03:15 and a little more memory in use in the evening.
kind: phone
home: true
open: '#popup_server'
cards:
- {file: server/pop-up.yaml}
templates:
- {match: Uptime unknown, result: Up 12 days}
states:
  sensor.system_monitor_uptime:
    state: '2026-10-23T08:14:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Uptime}
  sensor.system_monitor_processor_use:
    state: '7'
    attributes: {unit_of_measurement: '%', friendly_name: Processor use}
  sensor.system_monitor_memory_usage:
    state: '35'
    attributes: {unit_of_measurement: '%', friendly_name: Memory usage}
  sensor.system_monitor_disk_usage:
    state: '46'
    attributes: {unit_of_measurement: '%', friendly_name: Disk usage /}
  sensor.backup_last_successful_automatic_backup:
    state: '2026-11-04T03:12:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Last successful automatic backup}
  sensor.backup_next_scheduled_automatic_backup:
    state: '2026-11-05T03:15:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Next scheduled automatic backup}
  sensor.backup_backup_manager_state:
    state: idle
    attributes: {friendly_name: Backup manager state}
  update.home_assistant_core_update:
    state: 'on'
    attributes: {friendly_name: Home Assistant Core Update, installed_version: 2026.10.4, latest_version: 2026.11.0}
  update.music_assistant_update:
    state: 'off'
    attributes: {friendly_name: Music Assistant Update}
