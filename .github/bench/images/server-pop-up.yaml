# Midday: one update waits. Late evening: the update is in, but the backups failed for five days, so the status says Backup due,
# the backup's age is orange and a backup started by hand is running. The graph shows home.yaml's load of the 24 hours
# before each time, with the nightly backup at 03:15 and a little more memory in use in the evening.
kind: phone
home: true
open: '#popup_server'
# The Origami row: by day the release has newer versions of two modules, and at night they are up to date
admin: true
cards:
- {file: server/pop-up.yaml}
templates:
- {match: Uptime unknown, result: Up 12 days}
states:
  update.origami: {state: 'off', attributes: {friendly_name: Origami, installed_version: V3.1, latest_version: V3.1, release_url: 'https://github.com/hazymorning/origami/releases/tag/V3.1'}}
  sensor.system_monitor_uptime:
    state: '2026-10-23T08:14:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Uptime}
  sensor.system_monitor_disk_usage:
    state: '46'
    attributes: {unit_of_measurement: '%', friendly_name: Disk usage /}
  sensor.backup_last_successful_automatic_backup:
    state: '2026-11-04T03:12:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Last successful automatic backup}
  sensor.backup_next_scheduled_automatic_backup:
    state: '2026-11-05T03:15:00+00:00'
    attributes: {device_class: timestamp, friendly_name: Next scheduled automatic backup}
  sensor.backup_backup_manager_state:
    state: idle
    attributes: {friendly_name: Backup manager state}
  update.home_assistant_core_update:
    state: 'on'
    attributes: {friendly_name: Home Assistant Core Update, installed_version: 2026.10.4, latest_version: 2026.11.0}
  update.music_assistant_update:
    state: 'off'
    attributes: {friendly_name: Music Assistant Update}
light:
  tools:
    origami_popup.yaml: 4.17.0
    origami_tiles.yaml: 3.8.0
  templates:
  - {match: Disk almost full, result: 1 update}
dark:
  tools: true
  templates:
  - {match: Disk almost full, result: Backup due}
  states:
    sensor.backup_last_successful_automatic_backup:
      state: '2026-10-31T03:12:00+00:00'
      attributes: {device_class: timestamp, friendly_name: Last successful automatic backup}
    sensor.backup_backup_manager_state:
      state: create_backup
      attributes: {friendly_name: Backup manager state}
    update.home_assistant_core_update:
      state: 'off'
      attributes: {friendly_name: Home Assistant Core Update, installed_version: 2026.11.0, latest_version: 2026.11.0}