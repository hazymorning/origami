# The README's first image, for GitHub's light and dark theme at once: the home view and the TV remote at night, and the
# music pop-up by day between them, on three phones turned toward the headline beside them. Each phone takes another image's
# file in its own mode and changes a few of its keys. At night it rains, and the rooms stay cards with the climate table closed.
kind: hero
headline:
  - A chill dashboard
  - for Home Assistant.
line:
  - Soft and simple, built the Home Assistant
  - way and refined over years of daily use.
phones:
  - from: home-view
    mode: dark
    dark:
      drop:
        - climate-table/card.yaml
      states:
        input_boolean.climate_table: {state: 'off', attributes: {friendly_name: Climate table}}
        weather.home: {state: rainy, attributes: {friendly_name: Home, temperature: 6, temperature_unit: °C, humidity: 94, wind_speed: 14, wind_speed_unit: km/h, pressure: 1004, supported_features: 3}}
  - from: music-pop-up
    mode: light
    light:
      states:
        media_player.living_room:
          state: playing
          attributes: {friendly_name: Living room, volume_level: 0.26, is_volume_muted: false, media_title: Daybreak, media_artist: Lumen Fields, media_album_name: Daylight, entity_picture: /local/cover-1.jpg, media_duration: 241, media_position: 96, media_position_updated_at: '2026-11-04T12:40:00+00:00', shuffle: false, repeat: 'off', source: Music Assistant, source_list: [Music Assistant, Bluetooth, Optical In], group_members: [media_player.living_room, media_player.kitchen], supported_features: 4127295}
        media_player.kitchen:
          state: playing
          attributes: {friendly_name: Kitchen, volume_level: 0.2, media_title: Daybreak, media_artist: Lumen Fields, entity_picture: /local/cover-1.jpg, group_members: [media_player.living_room, media_player.kitchen]}
  - from: tv-pop-up
    mode: dark
