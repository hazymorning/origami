# Origami theme. The file starts with the tokens, then sets the Home Assistant surfaces, then other cards' variables.

Origami:

  # Space
  ha-space-1: '4px'
  ha-space-2: '8px'
  ha-space-3: '12px'
  ha-space-4: '16px'
  ha-space-5: '20px'
  card-padding: 'var(--ha-space-3, 12px)'
  control-padding-x: 'var(--ha-space-4, 16px)'
  view-bleed: 'var(--ha-space-6, 24px)'

  # Radii
  ha-card-border-radius: '22px'
  radius-inner: 'calc(var(--ha-card-border-radius) / 1.3)'
  radius-circle: 'var(--ha-border-radius-circle, 50%)'
  radius-small: '8px'

  # Borders
  border-width: '0'
  border-color: 'color-mix(in srgb, var(--primary-text-color) var(--border-contrast), transparent)'
  card-ring: 'inset 0 0 0 var(--border-width) var(--border-color)'
  separator: 'var(--border-width) solid var(--fill-strong)'

  # Elevation
  # The flat version is for cards inside pop-ups. It has a shadow but no lift.
  card-elevation: 'var(--card-shadow), var(--card-ring)'
  card-elevation-flat: 'var(--card-shadow-flat), var(--card-ring)'

  # Chrome and fills
  # Fills are mixed from fill-base instead of the text color, so they stay warm.
  # fill-contrast sets their strength for each mode, because a light fill on a dark background looks stronger than a dark fill on white.
  toggle-on: 'color-mix(in srgb, var(--primary-text-color) 85%, var(--ha-card-background))'
  fill-subtle: 'color-mix(in srgb, var(--fill-base) var(--fill-contrast), transparent)'
  fill-strong: 'color-mix(in srgb, var(--fill-base) 12%, transparent)'
  fill-loud: 'color-mix(in srgb, var(--fill-base) 30%, transparent)'
  fill-active: 'var(--toggle-on)'
  accent-color-background: 'var(--ok-tint)'
  glow-accent: 'color-mix(in srgb, var(--toggle-on) 30%, transparent)'

  # A tile is a flat surface without a shadow. Its icon background uses the card background and a shadow.
  tile-background: 'var(--fill-subtle)'
  tile-chip-background: 'var(--ha-card-background)'
  tile-chip-shadow: 'var(--ha-card-box-shadow)'

  # Opacity
  opacity-disabled: '.3'
  opacity-quiet: '.45'
  opacity-muted: '.6'
  opacity-strong: '.8'

  # Sizes
  control-height-mini: 'var(--ha-space-8, 32px)'
  control-height-icon: 'var(--ha-space-10, 40px)'
  control-height-row: 'var(--ha-space-11, 44px)'
  control-height-list: 'var(--ha-space-12, 48px)'
  control-height-sm: 'var(--ha-space-13, 52px)'
  control-height: 'var(--ha-space-14, 56px)'
  control-height-lg: 'var(--ha-space-16, 64px)'
  tile-size: 'var(--ha-space-12, 48px)'
  tile-size-lg: 'var(--ha-space-20, 80px)'
  dot-size: '12px'
  icon-size-2xs: '14px'
  icon-size-xs: '18px'
  icon-size-s: 'var(--ha-space-5, 20px)'
  icon-size-m: 'var(--ha-space-6, 24px)'
  icon-size-l: 'var(--ha-space-7, 28px)'
  icon-size-xl: 'var(--ha-space-12, 48px)'
  ha-font-size-xl: '22px'
  ha-font-size-l: '18px'
  ha-font-size-m: '16px'
  ha-font-size-s: '14px'
  ha-font-size-xs: '14px'
  
  # Type
  primary-font-family: "'Montserrat', sans-serif"
  ha-font-family-body: 'var(--primary-font-family)'
  ha-font-family-code: 'var(--primary-font-family)'
  mdc-typography-font-family: 'var(--primary-font-family)'
  mdc-typography-button-font-family: 'var(--primary-font-family)'
  md-ref-typeface-plain: 'var(--primary-font-family)'
  ha-font-weight-light: '500'
  ha-font-weight-normal: '500'
  ha-font-weight-medium: '500'
  ha-font-weight-bold: '700'
  ha-line-height-condensed: '1.1'
  ha-line-height-normal: '1.3'
  ha-line-height-expanded: '1.6'
  font-size-compact: 'var(--ha-font-size-s)'
  font-size-headline: 'var(--ha-font-size-3xl, 28px)'

  # Motion
  duration-fast: 'var(--ha-animation-duration-fast, 150ms)'
  duration-normal: 'var(--ha-animation-duration-normal, 250ms)'
  duration-slow: 'var(--ha-animation-duration-slow, 350ms)'
  duration-bar: '700ms'
  ease-standard: 'cubic-bezier(.22, 1, .36, 1)'
  transition-interactive: 'background-color var(--duration-normal) ease, color var(--duration-normal) ease, box-shadow var(--duration-normal) ease'
  press-scale: '0.96'

  # Blur
  blur-soft: 'blur(12px)'
  blur-strong: 'blur(18px)'

  # Tracks
  track-height: '10px'
  track-height-sm: '6px'
  track-color: 'var(--fill-strong)'
  track-transition: 'width var(--duration-bar) var(--ease-standard)'
  track-transition-full: 'margin-left var(--duration-bar) var(--ease-standard), width var(--duration-bar) var(--ease-standard), left var(--duration-bar) var(--ease-standard)'

  # Scroller
  scroller-bleed: 'var(--view-bleed)'
  scroller-padding: 'var(--scroller-bleed) var(--scroller-bleed) var(--ha-space-10, 40px)'
  scroller-mask: 'linear-gradient(to right, transparent 0px, black var(--scroller-bleed), black calc(100% - var(--ha-space-12, 48px)), transparent 100%)'

  # Layout
  row-gap: '0px'
  column-gap: 'var(--ha-space-6, 24px)'
  header-height: 'var(--ha-space-15, 60px)'
  view-container-padding-top: 'var(--ha-space-4, 16px)'
  view-container-padding-bottom: 'var(--ha-space-4, 16px)'
  ha-view-sections-column-gap: 'var(--column-gap)'
  ha-view-sections-narrow-column-gap: 'var(--column-gap)'
  ha-view-sections-row-gap: 'var(--row-gap)'
  grid-card-gap: 'var(--ha-space-3)'
  horizontal-stack-card-gap: 'var(--ha-space-3)'
  vertical-stack-card-gap: 'var(--ha-space-3)'
  masonry-view-card-margin: '0px'

  # Cards
  card-background-color: 'var(--ha-card-background)'
  ha-card-border-width: '0px'
  ha-card-border-color: 'var(--border-color)'
  ha-card-box-shadow: 'var(--card-elevation)'
  ha-badge-border-radius: 'var(--radius-inner)'
  card-item-background: 'var(--fill-subtle)'
  ha-color-form-background: 'var(--fill-subtle)'
  outline-color: 'var(--border-color)'
  divider-color: 'var(--background-color)'
  gradient-background: 'linear-gradient(180deg, transparent 0%, var(--ha-card-background) 100%)'

  # Text and background
  primary-background-color: 'var(--background-color)'
  clear-background-color: 'var(--background-color)'
  lovelace-background: 'linear-gradient(180deg, var(--app-header-background-color) var(--safe-area-inset-top, 0px), var(--primary-background-color) 60%) fixed'
  text-color-active: 'var(--ha-card-background)'
  text-primary-color: 'var(--text-color-active)'
  ha-color-text-secondary: 'var(--secondary-text-color)'
  disabled-color: 'var(--disabled-text-color)'

  # Header and footer
  app-header-background-color: 'var(--dashboard-background)'
  app-header-backdrop-filter: 'var(--blur-soft)'
  app-header-text-color: 'var(--primary-text-color)'
  app-header-edit-text-color: 'var(--primary-text-color)'
  app-header-selection-bar-color: 'var(--accent-color)'
  app-theme-color: 'var(--dashboard-background)'
  ha-tab-active-text-color: 'var(--accent-color)'
  app-footer-background-color: 'transparent'
  transparent-app-footer-background-color: 'var(--backdrop-background-color)'

  # Sidebar
  sidebar-background-color: 'var(--card-item-background)'
  sidebar-text-color: 'var(--primary-text-color)'
  sidebar-icon-color: 'var(--primary-text-color)'
  sidebar-selected-icon-color: 'var(--accent-color)'

  # States
  # Home Assistant decides which color a device gets. For example, state-light-active-color is amber,
  # state-climate-heat-color is deep orange and state-media_player-active-color is light blue.
  # The named colors are set for each mode below. This list only contains the exceptions.
  # To change a domain's color, add its state-<domain>-active-color line. For domains with a color
  # for each state, such as climate, add state-<domain>-<state>-color instead.
  # Amber is only for lights. Home Assistant also uses it for switches, binary sensors and other
  # entities that only turn on and off, such as input_boolean, automation and script. The theme makes those green.
  state-icon-color: 'var(--primary-text-color)'
  state-light-active-color: 'var(--amber-color)'
  state-active-color: 'var(--green-color)'
  state-switch-active-color: 'var(--state-active-color)'
  state-binary_sensor-active-color: 'var(--state-active-color)'
  state-binary_sensor-window-on-color: 'var(--cyan-color)'
  state-binary_sensor-door-on-color: 'var(--cyan-color)'
  state-media_player-paused-color: 'var(--secondary-text-color)'
  state-cover-closed-color: 'var(--accent-color)'
  state-person-not_home-color: 'var(--secondary-text-color)'
  state-alarm_control_panel-disarmed-color: 'var(--accent-color)'
  history-unavailable-color: 'transparent'
  history-unknown-color: 'var(--dark-grey-color)'

  # Semantic color
  # Color shows that something is on, and the icon carries it. Each color has one value for each mode,
  # stored in Home Assistant's named colors in the modes below. The other colors come from it.
  # The background behind a colored icon is tint, which mixes the icon's color with the card
  # background at tint-strength. Set color to the state color and background-color to var(--tint) on
  # the same element. Badges and slider fills mix the color at fill-strength, with on-fill as the text color.
  # Lights are the exception. Amber is a light color, and on a light background it looks brown once it is
  # dark enough for an icon. In light mode, the color therefore moves into the icon's background,
  # which uses lamp-ink on lamp-field. Both are set for each mode below. In dark mode, they use the usual tint.
  # Text on solid amber uses on-amber, which is dark in both modes.
  success-color: 'var(--green-color)'
  warning-color: 'var(--orange-color)'
  error-color: 'var(--red-color)'
  on-fill: 'var(--primary-text-color)'
  on-amber: '#2F2D2A'
  tint: 'color-mix(in srgb, currentColor var(--tint-strength), var(--ha-card-background))'

  # These are old names. They stay until every card reads Home Assistant's state colors, and they will be removed later.
  lamp-color: 'var(--state-light-active-color)'
  heat-color: 'var(--state-climate-heat-color)'
  water-color: 'var(--state-climate-cool-color)'
  media-color: 'var(--state-media_player-active-color)'
  ok-color: 'var(--success-color)'
  lamp-tint: 'color-mix(in srgb, var(--lamp-color) var(--tint-strength), var(--ha-card-background))'
  heat-tint: 'color-mix(in srgb, var(--heat-color) var(--tint-strength), var(--ha-card-background))'
  water-tint: 'color-mix(in srgb, var(--water-color) var(--tint-strength), var(--ha-card-background))'
  media-tint: 'color-mix(in srgb, var(--media-color) var(--tint-strength), var(--ha-card-background))'
  ok-tint: 'color-mix(in srgb, var(--ok-color) var(--tint-strength), var(--ha-card-background))'
  lamp-fill: 'color-mix(in srgb, var(--lamp-color) var(--fill-strength), var(--ha-card-background))'
  heat-fill: 'color-mix(in srgb, var(--heat-color) var(--fill-strength), var(--ha-card-background))'
  water-fill: 'color-mix(in srgb, var(--water-color) var(--fill-strength), var(--ha-card-background))'
  media-fill: 'color-mix(in srgb, var(--media-color) var(--fill-strength), var(--ha-card-background))'
  ok-fill: 'color-mix(in srgb, var(--ok-color) var(--fill-strength), var(--ha-card-background))'
  error-fill: 'color-mix(in srgb, var(--error-color) var(--fill-strength), var(--ha-card-background))'
  lamp-wash: 'var(--lamp-fill)'
  heat-wash: 'var(--heat-fill)'
  water-wash: 'var(--water-fill)'
  media-wash: 'var(--media-fill)'
  ok-wash: 'var(--ok-fill)'
  accent-light-on: 'var(--lamp-ink)'
  accent-light-on-background: 'var(--lamp-field)'
  temperature-accent: 'var(--heat-color)'
  temperature-background: 'var(--heat-tint)'
  thermometer-accent: 'var(--heat-color)'
  thermometer-background: 'var(--heat-tint)'
  humidity-accent: 'var(--water-color)'
  humidity-background: 'var(--water-tint)'
  media-accent: 'var(--media-color)'
  media-background: 'var(--media-tint)'

  # Controls
  control-switch-on-color: 'var(--toggle-on)'
  control-switch-off-color: 'var(--grey-color)'
  slider-track-color: 'var(--scrollbar-thumb-color)'
  wa-color-on-normal: 'var(--primary-text-color)'
  ha-ripple-color: 'var(--card-item-background)'
  ha-ripple-hover-color: 'var(--accent-color-background)'
  ha-ripple-pressed-color: 'var(--accent-color-background)'
  ha-ripple-hover-opacity: '0.1'
  ha-ripple-pressed-opacity: '0.2'

  # Inputs
  input-ink-color: 'var(--primary-text-color)'
  input-label-ink-color: 'var(--primary-text-color)'
  input-fill-color: 'var(--fill-subtle)'
  input-idle-line-color: 'var(--background-color)'
  input-hover-line-color: 'var(--primary-color)'
  input-disabled-line-color: 'var(--fill-subtle)'
  input-dropdown-icon-color: 'var(--secondary-text-color)'
  input-disabled-fill-color: 'var(--background-color)'
  input-disabled-ink-color: 'var(--disabled-text-color)'
  mdc-text-field-fill-color: 'var(--input-fill-color)'
  mdc-text-field-label-ink-color: 'var(--secondary-text-color)'
  mdc-text-field-idle-line-color: 'var(--input-idle-line-color)'
  mdc-text-field-disabled-line-color: 'var(--input-disabled-line-color)'
  mdc-text-field-disabled-ink-color: 'var(--input-disabled-ink-color)'
  mdc-select-label-ink-color: 'var(--input-label-ink-color)'

  # Material
  mdc-theme-primary: 'var(--primary-color)'
  mdc-theme-secondary: 'var(--accent-color)'
  mdc-theme-surface: 'var(--ha-card-background)'
  mdc-theme-on-secondary: 'var(--text-color-active)'
  mdc-theme-on-surface: 'var(--primary-text-color)'
  mdc-theme-text-primary-on-background: 'var(--primary-text-color)'
  mdc-theme-text-secondary-on-background: 'var(--secondary-text-color)'
  mdc-theme-text-hint-on-background: 'var(--secondary-text-color)'
  mdc-theme-text-icon-on-background: 'var(--secondary-text-color)'
  ha-heading-card-title-font-weight: 'var(--ha-font-weight-bold)'
  md-list-item-label-text-weight: 'var(--ha-font-weight-medium)'
  md-list-item-label-text-color: 'var(--primary-text-color)'

  # Buttons
  ha-color-fill-primary-quiet-resting: 'var(--ha-card-background)'
  button-color-fill-normal-hover: 'color-mix(in srgb, var(--accent-color) 26%, var(--ha-card-background) 74%)'
  button-color-fill-normal-active: 'color-mix(in srgb, var(--accent-color) 34%, var(--background-color) 66%)'
  info-color: 'var(--accent-color)'

  # Dialogs
  ha-dialog-border-radius: 'var(--ha-card-border-radius)'
  ha-dialog-surface-background: 'color-mix(in srgb, var(--ha-card-background) 92%, transparent)'
  ha-dialog-surface-backdrop-filter: 'var(--blur-strong)'
  dialog-backdrop-filter: 'var(--blur-strong)'
  dialog-box-shadow: 'var(--shadow-elevated)'
  backdrop-background-color: 'color-mix(in srgb, var(--dashboard-background) 60%, transparent)'
  mdc-dialog-scroll-divider-color: 'var(--divider-color)'

  # Paper Buttons Row
  # The rgb variables need a triplet. A hex value breaks the color.
  pbs-button-color: 'var(--primary-text-color)'
  pbs-button-rgb-color: 'var(--rgb-primary-text-color)'
  pbs-button-rgb-state-color: 'var(--rgb-primary-text-color)'
  pbs-button-rgb-default-color: 'var(--rgb-primary-text-color)'
  rgb-state-default-color: 'var(--rgb-primary-text-color)'

  # Bubble Card
  # Bubble Card ignores the ha-card variables and draws its own surfaces, so each surface is set here.
  bubble-main-background-color: 'var(--ha-card-background)'
  bubble-secondary-background-color: 'var(--card-item-background)'
  bubble-icon-background-color: 'var(--card-item-background)'
  bubble-pop-up-main-background-color: 'var(--popup-background)'
  bubble-backdrop-background-color: 'var(--backdrop-background-color)'
  bubble-border-radius: 'var(--ha-card-border-radius)'
  bubble-accent-color: 'var(--accent-color)'
  bubble-light-color: 'var(--lamp-wash)'
  bubble-line-background-color: 'var(--secondary-text-color)'
  bubble-sub-button-light-background-color: 'var(--accent-color-background)'
  bubble-select-list-background-color: 'var(--ha-card-background)'
  bubble-select-main-background-color: 'var(--ha-card-background)'
  bubble-media-player-main-background-color: 'var(--ha-card-background)'
  bubble-select-list-width: '140px'
  modes:

    light:
      border-contrast: '8%'

      # Surfaces
      background-color: '#F6F5F3'
      dashboard-background: '#F2F0EB'
      ha-card-background: '#FFFFFF'
      popup-background: '#F0EEEA'

      # Text, icons
      primary-text-color: '#4F4C49'
      secondary-text-color: 'color-mix(in srgb, var(--primary-text-color) 78%, transparent)'
      fill-base: '#8A7A64'
      fill-contrast: '8%'
      icon-color: '#BDBBB8'
      disabled-text-color: '#BDBBB8'

      # Accent
      primary-color: '#8DA399'
      accent-color: '#8DA399'
      dark-primary-color: '#4A5B63'
      light-primary-color: '#BCC6CA'

      # These are Home Assistant's named colors with adjusted tones. The state colors point to them.
      # Amber is for lights, green for switches, other entities that are on and ok states, deep orange for heating,
      # blue for cooling and humidity, light blue for media, cyan for fans and open windows, teal for vacuums,
      # orange for warnings and red for errors.
      amber-color: '#E6C68A'
      orange-color: '#B27C43'
      deep-orange-color: '#AE6E55'
      red-color: '#A75050'
      pink-color: '#A3747C'
      purple-color: '#8C7185'
      deep-purple-color: '#766481'
      indigo-color: '#606883'
      blue-color: '#587397'
      light-blue-color: '#668A9F'
      cyan-color: '#668F90'
      teal-color: '#527B71'
      green-color: '#758671'
      light-green-color: '#7E8C6F'
      lime-color: '#828A60'
      yellow-color: '#98894A'
      brown-color: '#725F4F'
      light-grey-color: '#BFBDBA'
      grey-color: '#94928E'
      dark-grey-color: '#605D5A'
      blue-grey-color: '#77828A'
      tint-strength: '14%'
      fill-strength: '32%'
      wash-strength: '55%'
      weather-wash: '45%'

      # Lights in light mode. The color is in the icon background, and the icon uses the text color.
      lamp-field: '#F7E8CA'
      lamp-ink: 'var(--primary-text-color)'

      # Each shadow combines a small contact shadow with a softer main shadow. The blur is about three times the offset, and no shadow reaches upward.
      shadow-tint: '60, 50, 40'
      shadow-contact: '0 1px 2px rgba(var(--shadow-tint), 0.04)'
      card-shadow: 'var(--shadow-contact), 0 4px 12px -4px rgba(var(--shadow-tint), 0.07)'
      card-shadow-flat: 'var(--shadow-contact)'
      card-shadow-color: 'rgba(var(--shadow-tint), 0.15)'
      card-item-shadow: '0 1px 2px rgba(var(--shadow-tint), 0.1)'
      shadow-elevated: '0 2px 6px -2px rgba(var(--shadow-tint), 0.08), 0 16px 40px -12px rgba(var(--shadow-tint), 0.22)'
      navbar-shadow: '0px -1px 2px rgba(var(--shadow-tint), 0.03), 0px -8px 24px -8px rgba(var(--shadow-tint), 0.1)'

      # Header
      app-header-edit-background-color: 'color-mix(in srgb, var(--popup-background) 90%, transparent)'

      # Misc
      scrollbar-thumb-color: 'rgb(210, 210, 205)'
      album-cover-gradient: 'rgba(255, 255, 255, 0.55)'

      # Buttons, dialogs
      ha-color-fill-primary-loud-hover: 'color-mix(in srgb, var(--accent-color) 90%, #344046 10%)'
      ha-color-fill-primary-loud-active: 'color-mix(in srgb, var(--accent-color) 80%, #344046 20%)'
      mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.45)'

      # RGB helpers
      rgb-primary-color: '141, 163, 153'
      rgb-accent-color: '141, 163, 153'
      rgb-primary-text-color: '79, 76, 73'
      rgb-secondary-text-color: '118, 115, 113'
      rgb-card-background-color: '255, 255, 255'
      rgb-error-color: '167, 80, 80'
      rgb-warning-color: '178, 124, 67'
      rgb-success-color: '117, 134, 113'
      rgb-info-color: '141, 163, 153'

      # Primary color scale
      ha-color-primary-05: '#0A1610'
      ha-color-primary-10: '#142820'
      ha-color-primary-20: '#1E3D30'
      ha-color-primary-30: '#2D5A48'
      ha-color-primary-40: '#3E7560'
      ha-color-primary-50: '#5A9480'
      ha-color-primary-60: '#78AD9A'
      ha-color-primary-70: '#8DA399'
      ha-color-primary-80: '#B5CBC0'
      ha-color-primary-90: '#D9E8E0'
      ha-color-primary-95: '#ECF4EF'

    dark:
      border-contrast: '6%'

      # Surfaces
      background-color: '#181715'
      dashboard-background: '#181715'
      # Cards are two steps lighter than the background, so buttons on the background never look like cards.
      ha-card-background: '#2F2D2A'
      popup-background: '#181715'

      # Text, icons
      primary-text-color: '#E5E3DD'
      secondary-text-color: 'color-mix(in srgb, var(--primary-text-color) 64%, transparent)'
      fill-base: 'var(--primary-text-color)'
      fill-contrast: '5%'
      icon-color: '#A09E9A'
      disabled-text-color: '#65635F'

      # Accent
      primary-color: '#83A794'
      accent-color: '#6A8778'
      dark-primary-color: '#3D5C4C'
      light-primary-color: 'var(--ha-card-background)'

      # These are Home Assistant's named colors with adjusted tones. The state colors point to them.
      # Amber is for lights, green for switches, other entities that are on and ok states, deep orange for heating,
      # blue for cooling and humidity, light blue for media, cyan for fans and open windows, teal for vacuums,
      # orange for warnings and red for errors.
      amber-color: '#E6C68A'
      orange-color: '#EABA89'
      deep-orange-color: '#E2A58E'
      red-color: '#DA8282'
      pink-color: '#D8A9B1'
      purple-color: '#C6ABBF'
      deep-purple-color: '#B5A3C0'
      indigo-color: '#9EA7C3'
      blue-color: '#93ADCF'
      light-blue-color: '#A5C6DA'
      cyan-color: '#A1C6C7'
      teal-color: '#8EB4AB'
      green-color: '#AFC0AC'
      light-green-color: '#B9C7AA'
      lime-color: '#C5CCA4'
      yellow-color: '#DCCE96'
      brown-color: '#AE9A8B'
      light-grey-color: '#ADAAA7'
      grey-color: '#888682'
      dark-grey-color: '#575552'
      blue-grey-color: '#8F9AA2'
      tint-strength: '4%'
      fill-strength: '30%'
      wash-strength: '35%'
      weather-wash: '15%'

      # Lights in dark mode. The icon has the color, and its background is the usual tint.
      lamp-field: 'color-mix(in srgb, var(--state-light-active-color) var(--tint-strength), var(--ha-card-background))'
      lamp-ink: 'var(--state-light-active-color)'

      # Shadows. In dark mode, a card's lighter tone shows its height, and the shadow only supports it.
      shadow-tint: '0, 0, 0'
      shadow-hairline: 'inset 0 1px 0 rgba(255, 255, 255, 0.03)'
      shadow-contact: '0 1px 2px rgba(var(--shadow-tint), 0.35)'
      card-shadow: 'var(--shadow-hairline), var(--shadow-contact), 0 6px 16px -6px rgba(var(--shadow-tint), 0.45)'
      card-shadow-flat: 'var(--shadow-hairline), var(--shadow-contact)'
      card-shadow-color: 'rgba(var(--shadow-tint), 0.65)'
      card-item-shadow: 'var(--shadow-hairline), 0 1px 2px rgba(var(--shadow-tint), 0.4)'
      shadow-elevated: '0 2px 6px -2px rgba(var(--shadow-tint), 0.5), 0 20px 48px -12px rgba(var(--shadow-tint), 0.7)'
      navbar-shadow: '0px -1px 2px rgba(var(--shadow-tint), 0.3), 0px -10px 28px -8px rgba(var(--shadow-tint), 0.55)'

      # Header
      app-header-edit-background-color: 'color-mix(in srgb, var(--ha-card-background) 90%, transparent)'

      # Misc
      scrollbar-thumb-color: 'rgb(100, 100, 100)'
      album-cover-gradient: 'rgba(0, 0, 0, 0.35)'

      # Buttons, dialogs
      ha-color-fill-primary-loud-hover: 'color-mix(in srgb, var(--accent-color) 90%, #000000 10%)'
      ha-color-fill-primary-loud-active: 'color-mix(in srgb, var(--accent-color) 80%, #000000 20%)'
      mdc-dialog-scrim-color: 'rgba(0, 0, 0, 0.6)'

      # RGB helpers
      rgb-primary-color: '131, 167, 148'
      rgb-accent-color: '106, 135, 120'
      rgb-primary-text-color: '229, 227, 221'
      rgb-secondary-text-color: '163, 161, 157'
      rgb-card-background-color: '47, 45, 42'
      rgb-error-color: '218, 130, 130'
      rgb-warning-color: '234, 186, 137'
      rgb-success-color: '175, 192, 172'
      rgb-info-color: '106, 135, 120'

      # Primary color scale
      ha-color-primary-05: '#0B120E'
      ha-color-primary-10: '#131F18'
      ha-color-primary-20: '#20342A'
      ha-color-primary-30: '#2F4C3D'
      ha-color-primary-40: '#3F6553'
      ha-color-primary-50: '#5A8570'
      ha-color-primary-60: '#83A794'
      ha-color-primary-70: '#9CBAAB'
      ha-color-primary-80: '#B9D0C4'
      ha-color-primary-90: '#D8E7DE'
      ha-color-primary-95: '#EBF3EF'